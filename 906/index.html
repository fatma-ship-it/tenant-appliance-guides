<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CN Serene Suite Appliance Guides</title>
<meta name="description" content="How to use, care for and troubleshoot the appliances in your apartment.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2329;--muted:#5d6670;--line:#e2e0db;--accent:#0f5c78;--accent-ink:#fff;--soft:#e8f1f4;--warn:#9a2b1d;--warn-bg:#fdf0ed}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--accent);color:var(--accent-ink);padding:22px 0 20px}
header h1{margin:0;font-size:1.5rem;line-height:1.2}
header p{margin:6px 0 0;opacity:.9;font-size:.95rem}
main{padding:18px 0 40px}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.appl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.appl-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.appl h2{margin:0;font-size:1.15rem;line-height:1.25}
.appl .sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px 6px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);background:#fff;text-decoration:none;font-weight:600;font-size:.92rem;line-height:1.2}
.btn:active{background:var(--soft)}
@media (max-width:420px){.btns{grid-template-columns:1fr}.btn{justify-content:flex-start;padding:10px 14px}}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;text-decoration:none}
.gtitle{margin:4px 0 2px;font-size:1.35rem;line-height:1.25}
.gsub{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.tab{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;min-height:46px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem}
.tab[aria-current=page]{background:var(--accent);border-color:var(--accent);color:#fff}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;margin:0 0 14px}
.page{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
.page img{display:block;width:100%;height:auto}
.zoom{color:var(--muted);font-size:.85rem;margin:-4px 0 12px;text-align:center}
.stop{background:var(--warn-bg);border:1px solid #f0c9c1;color:var(--warn);border-radius:12px;padding:14px 16px;margin:18px 0 0;font-size:.95rem}
.stop strong{display:block;margin-bottom:2px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 6px}
.imp{background:#fff6dd;border:1px solid #f0d58a;border-left:6px solid #d99a00;border-radius:12px;padding:14px 16px;margin:0 0 16px;font-size:1rem}
.imp b{display:block;color:#8a5a00;letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.step h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:1.15rem;line-height:1.25}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1rem}
.step ul{margin:0 0 12px;padding-left:1.2em}
.step li{margin:0 0 8px;font-size:1.05rem;line-height:1.5}
.step li:last-child{margin-bottom:0}
.step ul:last-child,.fig:last-child{margin-bottom:0}
.fig{margin:0 0 12px}
.fig button{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.fig img{display:block;max-width:100%;max-height:300px;margin:0 auto;height:auto}
.fig figcaption{color:var(--muted);font-size:.8rem;margin-top:4px;text-align:center}
.c-red{color:#c0261b}.c-blue{color:#1f5fbf}.c-green{color:#1d7a35}.c-orange{color:#c25e00}
.gstop{background:var(--warn-bg);border:1px solid #f0c9c1;border-left:6px solid var(--warn);border-radius:12px;padding:14px 16px;margin:4px 0 16px;color:#5a1a12;font-size:1rem}
.gstop b{display:block;color:var(--warn);letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.src{color:var(--muted);font-size:.8rem;margin:0 0 16px}
.next{display:flex;justify-content:space-between;gap:8px;margin:0 0 14px}
.next a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;font-weight:600;text-align:center;padding:6px}
details.printed{margin:0 0 14px}
details.printed summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent);cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;overflow:auto;display:flex;align-items:center;justify-content:center;padding:56px 8px 16px}
.lb img{max-width:100%;height:auto;background:#fff;border-radius:6px}
.lb button{position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:1.4rem;line-height:1}
.swipe{color:var(--muted);font-size:.8rem;text-align:center;margin:0 0 10px}
footer{color:var(--muted);font-size:.85rem;padding:0 0 30px}
</style>
</head>
<body>
<header><div class="wrap"><h1>CN Serene Suite Appliance Guides</h1><p>How to use, care for and fix common problems with the appliances in your apartment.</p></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap">Toronto Boutique Apartments</footer>
<script>
const DATA=[{"slug": "whirlpool-front-load-washer", "title": "Whirlpool washer", "sub": "Front-load, models WFW9351 / WFW9151", "icon": "washer", "guides": [{"key": "whirlpool-front-load-washer-how-to-use", "label": "How to Use", "pdf": "/files/whirlpool-front-load-washer-how-to-use.pdf", "pages": [{"src": "/pages/whirlpool-front-load-washer-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 738, "phone": {"kicker": "WASHER GUIDE", "title": "How to Use the Washer", "model": "Whirlpool Model WFW9351 or WFW9151 (to confirm)", "important": "Never wash anything with gasoline or other flammable fluids on it: fire risk. Use only HE (High Efficiency) detergent. Do not overload. Do not reach in while the drum moves, and do not let children play on or in the washer. Run the washer only when you are home, and never on an extension cord.", "stop": "Water leaks. An error code comes back after a restart, or the washer will not fill or drain. A burning smell, smoke, or grinding or banging noise. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s manual W10432633A for Whirlpool front-loading washer models WFW9351 and WFW9151. Pictures are taken from that manual.", "steps": [{"title": "Load", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/load-drum-p9.png", "w": 768, "h": 488, "cap": "From the manufacturer's manual, page 9."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/load-sizes-p8.png", "w": 1142, "h": 315, "cap": "From the manufacturer's manual, page 8."}, {"html": "Sort by colour and fabric. Keep very dirty items and delicates apart."}, {"html": "Empty pockets, close zippers and hooks, tie strings. Coins can block the pump."}, {"html": "Load loosely, mixing large and small items. Do not wash a single item alone. Small items go in mesh bags."}, {"html": "Small load: 3 to 5 items (1/4 full). Medium: 1/2. Large: 3/4. Clothes must tumble freely."}, {"html": "Push the door until the latch clicks."}]}, {"title": "Detergent", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/detergent-drawer-p10.png", "w": 767, "h": 441, "cap": "From the manufacturer's manual, page 10."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/bleach-compartment-p10.png", "w": 768, "h": 453, "cap": "From the manufacturer's manual, page 10."}, {"html": "<strong>HE detergent</strong>, liquid or powder, in its compartment. Colour-safe bleach can go with it. Do not mix powder and liquid."}, {"html": "<strong>Fabric softener</strong> (liquid only): max 1/4 cup (60 mL), not past MAX. No softener balls."}, {"html": "<strong>Chlorine bleach</strong>: max 2/3 cup (165 mL), not past MAX. Never colour-safe bleach here."}, {"html": "Never pour products straight onto clothes."}, {"html": "Close the drawer slowly and fully. A little water left in it is normal."}]}, {"title": "Cycle and options", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/cycle-knob-p11.png", "w": 767, "h": 577, "cap": "From the manufacturer's manual, page 11."}, {"html": "Press and hold <strong>POWER</strong>, then turn the knob."}, {"html": "<strong>Normal</strong>: everyday loads. <strong>Heavy Duty</strong>: towels, jeans. <strong>Whitest Whites</strong>. <strong>Cold Wash</strong>: colours. <strong>Delicate</strong>: lingerie, sweaters. <strong>Bulky Items</strong>: comforters. <strong>Small Load</strong>: 3 to 5 items. <strong>Rinse/Drain &amp; Spin</strong>: spin out a wet <strong>load</strong>."}, {"html": "<strong><span class=\"c-red\">Not sure?</span> Choose</strong> <span class=\"c-red\"><strong>Normal</strong></span> for everyday laundry."}, {"html": "Buttons under the display change Temperature, Spin and Soil Level. Faster spin means drier clothes but more wrinkles."}, {"html": "<strong>Extra Rinse</strong>, <strong>Delay Start</strong> (up to 10 h, use powder detergent)."}, {"html": "<strong>TumbleFresh</strong>: keeps clean clothes from sitting still and getting musty when you can&#x27;t empty the washer right away. After the wash ends, the drum turns the clothes over every now and then, for up to 6 hours. Turn it on before starting the wash: press TumbleFresh until its light comes on. While it runs, the Done light stays on, the TumbleFresh light flashes and the door stays locked. Press <strong>POWER</strong> any time to stop it and unlock the door; otherwise it stops by itself after 6 hours. It doesn&#x27;t work when spin speed is set to No Spin."}]}, {"title": "Start and finish", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/start-pause-p11.png", "w": 786, "h": 316, "cap": "From the manufacturer's manual, page 11."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/door-p12.png", "w": 823, "h": 468, "cap": "From the manufacturer's manual, page 12."}, {"html": "Press and hold <strong>START/PAUSE</strong>. The door locks, unlocks and locks again: normal. Start within 5 minutes or it turns off."}, {"html": "<strong>Add 1 or 2 items</strong> while Add a Garment is lit: press START/PAUSE once, wait for the door to unlock."}, {"html": "<strong>Pause</strong>: press START/PAUSE once; hold it to continue. <strong>Cancel</strong>: press POWER. <strong>Lock buttons</strong>: hold Control Lock 3 s."}, {"html": "At the end, the <strong>Done</strong> light comes on in the display (picture below). Unload straight away and check the door seal for small items. If <strong>TumbleFresh</strong> is on, Done stays lit and the door stays locked: press <strong>POWER</strong> to unlock."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/status-lights-p6.png", "w": 655, "h": 276, "cap": "Display on model WFW9151 (WFW9351 has the same Done light). Manual, page 6."}, {"html": "Leave the door open so the drum dries. Open and close it before the next wash."}]}]}}, {"key": "whirlpool-front-load-washer-care", "label": "Appliance Care", "pdf": "/files/whirlpool-front-load-washer-care.pdf", "pages": [{"src": "/pages/whirlpool-front-load-washer-care-1.jpg", "w": 1870, "h": 1445}], "kb": 601, "phone": {"kicker": "WASHER GUIDE", "title": "Washer Care", "model": "Whirlpool Model WFW9351 or WFW9151 (to confirm)", "important": "Wear rubber gloves when cleaning with bleach and follow the bleach label. Do not use abrasive cleaners, and do not take any part of the washer apart. Use only HE detergent and measure it: too much leaves residue and causes smells.", "stop": "A water hose behind the washer is bulging, cracked, kinked or leaking (the manual says hoses should be replaced every 5 years). A bad smell stays after the monthly clean. The washer needs to be moved, or the room could freeze. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s manual W10432633A for Whirlpool front-loading washer models WFW9351 and WFW9151. Pictures are taken from that manual.", "steps": [{"title": "After every load", "items": [{"img": "/img/whirlpool-front-load-washer-care/door-p12.png", "w": 823, "h": 468, "cap": "From the manufacturer's manual, page 12."}, {"html": "Take the laundry out as soon as the cycle ends."}, {"html": "Leave the door open so the washer can dry. This prevents smells."}, {"html": "Wipe spills on the outside with a soft damp cloth, with mild soap if needed."}, {"html": "Now and then, wipe the inside of the door glass. Residue there can cause drips."}]}, {"title": "Monthly clean (or every 30 washes)", "items": [{"img": "/img/whirlpool-front-load-washer-care/cycle-knob-p11.png", "w": 767, "h": 577, "cap": "From the manufacturer's manual, page 11."}, {"html": "Empty drum. Put one <strong>AFFRESH</strong> tablet in the drum, or 2/3 cup (160 mL) of liquid chlorine bleach in the bleach compartment. No detergent."}, {"html": "Close the door and drawer. Press <strong>POWER</strong>, turn the knob to <strong>CLEAN WASHER with affresh</strong>, press and hold <strong>START/PAUSE</strong>."}, {"html": "For about 3 minutes the drum turns and the door locks and unlocks: normal. If the Wash light flashes, take out what is in the drum and start again."}, {"html": "Let it finish. If stopped, &quot;Int&quot; shows and the door can take up to 10 minutes to unlock. Then leave the door slightly open."}]}, {"title": "Dispenser drawer", "items": [{"img": "/img/whirlpool-front-load-washer-care/drawer-release-p13.png", "w": 767, "h": 528, "cap": "From the manufacturer's manual, page 13."}, {"html": "Pull the drawer out until it stops. Press down on the release lever and pull it straight out."}, {"img": "/img/whirlpool-front-load-washer-care/drawer-insert-p13.png", "w": 767, "h": 502, "cap": "From the manufacturer's manual, page 13."}, {"html": "Lift out the insert. Wash both in warm soapy water, rinse, and dry. Not dishwasher safe."}, {"img": "/img/whirlpool-front-load-washer-care/drawer-refit-p13.png", "w": 767, "h": 408, "cap": "From the manufacturer's manual, page 13."}, {"html": "Put the insert back, line the drawer up with the guides and slide it in."}]}, {"title": "Door seal and time away", "items": [{"img": "/img/whirlpool-front-load-washer-care/door-seal-p13.png", "w": 768, "h": 372, "cap": "From the manufacturer's manual, page 13."}, {"html": "Pull back the seal and check for stains and small objects."}, {"html": "Wipe stains with a damp cloth and 3/4 cup (177 mL) of liquid chlorine bleach in 1 gallon (3.8 L) of warm water. Leave 5 minutes, wipe dry, leave the door open."}, {"html": "Run the washer only when you are home. Before a long trip, ask property management whether the water taps behind the washer should be turned off."}, {"html": "After a long time unused, run a Normal cycle with half the usual HE detergent and no clothes."}]}]}}, {"key": "whirlpool-front-load-washer-troubleshooting", "label": "Troubleshooting", "pdf": "/files/whirlpool-front-load-washer-troubleshooting.pdf", "pages": [{"src": "/pages/whirlpool-front-load-washer-troubleshooting-1.jpg", "w": 1870, "h": 1445}], "kb": 454, "phone": {"kicker": "WASHER GUIDE", "title": "Washer Troubleshooting", "model": "Whirlpool Model WFW9351 or WFW9151 (to confirm)", "important": "Do not open the washer cabinet or try to repair it. If water is leaking near an electrical outlet, do not touch the washer or the plug.", "stop": "Water leaks from the washer, the hoses or the door. An error code comes back after you restart, or the washer will not fill or drain. A burning smell, smoke, or a loud grinding or banging noise. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s manual W10432633A for Whirlpool front-loading washer models WFW9351 and WFW9151. Pictures are taken from that manual.", "steps": [{"title": "A code shows", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/display-knob-p11.png", "w": 767, "h": 442, "cap": "From the manufacturer's manual, page 11."}, {"html": "<strong>Sd</strong>: too many suds. Let it carry on. If the knob lights flash, choose the cycle again with a cold temperature and press START/PAUSE. Next time use less HE detergent."}, {"html": "<strong>F8 E1</strong>: no water. Check both taps behind the washer are on and the hoses are not kinked. Press START/PAUSE once to clear, then again to restart."}, {"html": "<strong>F9 E1</strong>: cannot drain. Check the drain hose is not kinked or blocked, then clear and restart."}, {"html": "<strong>Other F/E code</strong>: press POWER. If water is left, run RINSE/DRAIN &amp; SPIN. If it comes back, contact property management."}]}, {"title": "Won't start or door won't open", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/start-pause-p11.png", "w": 786, "h": 316, "cap": "From the manufacturer's manual, page 11."}, {"html": "Close the door until it latches, then press and hold START/PAUSE. After a cycle, open and close the door first."}, {"html": "Control Lock light on: hold Control Lock (Cycle Signal on some models) for 3 seconds. Check the plug and breaker."}, {"img": "/img/whirlpool-front-load-washer-troubleshooting/status-lights-both-p6.png", "w": 1525, "h": 303, "cap": "From the manufacturer's manual, page 6. Both models are shown."}, {"html": "Door locked: press START/PAUSE once and wait for the drum to stop. If water is left, run RINSE/DRAIN &amp; SPIN. If TumbleFresh is on, press POWER."}]}, {"title": "Wet clothes, noise or suds", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/load-sizes-p8.png", "w": 1142, "h": 315, "cap": "From the manufacturer's manual, page 8."}, {"html": "Still wet: run RINSE/DRAIN &amp; SPIN with no detergent. Spread out a tight or one-item load, or take half out and spin again. Delicate cycles leave clothes wetter."}, {"html": "Clicks at the start (door lock), humming while draining, and zips touching the drum are normal."}, {"html": "Shaking: don&#x27;t wash a single item or pack the drum. Use Bulky Items for comforters. If it still moves, contact property management."}, {"img": "/img/whirlpool-front-load-washer-troubleshooting/detergent-drawer-p10.png", "w": 767, "h": 441, "cap": "From the manufacturer's manual, page 10."}, {"html": "Suds or drips at the door: use only measured HE detergent and wipe the door glass."}]}, {"title": "Smell, poor results, timing", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/door-seal-p13.png", "w": 768, "h": 372, "cap": "From the manufacturer's manual, page 13."}, {"html": "Bad smell: run the monthly clean (see Appliance Care) and leave the door open between washes."}, {"html": "Not clean: don&#x27;t pack the drum, use the dispenser, no softener balls. Grey whites: wash apart from darks, warmer water if the label allows."}, {"html": "Wrinkles: load loosely, slower spin, unload straight away."}, {"html": "Low-looking water, a changing time left, or an option that won&#x27;t light up for that cycle: all normal."}]}]}}]}, {"slug": "frigidaire-dishwasher", "title": "Frigidaire dishwasher", "sub": "", "icon": "dishwasher", "guides": [{"key": "frigidaire-dishwasher-how-to-use", "label": "How to Use", "pdf": "/files/frigidaire-dishwasher-how-to-use.pdf", "pages": [{"src": "/pages/frigidaire-dishwasher-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 431, "phone": {"kicker": "DISHWASHER GUIDE", "title": "How to Use the Dishwasher", "model": "Frigidaire dishwasher (model to confirm)", "important": "Use only automatic dishwasher detergent, never hand dish soap. Load knives and sharp items pointing down. Do not let children play in or on the dishwasher or sit or stand on the open door. Open the door slowly during a cycle: hot water can splash out. Do not touch the heating element at the bottom during or right after a cycle.", "stop": "Water leaks or pools under the dishwasher. Error code i1 or i4 shows, or it will not fill or drain. A burning smell, smoke, or a grinding noise that keeps going. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Use &amp; Care manual A15931101 for this Frigidaire dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Load", "items": [{"img": "/img/frigidaire-dishwasher-how-to-use/upper-basket-p7.png", "w": 453, "h": 450, "cap": "Upper basket. From the manufacturer's manual, page 7."}, {"img": "/img/frigidaire-dishwasher-how-to-use/lower-basket-p7.png", "w": 453, "h": 453, "cap": "Lower basket. From the manufacturer's manual, page 7."}, {"html": "Scrape off large food, bones and toothpicks. Empty glasses and cups. Rinse only if the dishes will wait before washing."}, {"html": "<strong>Upper basket</strong>: glasses, cups, small plates and plastics marked dishwasher safe. Open side down, tilted slightly."}, {"html": "<strong>Lower basket</strong>: plates, bowls, pots and pans facing down. Items up to 11 inches tall. Fold the tines down for big pots."}, {"img": "/img/frigidaire-dishwasher-how-to-use/cutlery-basket-p8.png", "w": 468, "h": 236, "cap": "Cutlery basket. From the manufacturer's manual, page 8."}, {"html": "<strong>Cutlery basket</strong>: knives and sharp items pointing down."}, {"html": "Turn the spray arm under the upper basket by hand: nothing should stop it or block the detergent cup."}, {"html": "If the dishwasher drains into the sink&#x27;s garbage disposal, run the disposal first so it is empty."}]}, {"title": "Detergent and rinse aid", "items": [{"img": "/img/frigidaire-dishwasher-how-to-use/detergent-open-p9.png", "w": 551, "h": 365, "cap": "From the manufacturer's manual, page 9."}, {"html": "Push the release catch to open the detergent cup."}, {"img": "/img/frigidaire-dishwasher-how-to-use/detergent-add-p9.png", "w": 453, "h": 419, "cap": "From the manufacturer's manual, page 9."}, {"html": "Add <strong>automatic dishwasher detergent</strong>, then press the cover down until it closes. The cover is always open again at the end of a cycle: normal."}, {"img": "/img/frigidaire-dishwasher-how-to-use/rinse-aid-fill-p10.png", "w": 524, "h": 575, "cap": "From the manufacturer's manual, page 10."}, {"html": "<strong>Rinse aid</strong> (liquid only) helps dishes dry. Check the window next to the cup. To fill, lift the tab, fill up to the full mark (not past it), press the cover down. It lasts about a month."}, {"html": "Never put detergent in the rinse aid side, and never use powder or solid rinse aid."}]}, {"title": "Cycle and options", "items": [{"img": "/img/frigidaire-dishwasher-how-to-use/control-panel-p5.png", "w": 1065, "h": 212, "cap": "Control panel. From the manufacturer's manual, page 5."}, {"html": "<strong>Normal Wash</strong>: everyday loads. <strong>Heavy Wash</strong>: pots, pans, casseroles. <strong>1 Hour Wash</strong>: lightly soiled, no drying. <strong>China Crystal</strong>: delicate china and glass. <strong>Energy Saver</strong>: lightly soiled, pre-rinsed dishes."}, {"html": "<strong>Rinse Only</strong>: rinses now so food doesn&#x27;t dry on until you run a full load. No detergent."}, {"html": "Press <strong>Options</strong> to choose <strong>Sanitize</strong> (Heavy and Normal only), <strong>High Temp</strong> or <strong>Heat Dry</strong>. A light shows what is on."}, {"html": "<strong>Delay</strong>: press Delay until the hours (1h to 24h) show, then press START/Cancel."}, {"html": "<strong>Control Lock</strong>: hold Options and Delay together for 3 seconds. Do the same to unlock."}]}, {"title": "Start and finish", "items": [{"img": "/img/frigidaire-dishwasher-how-to-use/cycle-lights-p6.png", "w": 231, "h": 252, "cap": "Cycle lights. From the manufacturer's manual, page 6."}, {"html": "Close the door until it latches and press <strong>START/Cancel</strong>. The display shows the minutes left. The time can jump up or down: normal."}, {"html": "<strong>Cancel</strong>: hold START/Cancel for 3 seconds."}, {"html": "<strong>Add a dish</strong>: open the door a little and wait for the spraying to stop. Add the dish, close the door firmly and press START/Cancel."}, {"html": "At the end it beeps and the <strong>Clean</strong> light stays on until you open the door (<strong>Sanitized</strong> if you chose Sanitize). Dishes can be hot."}]}]}}, {"key": "frigidaire-dishwasher-care", "label": "Appliance Care", "pdf": "/files/frigidaire-dishwasher-care.pdf", "pages": [{"src": "/pages/frigidaire-dishwasher-care-1.jpg", "w": 1870, "h": 1445}], "kb": 655, "phone": {"kicker": "DISHWASHER GUIDE", "title": "Dishwasher Care", "model": "Frigidaire dishwasher (model to confirm)", "important": "Let the heating element at the bottom cool before cleaning inside: burn risk. Do not use benzene, wax, thinner, chlorine bleach or alcohol. Do not spray water over the dishwasher or let water reach electrical parts. Do not remove the long rubber seal around the tub opening.", "stop": "A filter or the spray arm is broken or will not lock back. The door seal is torn, or the door still does not close properly. Water leaks or pools under the dishwasher. A bad smell stays after the vinegar cycle. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Use &amp; Care manual A15931101 for this Frigidaire dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Outside and inside", "items": [{"img": "/img/frigidaire-dishwasher-care/interior-p4.png", "w": 1070, "h": 765, "cap": "Inside the dishwasher. From the manufacturer's manual, page 4."}, {"html": "Wipe spills as they happen. Soft damp cloth on the control panel. Stainless door: stainless steel cleaner and a soft cloth."}, {"html": "Wipe the inside and the inner door with a wet dishcloth."}, {"html": "Now and then, fill the detergent cup and run it empty on <strong>Normal Wash</strong> with <strong>Sanitize</strong>."}, {"html": "White spots or smell: run Normal Wash empty with no detergent. Once water has run through, open the door, put an 8 oz cup of white vinegar upright in the lower basket, close and let it finish."}]}, {"title": "Clean the filters", "items": [{"html": "Turn the dishwasher off and let the heating element cool."}, {"img": "/img/frigidaire-dishwasher-care/filter-twist-p11.png", "w": 453, "h": 343, "cap": "From the manufacturer's manual, page 11."}, {"html": "Turn the filter insert counterclockwise and lift it out."}, {"img": "/img/frigidaire-dishwasher-care/filter-separate-p11.png", "w": 453, "h": 426, "cap": "From the manufacturer's manual, page 11."}, {"html": "Pull out the flat, rectangular fine filter."}, {"img": "/img/frigidaire-dishwasher-care/filter-rinse-p12.png", "w": 453, "h": 432, "cap": "From the manufacturer's manual, page 12."}, {"html": "Remove food and rinse the filters under running water."}]}, {"title": "Put filters back, spray arm", "items": [{"img": "/img/frigidaire-dishwasher-care/filter-refit-p12.png", "w": 453, "h": 343, "cap": "From the manufacturer's manual, page 12."}, {"html": "Put the filters back in reverse order. Turn the insert clockwise to the close arrow. If it is not closed properly, it cleans less well."}, {"img": "/img/frigidaire-dishwasher-care/spray-arm-p12.png", "w": 453, "h": 337, "cap": "From the manufacturer's manual, page 12."}, {"html": "Dishes not clean or holes blocked: pull the lower spray arm straight up, gently."}, {"html": "Clear the holes, push it back and spin it by hand to check it turns."}]}, {"title": "Door seal and rinse aid", "items": [{"img": "/img/frigidaire-dishwasher-care/door-gasket-p12.png", "w": 450, "h": 380, "cap": "From the manufacturer's manual, page 12."}, {"html": "Door not closing well or leaking: wipe the door seal with a damp cloth to remove food."}, {"img": "/img/frigidaire-dishwasher-care/rinse-aid-fill-p10.png", "w": 524, "h": 575, "cap": "From the manufacturer's manual, page 10."}, {"html": "Check the rinse aid window about once a month. Lift the tab, fill with liquid rinse aid up to the full mark (not past it), press the cover down firmly."}]}]}}, {"key": "frigidaire-dishwasher-troubleshooting", "label": "Troubleshooting", "pdf": "/files/frigidaire-dishwasher-troubleshooting.pdf", "pages": [{"src": "/pages/frigidaire-dishwasher-troubleshooting-1.jpg", "w": 1870, "h": 1445}], "kb": 264, "phone": {"kicker": "DISHWASHER GUIDE", "title": "Dishwasher Troubleshooting", "model": "Frigidaire dishwasher (model to confirm)", "important": "Do not open the dishwasher panels or try to repair it. If water overflows, turn off the water to the dishwasher if you know where the valve is (often under the kitchen sink; property management can confirm) and do not restart it until the water is cleaned up.", "stop": "Water leaks, overflows or pools under the dishwasher. Code i1 or i4 comes back, or it will not fill or drain. A burning smell, smoke, or a grinding noise that keeps going after a full cycle. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Use &amp; Care manual A15931101 for this Frigidaire dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Code or won't start", "items": [{"img": "/img/frigidaire-dishwasher-troubleshooting/control-panel-p5.png", "w": 1065, "h": 212, "cap": "Control panel with display. From the manufacturer's manual, page 5."}, {"html": "<strong>i1</strong>: water takes too long to come in (supply off or low pressure). Contact property management if it happens again."}, {"html": "<strong>i4</strong>: leaking. Turn it off and contact property management."}, {"img": "/img/frigidaire-dishwasher-troubleshooting/cycle-lights-p6.png", "w": 231, "h": 252, "cap": "From the manufacturer's manual, page 6."}, {"html": "Won&#x27;t start: close the door until it latches. <strong>Delay</strong> light on: hold START/Cancel 3 seconds to cancel. Controls do nothing: hold Options and Delay 3 seconds (Control Lock). Check the plug and breaker."}]}, {"title": "Long cycles, dirty dishes", "items": [{"html": "Heavy soil and Sanitize make cycles longer. Not-hot incoming water does too: avoid running it during showers. A beep at the end is normal."}, {"img": "/img/frigidaire-dishwasher-troubleshooting/spray-arm-p12.png", "w": 453, "h": 337, "cap": "From the manufacturer's manual, page 12."}, {"html": "Not clean: don&#x27;t load too close together; make sure the spray arms turn freely; use fresh detergent; choose Heavy Wash for very dirty loads."}, {"img": "/img/frigidaire-dishwasher-troubleshooting/filter-rinse-p12.png", "w": 453, "h": 432, "cap": "From the manufacturer's manual, page 12."}, {"html": "Clean the filters (see Appliance Care). Detergent left in the cup: old detergent, or a dish blocked the spray arm."}]}, {"title": "Wet, spotty or marked", "items": [{"img": "/img/frigidaire-dishwasher-troubleshooting/rinse-aid-fill-p10.png", "w": 524, "h": 575, "cap": "From the manufacturer's manual, page 10."}, {"html": "Wet dishes, spots or film: fill with fresh rinse aid and choose a cycle with drying or Heat Dry."}, {"html": "Black or grey marks: aluminium pans rubbed against dishes. Load them apart."}, {"html": "Reddish tomato stains: run Rinse Only right after loading. Coffee or tea stains: use a dishwasher spot cleaner."}]}, {"title": "Water, suds or noise", "items": [{"html": "Water left at the bottom: the cycle was stopped. Run a cycle to the end."}, {"html": "Won&#x27;t drain: run the sink&#x27;s garbage disposal so it is empty. Still not draining: contact property management."}, {"html": "Suds or leaks: use only automatic dishwasher detergent, never hand dish soap."}, {"html": "Detergent cup and drain pump noises are normal. Grinding means a hard object got in: if it keeps going after a full cycle, contact property management."}, {"html": "Won&#x27;t fill: close the door fully. If it still won&#x27;t fill, contact property management."}]}]}}]}];
const UNIT="CN Serene Suite";
if(UNIT){document.querySelector('header h1').textContent=UNIT+' Appliance Guides';}
const ICONS={
washer:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="2.5" width="16" height="19" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M7 6h3M15.5 6h.5"/></svg>',
dryer:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="2.5" width="16" height="19" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M10 11.5c1 .8 1 2.2 0 3M13 11.5c1 .8 1 2.2 0 3M7 6h3"/></svg>',
dishwasher:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M4 7h16M8 4.8h2M12 11v6M9 13v4M15 13v4"/></svg>'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
function home(){
  document.title=(UNIT?UNIT+' ':'')+'Appliance Guides';
  if(!DATA.length){app.innerHTML='<p class="hint">Please use the guide link for your unit from property management.</p>';return;}
  app.innerHTML='<p class="hint">Find your appliance below and pick a guide. Not sure which model you have? Check the label inside the door or on the back.</p>'+
  DATA.map(a=>`<section class="appl"><div class="appl-head"><div class="ico">${ICONS[a.icon]||''}</div><div><h2>${esc(a.title)}</h2>${a.sub?`<p class="sub">${esc(a.sub)}</p>`:''}</div></div>
  <div class="btns">${a.guides.map(g=>`<a class="btn" href="#/${a.slug}/${g.key.slice(a.slug.length+1)}">${esc(g.label)}</a>`).join('')}</div></section>`).join('');
}
function tabUrl(a,x){return `#/${a.slug}/${x.key.slice(a.slug.length+1)}`}
function phoneView(g){
  const p=g.phone;
  const steps=p.steps.map((st,i)=>{
    let out='',list=[];
    const flush=()=>{if(list.length){out+='<ul>'+list.map(t=>`<li>${t}</li>`).join('')+'</ul>';list=[]}};
    st.items.forEach(it=>{ if(it.img){flush();out+=`<figure class="fig"><button type="button" data-zoom="${it.img}" aria-label="Enlarge picture"><img src="${it.img}" width="${it.w}" height="${it.h}" loading="lazy" alt="${esc(it.cap)}"></button><figcaption>${esc(it.cap)}</figcaption></figure>`} else list.push(it.html) });
    flush();
    return `<section class="step"><h3><span class="num">${i+1}</span>${esc(st.title)}</h3>${out}</section>`;
  }).join('');
  return `<div class="imp"><b>IMPORTANT</b>${p.important}</div>${steps}
  <div class="gstop"><b>STOP AND CONTACT PROPERTY MANAGEMENT</b>${p.stop}</div>
  <p class="src">${p.footer}</p>`;
}
function guide(a,g){
  document.title=`${g.label} - ${a.title}`;
  const i=a.guides.indexOf(g),prev=a.guides[i-1],nxt=a.guides[i+1];
  const pages=g.pages.map((p,k)=>`<a class="page" href="${p.src}" target="_blank" rel="noopener"><img src="${p.src}" width="${p.w}" height="${p.h}" loading="lazy" alt="${esc(g.label)} guide, page ${k+1} of ${g.pages.length}"></a>`).join('');
  const dl=`<a class="dl" href="${g.pdf}" download="${esc(a.title+' - '+g.label)}.pdf"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Download PDF (${g.kb>1024?(g.kb/1024).toFixed(1)+' MB':g.kb+' KB'})</a>`;
  app.innerHTML=`<a class="back" href="#/">&larr; ${DATA.length>1?'All appliances':'Back'}</a>
  <h2 class="gtitle">${esc(a.title)}${g.phone?' &middot; '+esc(g.label):''}</h2>${a.sub?`<p class="gsub">${esc(a.sub)}</p>`:''}
  <nav class="tabs">${a.guides.map(x=>`<a class="tab" href="${tabUrl(a,x)}"${x===g?' aria-current="page"':''}>${esc(x.label)}</a>`).join('')}</nav>
  ${g.phone?`<p class="swipe">Swipe left or right to switch guides. Tap a picture to enlarge it.</p>${phoneView(g)}
    <div class="next">${prev?`<a href="${tabUrl(a,prev)}">&larr; ${esc(prev.label)}</a>`:''}${nxt?`<a href="${tabUrl(a,nxt)}">${esc(nxt.label)} &rarr;</a>`:''}</div>
    ${dl}<details class="printed"><summary>See the printed version</summary>${pages}</details>`
  :`${dl}<p class="zoom">Tap a page to open it full size and zoom in.</p>${pages}
  <div class="stop"><strong>Still not working, or something looks unsafe?</strong>Stop using the appliance and contact property management.</div>`}`;
  app.dataset.prev=prev?tabUrl(a,prev):'';app.dataset.next=nxt?tabUrl(a,nxt):'';
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-zoom]');if(!b)return;
  const lb=document.createElement('div');lb.className='lb';lb.innerHTML=`<button type="button" aria-label="Close">&times;</button><img src="${b.dataset.zoom}" alt="">`;
  lb.addEventListener('click',ev=>{if(ev.target.tagName!=='IMG')lb.remove()});document.body.appendChild(lb);});
let sx=0,sy=0,st=0;
app.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
app.addEventListener('touchend',e=>{if(!sx||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=0;
  if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dx)<2*Math.abs(dy)||window.visualViewport&&visualViewport.scale>1.05)return;
  const to=dx<0?app.dataset.next:app.dataset.prev;if(to)location.hash=to;},{passive:true});
function route(){
  const m=location.hash.match(/^#\/([^/]+)\/([^/]+)/);
  const a=m&&DATA.find(x=>x.slug===m[1]);
  const g=a&&a.guides.find(x=>x.key===a.slug+'-'+m[2]);
  if(g)guide(a,g);else{home();app.dataset.prev=app.dataset.next='';}
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
