<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CN Serene Suite Appliance Guides</title>
<meta name="description" content="How to use, care for and troubleshoot the appliances in your apartment.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2329;--muted:#5d6670;--line:#e2e0db;--accent:#0f5c78;--accent-ink:#fff;--soft:#e8f1f4;--warn:#9a2b1d;--warn-bg:#fdf0ed}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--accent);color:var(--accent-ink);padding:22px 0 20px}
header h1{margin:0;font-size:1.5rem;line-height:1.2}
header p{margin:6px 0 0;opacity:.9;font-size:.95rem}
main{padding:18px 0 40px}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.appl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.appl-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.appl h2{margin:0;font-size:1.15rem;line-height:1.25}
.appl .sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px 6px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);background:#fff;text-decoration:none;font-weight:600;font-size:.92rem;line-height:1.2}
.btn:active{background:var(--soft)}
@media (max-width:420px){.btns{grid-template-columns:1fr}.btn{justify-content:flex-start;padding:10px 14px}}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;text-decoration:none}
.gtitle{margin:4px 0 2px;font-size:1.35rem;line-height:1.25}
.gsub{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.tab{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;min-height:46px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem}
.tab[aria-current=page]{background:var(--accent);border-color:var(--accent);color:#fff}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;margin:0 0 14px}
.page{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
.page img{display:block;width:100%;height:auto}
.zoom{color:var(--muted);font-size:.85rem;margin:-4px 0 12px;text-align:center}
.stop{background:var(--warn-bg);border:1px solid #f0c9c1;color:var(--warn);border-radius:12px;padding:14px 16px;margin:18px 0 0;font-size:.95rem}
.stop strong{display:block;margin-bottom:2px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 6px}
.imp{background:#fff6dd;border:1px solid #f0d58a;border-left:6px solid #d99a00;border-radius:12px;padding:14px 16px;margin:0 0 16px;font-size:1rem}
.imp b{display:block;color:#8a5a00;letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.step h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:1.15rem;line-height:1.25}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1rem}
.step ul{margin:0 0 12px;padding-left:1.2em}
.step li{margin:0 0 8px;font-size:1.05rem;line-height:1.5}
.step li:last-child{margin-bottom:0}
.step ul:last-child,.fig:last-child{margin-bottom:0}
.fig{margin:0 0 12px}
.fig button{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.fig img{display:block;max-width:100%;max-height:300px;margin:0 auto;height:auto}
.fig figcaption{color:var(--muted);font-size:.8rem;margin-top:4px;text-align:center}
.c-red{color:#c0261b}.c-blue{color:#1f5fbf}.c-green{color:#1d7a35}.c-orange{color:#c25e00}
.gstop{background:var(--warn-bg);border:1px solid #f0c9c1;border-left:6px solid var(--warn);border-radius:12px;padding:14px 16px;margin:4px 0 16px;color:#5a1a12;font-size:1rem}
.gstop b{display:block;color:var(--warn);letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.src{color:var(--muted);font-size:.8rem;margin:0 0 16px}
.next{display:flex;justify-content:space-between;gap:8px;margin:0 0 14px}
.next a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;font-weight:600;text-align:center;padding:6px}
details.printed{margin:0 0 14px}
details.printed summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent);cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;overflow:auto;display:flex;align-items:center;justify-content:center;padding:56px 8px 16px}
.lb img{max-width:100%;height:auto;background:#fff;border-radius:6px}
.lb button{position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:1.4rem;line-height:1}
.swipe{color:var(--muted);font-size:.8rem;text-align:center;margin:0 0 10px}
.ask{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:14px;margin:0 0 16px}
.ask label{display:block;font-weight:700;margin:0 0 8px;font-size:1.05rem}
.askrow{display:flex;gap:8px}
.ask input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:1rem}
.ask button{min-height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700}
.askout{margin-top:10px;font-size:1rem}
.askout:empty{display:none}
.ans{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 8px}
.ans p{margin:0 0 8px}.ans p:last-child,.ans ul:last-child{margin-bottom:0}
.ans ul{margin:0 0 8px;padding-left:1.2em}
.hit{border-left:4px solid var(--accent);background:#f8fafb;border-radius:6px;padding:8px 12px;margin:0 0 8px;font-size:.95rem}
.hit small,.srcs{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.hit mark{background:#fff0a8;color:inherit}
.asknote{color:var(--warn);font-size:.9rem;margin:6px 0 0}
.langs{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap}
.langs button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;font:inherit;font-size:.95rem;font-weight:600}
.langs button[aria-pressed=true]{background:#fff;color:var(--accent);border-color:#fff}
.langs:empty{display:none}
.fallback{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:0 0 12px}
footer{color:var(--muted);font-size:.85rem;padding:0 0 30px}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="h1">CN Serene Suite Appliance Guides</h1><p id="tag">How to use, care for and fix common problems with the appliances in your apartment.</p><div class="langs" id="langs" role="group" aria-label="Language"></div></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap">Toronto Boutique Apartments</footer>
<script>
const DATA=[{"slug": "whirlpool-front-load-washer", "title": "Whirlpool washer", "sub": "Front-load, models WFW9351 / WFW9151", "icon": "washer", "guides": [{"key": "whirlpool-front-load-washer-how-to-use", "label": "How to Use", "pdf": "/files/whirlpool-front-load-washer-how-to-use.pdf", "pages": [{"src": "/pages/whirlpool-front-load-washer-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 738, "phone": {"kicker": "WASHER GUIDE", "title": "How to Use the Washer", "model": "Whirlpool Model WFW9351 or WFW9151 (to confirm)", "important": "Never wash anything with gasoline or other flammable fluids on it: fire risk. Use only HE (High Efficiency) detergent. Do not overload. Do not reach in while the drum moves, and do not let children play on or in the washer. Run the washer only when you are home, and never on an extension cord.", "stop": "Water leaks. An error code comes back after a restart, or the washer will not fill or drain. A burning smell, smoke, or grinding or banging noise. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s manual W10432633A for Whirlpool front-loading washer models WFW9351 and WFW9151. Pictures are taken from that manual.", "steps": [{"title": "Load", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/load-drum-p9.png", "w": 768, "h": 488, "cap": "From the manufacturer's manual, page 9."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/load-sizes-p8.png", "w": 1142, "h": 315, "cap": "From the manufacturer's manual, page 8."}, {"html": "Sort by colour and fabric. Keep very dirty items and delicates apart."}, {"html": "Empty pockets, close zippers and hooks, tie strings. Coins can block the pump."}, {"html": "Load loosely, mixing large and small items. Do not wash a single item alone. Small items go in mesh bags."}, {"html": "Small load: 3 to 5 items (1/4 full). Medium: 1/2. Large: 3/4. Clothes must tumble freely."}, {"html": "Push the door until the latch clicks."}]}, {"title": "Detergent", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/detergent-drawer-p10.png", "w": 767, "h": 441, "cap": "From the manufacturer's manual, page 10."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/bleach-compartment-p10.png", "w": 768, "h": 453, "cap": "From the manufacturer's manual, page 10."}, {"html": "<strong>HE detergent</strong>, liquid or powder, in its compartment. Colour-safe bleach can go with it. Do not mix powder and liquid."}, {"html": "<strong>Fabric softener</strong> (liquid only): max 1/4 cup (60 mL), not past MAX. No softener balls."}, {"html": "<strong>Chlorine bleach</strong>: max 2/3 cup (165 mL), not past MAX. Never colour-safe bleach here."}, {"html": "Never pour products straight onto clothes."}, {"html": "Close the drawer slowly and fully. A little water left in it is normal."}]}, {"title": "Cycle and options", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/cycle-knob-p11.png", "w": 767, "h": 577, "cap": "From the manufacturer's manual, page 11."}, {"html": "Press and hold <strong>POWER</strong>, then turn the knob."}, {"html": "<strong>Normal</strong>: everyday loads. <strong>Heavy Duty</strong>: towels, jeans. <strong>Whitest Whites</strong>. <strong>Cold Wash</strong>: colours. <strong>Delicate</strong>: lingerie, sweaters. <strong>Bulky Items</strong>: comforters. <strong>Small Load</strong>: 3 to 5 items. <strong>Rinse/Drain &amp; Spin</strong>: spin out a wet <strong>load</strong>."}, {"html": "<strong><span class=\"c-red\">Not sure?</span> Choose</strong> <span class=\"c-red\"><strong>Normal</strong></span> for everyday laundry."}, {"html": "Buttons under the display change Temperature, Spin and Soil Level. Faster spin means drier clothes but more wrinkles."}, {"html": "<strong>Extra Rinse</strong>, <strong>Delay Start</strong> (up to 10 h, use powder detergent)."}, {"html": "<strong>TumbleFresh</strong>: keeps clean clothes from sitting still and getting musty when you can&#x27;t empty the washer right away. After the wash ends, the drum turns the clothes over every now and then, for up to 6 hours. Turn it on before starting the wash: press TumbleFresh until its light comes on. While it runs, the Done light stays on, the TumbleFresh light flashes and the door stays locked. Press <strong>POWER</strong> any time to stop it and unlock the door; otherwise it stops by itself after 6 hours. It doesn&#x27;t work when spin speed is set to No Spin."}]}, {"title": "Start and finish", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/start-pause-p11.png", "w": 786, "h": 316, "cap": "From the manufacturer's manual, page 11."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/door-p12.png", "w": 823, "h": 468, "cap": "From the manufacturer's manual, page 12."}, {"html": "Press and hold <strong>START/PAUSE</strong>. The door locks, unlocks and locks again: normal. Start within 5 minutes or it turns off."}, {"html": "<strong>Add 1 or 2 items</strong> while Add a Garment is lit: press START/PAUSE once, wait for the door to unlock."}, {"html": "<strong>Pause</strong>: press START/PAUSE once; hold it to continue. <strong>Cancel</strong>: press POWER. <strong>Lock buttons</strong>: hold Control Lock 3 s."}, {"html": "At the end, the <strong>Done</strong> light comes on in the display (picture below). Unload straight away and check the door seal for small items. If <strong>TumbleFresh</strong> is on, Done stays lit and the door stays locked: press <strong>POWER</strong> to unlock."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/status-lights-p6.png", "w": 655, "h": 276, "cap": "Display on model WFW9151 (WFW9351 has the same Done light). Manual, page 6."}, {"html": "Leave the door open so the drum dries. Open and close it before the next wash."}]}]}, "tr": null}, {"key": "whirlpool-front-load-washer-care", "label": "Appliance Care", "pdf": "/files/whirlpool-front-load-washer-care.pdf", "pages": [{"src": "/pages/whirlpool-front-load-washer-care-1.jpg", "w": 1870, "h": 1445}], "kb": 601, "phone": {"kicker": "WASHER GUIDE", "title": "Washer Care", "model": "Whirlpool Model WFW9351 or WFW9151 (to confirm)", "important": "Wear rubber gloves when cleaning with bleach and follow the bleach label. Do not use abrasive cleaners, and do not take any part of the washer apart. Use only HE detergent and measure it: too much leaves residue and causes smells.", "stop": "A water hose behind the washer is bulging, cracked, kinked or leaking (the manual says hoses should be replaced every 5 years). A bad smell stays after the monthly clean. The washer needs to be moved, or the room could freeze. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s manual W10432633A for Whirlpool front-loading washer models WFW9351 and WFW9151. Pictures are taken from that manual.", "steps": [{"title": "After every load", "items": [{"img": "/img/whirlpool-front-load-washer-care/door-p12.png", "w": 823, "h": 468, "cap": "From the manufacturer's manual, page 12."}, {"html": "Take the laundry out as soon as the cycle ends."}, {"html": "Leave the door open so the washer can dry. This prevents smells."}, {"html": "Wipe spills on the outside with a soft damp cloth, with mild soap if needed."}, {"html": "Now and then, wipe the inside of the door glass. Residue there can cause drips."}]}, {"title": "Monthly clean (or every 30 washes)", "items": [{"img": "/img/whirlpool-front-load-washer-care/cycle-knob-p11.png", "w": 767, "h": 577, "cap": "From the manufacturer's manual, page 11."}, {"html": "Empty drum. Put one <strong>AFFRESH</strong> tablet in the drum, or 2/3 cup (160 mL) of liquid chlorine bleach in the bleach compartment. No detergent."}, {"html": "Close the door and drawer. Press <strong>POWER</strong>, turn the knob to <strong>CLEAN WASHER with affresh</strong>, press and hold <strong>START/PAUSE</strong>."}, {"html": "For about 3 minutes the drum turns and the door locks and unlocks: normal. If the Wash light flashes, take out what is in the drum and start again."}, {"html": "Let it finish. If stopped, &quot;Int&quot; shows and the door can take up to 10 minutes to unlock. Then leave the door slightly open."}]}, {"title": "Dispenser drawer", "items": [{"img": "/img/whirlpool-front-load-washer-care/drawer-release-p13.png", "w": 767, "h": 528, "cap": "From the manufacturer's manual, page 13."}, {"html": "Pull the drawer out until it stops. Press down on the release lever and pull it straight out."}, {"img": "/img/whirlpool-front-load-washer-care/drawer-insert-p13.png", "w": 767, "h": 502, "cap": "From the manufacturer's manual, page 13."}, {"html": "Lift out the insert. Wash both in warm soapy water, rinse, and dry. Not dishwasher safe."}, {"img": "/img/whirlpool-front-load-washer-care/drawer-refit-p13.png", "w": 767, "h": 408, "cap": "From the manufacturer's manual, page 13."}, {"html": "Put the insert back, line the drawer up with the guides and slide it in."}]}, {"title": "Door seal and time away", "items": [{"img": "/img/whirlpool-front-load-washer-care/door-seal-p13.png", "w": 768, "h": 372, "cap": "From the manufacturer's manual, page 13."}, {"html": "Pull back the seal and check for stains and small objects."}, {"html": "Wipe stains with a damp cloth and 3/4 cup (177 mL) of liquid chlorine bleach in 1 gallon (3.8 L) of warm water. Leave 5 minutes, wipe dry, leave the door open."}, {"html": "Run the washer only when you are home. Before a long trip, ask property management whether the water taps behind the washer should be turned off."}, {"html": "After a long time unused, run a Normal cycle with half the usual HE detergent and no clothes."}]}]}, "tr": null}, {"key": "whirlpool-front-load-washer-troubleshooting", "label": "Troubleshooting", "pdf": "/files/whirlpool-front-load-washer-troubleshooting.pdf", "pages": [{"src": "/pages/whirlpool-front-load-washer-troubleshooting-1.jpg", "w": 1870, "h": 1445}], "kb": 454, "phone": {"kicker": "WASHER GUIDE", "title": "Washer Troubleshooting", "model": "Whirlpool Model WFW9351 or WFW9151 (to confirm)", "important": "Do not open the washer cabinet or try to repair it. If water is leaking near an electrical outlet, do not touch the washer or the plug.", "stop": "Water leaks from the washer, the hoses or the door. An error code comes back after you restart, or the washer will not fill or drain. A burning smell, smoke, or a loud grinding or banging noise. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s manual W10432633A for Whirlpool front-loading washer models WFW9351 and WFW9151. Pictures are taken from that manual.", "steps": [{"title": "A code shows", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/display-knob-p11.png", "w": 767, "h": 442, "cap": "From the manufacturer's manual, page 11."}, {"html": "<strong>Sd</strong>: too many suds. Let it carry on. If the knob lights flash, choose the cycle again with a cold temperature and press START/PAUSE. Next time use less HE detergent."}, {"html": "<strong>F8 E1</strong>: no water. Check both taps behind the washer are on and the hoses are not kinked. Press START/PAUSE once to clear, then again to restart."}, {"html": "<strong>F9 E1</strong>: cannot drain. Check the drain hose is not kinked or blocked, then clear and restart."}, {"html": "<strong>Other F/E code</strong>: press POWER. If water is left, run RINSE/DRAIN &amp; SPIN. If it comes back, contact property management."}]}, {"title": "Won't start or door won't open", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/start-pause-p11.png", "w": 786, "h": 316, "cap": "From the manufacturer's manual, page 11."}, {"html": "Close the door until it latches, then press and hold START/PAUSE. After a cycle, open and close the door first."}, {"html": "Control Lock light on: hold Control Lock (Cycle Signal on some models) for 3 seconds. Check the plug and breaker."}, {"img": "/img/whirlpool-front-load-washer-troubleshooting/status-lights-both-p6.png", "w": 1525, "h": 303, "cap": "From the manufacturer's manual, page 6. Both models are shown."}, {"html": "Door locked: press START/PAUSE once and wait for the drum to stop. If water is left, run RINSE/DRAIN &amp; SPIN. If TumbleFresh is on, press POWER."}]}, {"title": "Wet clothes, noise or suds", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/load-sizes-p8.png", "w": 1142, "h": 315, "cap": "From the manufacturer's manual, page 8."}, {"html": "Still wet: run RINSE/DRAIN &amp; SPIN with no detergent. Spread out a tight or one-item load, or take half out and spin again. Delicate cycles leave clothes wetter."}, {"html": "Clicks at the start (door lock), humming while draining, and zips touching the drum are normal."}, {"html": "Shaking: don&#x27;t wash a single item or pack the drum. Use Bulky Items for comforters. If it still moves, contact property management."}, {"img": "/img/whirlpool-front-load-washer-troubleshooting/detergent-drawer-p10.png", "w": 767, "h": 441, "cap": "From the manufacturer's manual, page 10."}, {"html": "Suds or drips at the door: use only measured HE detergent and wipe the door glass."}]}, {"title": "Smell, poor results, timing", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/door-seal-p13.png", "w": 768, "h": 372, "cap": "From the manufacturer's manual, page 13."}, {"html": "Bad smell: run the monthly clean (see Appliance Care) and leave the door open between washes."}, {"html": "Not clean: don&#x27;t pack the drum, use the dispenser, no softener balls. Grey whites: wash apart from darks, warmer water if the label allows."}, {"html": "Wrinkles: load loosely, slower spin, unload straight away."}, {"html": "Low-looking water, a changing time left, or an option that won&#x27;t light up for that cycle: all normal."}]}]}, "tr": null}], "tr": null}, {"slug": "frigidaire-dishwasher", "title": "Frigidaire dishwasher", "sub": "", "icon": "dishwasher", "guides": [{"key": "frigidaire-dishwasher-how-to-use", "label": "How to Use", "pdf": "/files/frigidaire-dishwasher-how-to-use.pdf", "pages": [{"src": "/pages/frigidaire-dishwasher-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 431, "phone": {"kicker": "DISHWASHER GUIDE", "title": "How to Use the Dishwasher", "model": "Frigidaire dishwasher (model to confirm)", "important": "Use only automatic dishwasher detergent, never hand dish soap. Load knives and sharp items pointing down. Do not let children play in or on the dishwasher or sit or stand on the open door. Open the door slowly during a cycle: hot water can splash out. Do not touch the heating element at the bottom during or right after a cycle.", "stop": "Water leaks or pools under the dishwasher. Error code i1 or i4 shows, or it will not fill or drain. A burning smell, smoke, or a grinding noise that keeps going. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Use &amp; Care manual A15931101 for this Frigidaire dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Load", "items": [{"img": "/img/frigidaire-dishwasher-how-to-use/upper-basket-p7.png", "w": 453, "h": 450, "cap": "Upper basket. From the manufacturer's manual, page 7."}, {"img": "/img/frigidaire-dishwasher-how-to-use/lower-basket-p7.png", "w": 453, "h": 453, "cap": "Lower basket. From the manufacturer's manual, page 7."}, {"html": "Scrape off large food, bones and toothpicks. Empty glasses and cups. Rinse only if the dishes will wait before washing."}, {"html": "<strong>Upper basket</strong>: glasses, cups, small plates and plastics marked dishwasher safe. Open side down, tilted slightly."}, {"html": "<strong>Lower basket</strong>: plates, bowls, pots and pans facing down. Ite ire-dishwasher-care/filter-refit-p12.png", "w": 453, "h": 343, "cap": "From the manufacturer's manual, page 12."}, {"html": "Put the filters back in reverse order. Turn the insert clockwise to the close arrow. If it is not closed properly, it cleans less well."}, {"img": "/img/frigidaire-dishwasher-care/spray-arm-p12.png", "w": 453, "h": 337, "cap": "From the manufacturer's manual, page 12."}, {"html": "Dishes not clean or holes blocked: pull the lower spray arm straight up, gently."}, {"html": "Clear the holes, push it back and spin it by hand to check it turns."}]}, {"title": "Door seal and rinse aid", "items": [{"img": "/img/frigidaire-dishwasher-care/door-gasket-p12.png", "w": 450, "h": 380, "cap": "From the manufacturer's manual, page 12."}, {"html": "Door not closing well or leaking: wipe the door seal with a damp cloth to remove food."}, {"img": "/img/frigidaire-dishwasher-care/rinse-aid-fill-p10.png", "w": 524, "h": 575, "cap": "From the manufacturer's manual, page 10."}, {"html": "Check the rinse aid window about once a month. Lift the tab, fill with liquid rinse aid up to the full mark (not past it), press the cover down firmly."}]}]}, "tr": null}, {"key": "frigidaire-dishwasher-troubleshooting", "label": "Troubleshooting", "pdf": "/files/frigidaire-dishwasher-troubleshooting.pdf", "pages": [{"src": "/pages/frigidaire-dishwasher-troubleshooting-1.jpg", "w": 1870, "h": 1445}], "kb": 264, "phone": {"kicker": "DISHWASHER GUIDE", "title": "Dishwasher Troubleshooting", "model": "Frigidaire dishwasher (model to confirm)", "important": "Do not open the dishwasher panels or try to repair it. If water overflows, turn off the water to the dishwasher if you know where the valve is (often under the kitchen sink; property management can confirm) and do not restart it until the water is cleaned up.", "stop": "Water leaks, overflows or pools under the dishwasher. Code i1 or i4 comes back, or it will not fill or drain. A burning smell, smoke, or a grinding noise that keep   const df={};terms.forEach((w,x)=>{df[x]=docs.filter(d=>d.t.some(y=>y.startsWith(x))).length});
  return docs.map(d=>{let sc=0;terms.forEach((w,x)=>{const f=d.t.filter(y=>y.startsWith(x)).length;if(!f)return;const idf=Math.log(1+(N-df[x]+.5)/(df[x]+.5));sc+=w*idf*f*2.2/(f+1.2*(.25+.75*d.t.length/avg))});
    if(/(Troubleshooting guide|Sorun Giderme kılavuzu)$/.test(d.c.src))sc*=1.15;return{c:d.c,sc}}).filter(x=>x.sc>0).sort((x,y)=>y.sc-x.sc).slice(0,3).map(x=>x.c);
}
function hl(text,q){let h=esc(text);toks(q).filter(x=>x.length>2).forEach(x=>{h=h.replace(new RegExp('(?<![\\p{L}])('+x.replace(/[^\p{L}\p{N}]/gu,'')+'[\\p{L}]*)','giu'),'<mark>$1</mark>')});return h}
function mdish(x){const lines=esc(x).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split(/\n+/);let o='',inl=false;lines.forEach(l=>{const m=l.match(/^\s*(?:[-•*]|\d+\.)\s+(.*)/);if(m){if(!inl){o+='<ul>';inl=true}o+='<li>'+m[1]+'</li>'}else{if(inl){o+='</ul>';inl=false}if(l.trim())o+='<p>'+l+'</p>'}});if(inl)o+='</ul>';return o}
const NOTE=()=>`<p class="asknote">${t().note}</p>`;
async function getKB(slug){if(!KB[slug]){const r=await fetch('/kb/'+slug+'.json');KB[slug]=await r.json()}return KB[slug]}
app.addEventListener('submit',async e=>{const f=e.target.closest('form.ask');if(!f)return;e.preventDefault();
  const q=f.querySelector('input').value.trim(),out=f.querySelector('.askout'),slug=f.dataset.appl;if(!q)return;
  out.innerHTML=`<p>${t().looking}</p>`;
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({appliance:slug,question:q,lang:LANG}),signal:ctl.signal});clearTimeout(tm);
    if(r.ok){const j=await r.json();if(j.answer){out.innerHTML=`<div class="ans">${mdish(j.answer)}</div>${j.sources&&j.sources.length?`<span class="srcs">${t().from}: ${esc(j.sources.join(', '))}</span>`:''}${NOTE()}`;return}}
  }catch(err){}
  try{const kb=await getKB(slug);const hits=search(kb,q);
    out.innerHTML=hits.length?`<p>${t().found}</p>${hits.map(h=>`<div class="hit">${h.title?`<strong>${esc(h.title)}:</strong> `:''}${hl(h.text,q)}<small>${esc(h.src)}</small></div>`).join('')}${NOTE()}`
      :`<p>${esc(t().nothing)}</p>${NOTE()}`;
  }catch(err){out.innerHTML=`<p>${t().unavailable}</p>`+NOTE()}
});
function tabUrl(a,x){return `#/${a.slug}/${kindOf(a,x)}`}
function phoneView(p){
  const steps=p.steps.map((st,i)=>{
    let out='',list=[];
    const flush=()=>{if(list.length){out+='<ul>'+list.map(x=>`<li>${x}</li>`).join('')+'</ul>';list=[]}};
    st.items.forEach(it=>{ if(it.img){flush();out+=`<figure class="fig"><button type="button" data-zoom="${it.img}" aria-label="${t().enlarge}"><img src="${it.img}" width="${it.w}" height="${it.h}" loading="lazy" alt="${esc(it.cap)}"></button><figcaption>${esc(it.cap)}</figcaption></figure>`} else list.push(it.html) });
    flush();
    return `<section class="step"><h3><span class="num">${i+1}</span>${esc(st.title)}</h3>${out}</section>`;
  }).join('');
  return `<div class="imp"><b>${t().imp}</b>${p.important}</div>${steps}
  <div class="gstop"><b>${t().stopBox}</b>${p.stop}</div>
  <p class="src">${p.footer}</p>`;
}
function guide(a,g){
  const L=AL(a),G=GL(a,g);
  document.title=`${G.label} - ${L.title}`;
  const i=a.guides.indexOf(g),prev=a.guides[i-1],nxt=a.guides[i+1];
  const pages=G.pages.map((p,k)=>`<a class="page" href="${p.src}" target="_blank" rel="noopener"><img src="${p.src}" width="${p.w}" height="${p.h}" loading="lazy" alt="${esc(G.label)}, ${t().page} ${k+1} ${t().of} ${G.pages.length}"></a>`).join('');
  const dl=`<a class="dl" href="${G.pdf}" download="${esc(L.title+' - '+G.label)}.pdf"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>${t().dl} (${G.kb>1024?(G.kb/1024).toFixed(1)+' MB':G.kb+' KB'})</a>`;
  app.innerHTML=`<a class="back" href="#/">&larr; ${DATA.length>1?t().all:t().back}</a>
  <h2 class="gtitle">${esc(L.title)}${G.phone?' &middot; '+esc(G.label):''}</h2>${L.sub?`<p class="gsub">${esc(L.sub)}</p>`:''}
  <nav class="tabs">${a.guides.map(x=>`<a class="tab" href="${tabUrl(a,x)}"${x===g?' aria-current="page"':''}>${esc(GL(a,x).label)}</a>`).join('')}</nav>
  ${G.fb?`<p class="fallback">${t().fallback}</p>`:''}
  ${/-troubleshooting$/.test(g.key)?askBox(a):''}
  ${G.phone?`<p class="swipe">${t().swipe}</p>${phoneView(G.phone)}
    <div class="next">${prev?`<a href="${tabUrl(a,prev)}">&larr; ${esc(GL(a,prev).label)}</a>`:''}${nxt?`<a href="${tabUrl(a,nxt)}">${esc(GL(a,nxt).label)} &rarr;</a>`:''}</div>
    ${dl}<details class="printed"><summary>${t().printed}</summary>${pages}</details>`
  :`${dl}<p class="zoom">${t().zoom}</p>${pages}
  <div class="stop"><strong>${t().stopT}</strong>${t().stopB}</div>`}`;
  app.dataset.prev=prev?tabUrl(a,prev):'';app.dataset.next=nxt?tabUrl(a,nxt):'';
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-zoom]');if(!b)return;
  const lb=document.createElement('div');lb.className='lb';lb.innerHTML=`<button type="button" aria-label="Close">&times;</button><img src="${b.dataset.zoom}" alt="">`;
  lb.addEventListener('click',ev=>{if(ev.target.tagName!=='IMG')lb.remove()});document.body.appendChild(lb);});
let sx=0,sy=0,st=0;
app.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
app.addEventListener('touchend',e=>{if(!sx||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=0;
  if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dx)<2*Math.abs(dy)||window.visualViewport&&visualViewport.scale>1.05)return;
  const to=dx<0?app.dataset.next:app.dataset.prev;if(to)location.hash=to;},{passive:true});
function route(){
  const m=location.hash.match(/^#\/([^/]+)\/([^/]+)/);
  const a=m&&DATA.find(x=>x.slug===m[1]);
  const g=a&&a.guides.find(x=>x.key===a.slug+'-'+m[2]);
  if(g)guide(a,g);else{home();app.dataset.prev=app.dataset.next='';}
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);chrome();route();
</script>
</body>
