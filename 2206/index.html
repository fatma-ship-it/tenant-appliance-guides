<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellagio Belleview Residence Appliance Guides</title>
<meta name="description" content="How to use, care for and troubleshoot the appliances in your apartment.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2329;--muted:#5d6670;--line:#e2e0db;--accent:#0f5c78;--accent-ink:#fff;--soft:#e8f1f4;--warn:#9a2b1d;--warn-bg:#fdf0ed}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--accent);color:var(--accent-ink);padding:22px 0 20px}
header h1{margin:0;font-size:1.5rem;line-height:1.2}
header p{margin:6px 0 0;opacity:.9;font-size:.95rem}
main{padding:18px 0 40px}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.appl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.appl-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.appl h2{margin:0;font-size:1.15rem;line-height:1.25}
.appl .sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px 6px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);background:#fff;text-decoration:none;font-weight:600;font-size:.92rem;line-height:1.2}
.btn:active{background:var(--soft)}
@media (max-width:420px){.btns{grid-template-columns:1fr}.btn{justify-content:flex-start;padding:10px 14px}}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;text-decoration:none}
.gtitle{margin:4px 0 2px;font-size:1.35rem;line-height:1.25}
.gsub{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.tab{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;min-height:46px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem}
.tab[aria-current=page]{background:var(--accent);border-color:var(--accent);color:#fff}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;margin:0 0 14px}
.page{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
.page img{display:block;width:100%;height:auto}
.zoom{color:var(--muted);font-size:.85rem;margin:-4px 0 12px;text-align:center}
.stop{background:var(--warn-bg);border:1px solid #f0c9c1;color:var(--warn);border-radius:12px;padding:14px 16px;margin:18px 0 0;font-size:.95rem}
.stop strong{display:block;margin-bottom:2px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 6px}
.imp{background:#fff6dd;border:1px solid #f0d58a;border-left:6px solid #d99a00;border-radius:12px;padding:14px 16px;margin:0 0 16px;font-size:1rem}
.imp b{display:block;color:#8a5a00;letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.step h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:1.15rem;line-height:1.25}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1rem}
.step ul{margin:0 0 12px;padding-left:1.2em}
.step li{margin:0 0 8px;font-size:1.05rem;line-height:1.5}
.step li:last-child{margin-bottom:0}
.step ul:last-child,.fig:last-child{margin-bottom:0}
.fig{margin:0 0 12px}
.fig button{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.fig img{display:block;max-width:100%;max-height:300px;margin:0 auto;height:auto}
.fig figcaption{color:var(--muted);font-size:.8rem;margin-top:4px;text-align:center}
.c-red{color:#c0261b}.c-blue{color:#1f5fbf}.c-green{color:#1d7a35}.c-orange{color:#c25e00}
.gstop{background:var(--warn-bg);border:1px solid #f0c9c1;border-left:6px solid var(--warn);border-radius:12px;padding:14px 16px;margin:4px 0 16px;color:#5a1a12;font-size:1rem}
.gstop b{display:block;color:var(--warn);letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.src{color:var(--muted);font-size:.8rem;margin:0 0 16px}
.next{display:flex;justify-content:space-between;gap:8px;margin:0 0 14px}
.next a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;font-weight:600;text-align:center;padding:6px}
details.printed{margin:0 0 14px}
details.printed summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent);cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;overflow:auto;display:flex;align-items:center;justify-content:center;padding:56px 8px 16px}
.lb img{max-width:100%;height:auto;background:#fff;border-radius:6px}
.lb button{position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:1.4rem;line-height:1}
.swipe{color:var(--muted);font-size:.8rem;text-align:center;margin:0 0 10px}
.ask{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:14px;margin:0 0 16px}
.ask label{display:block;font-weight:700;margin:0 0 8px;font-size:1.05rem}
.askrow{display:flex;gap:8px}
.ask input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:1rem}
.ask button{min-height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700}
.askout{margin-top:10px;font-size:1rem}
.askout:empty{display:none}
.ans{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 8px}
.ans p{margin:0 0 8px}.ans p:last-child,.ans ul:last-child{margin-bottom:0}
.ans ul{margin:0 0 8px;padding-left:1.2em}
.hit{border-left:4px solid var(--accent);background:#f8fafb;border-radius:6px;padding:8px 12px;margin:0 0 8px;font-size:.95rem}
.hit small,.srcs{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.hit mark{background:#fff0a8;color:inherit}
.asknote{color:var(--warn);font-size:.9rem;margin:6px 0 0}
footer{color:var(--muted);font-size:.85rem;padding:0 0 30px}
</style>
</head>
<body>

<footer class="wrap">Toronto Boutique Apartments</footer>

const DATA=[{"slug": "kitchenaid-dishwasher", "title": "KitchenAid dishwasher", "sub": "Stainless steel tub (manual W11589935)", "icon": "dishwasher", "guides": [{"key": "kitchenaid-dishwasher-how-to-use", "label": "How to Use", "pdf": "/files/kitchenaid-dishwasher-how-to-use.pdf", "pages": [{"src": "/pages/kitchenaid-dishwasher-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 43, "phone": {"kicker": "DISHWASHER GUIDE", "title": "How to Use the Dishwasher", "model": "KitchenAid dishwasher, stainless steel tub (model to confirm)", "important": "Use only dishwasher detergent and keep it away from children. Load sharp knives with the handles up. Do not sit or stand on the door or racks, do not push down on the open door, and do not let children play in or on the dishwasher. Do not touch the heating element during or right after a cycle.", "stop": "Water leaks or pools under the dishwasher. An error code shows or the lights blink in a pattern (see Troubleshooting). A burning smell or smoke. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual W11589935 for this KitchenAid dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Load", "items": [{"html": "Load <strong>sharp knives with the handles up</strong>."}, {"html": "Place sharp items so they cannot touch or damage the door seal."}, {"html": "Plastic: only items marked <strong>dishwasher safe</strong>."}, {"html": "Do not sit, stand or lean on the open door or the racks."}]}, {"title": "Detergent and rinse aid", "items": [{"html": "Use only dishwasher detergent. <strong>Premeasured tablets or packs</strong> are recommended."}, {"html": "<strong>Rinse aid is needed</strong> for dry dishes and to limit hard-water spots. Keep it filled."}, {"html": "The detergent cup and rinse aid cap are on the inside of the door (<span class=\"c-orange\">location to confirm with property management</span>)."}]}, {"title": "Start", "items": [{"html": "Choose a cycle on the control panel, for example <strong>Normal</strong>. Not sure which one? Ask property management."}, {"html": "Press <strong>Start/Resume</strong>, then <strong>close the door within 4 seconds</strong>."}, {"html": "<strong>Start/Resume light flashing</strong>: the door was not closed in time. Press Start/Resume again and close the door."}, {"html": "Adding a dish during a cycle: add it, press Start/Resume and close the door within 4 seconds."}]}, {"title": "What to expect", "items": [{"html": "A load usually takes <strong>2 to 5 hours</strong>. This is normal: it saves energy."}, {"html": "The first cycle may run longer. Some options can make a cycle longer than 3.5 hours."}, {"html": "Hot water not used for <strong>2 weeks or more</strong>? Before using the dishwasher, run every hot tap for a few minutes. No smoking or open flame while you do this (hydrogen gas risk)."}]}]}}, {"key": "kitchenaid-dishwasher-care", "label": "Appliance Care", "pdf": "/files/kitchenaid-dishwasher-care.pdf", "pages": [{"src": "/pages/kitchenaid-dishwasher-care-1.jpg", "w": 1870, "h": 1445}], "kb": 291, "phone": {"kicker": "DISHWASHER GUIDE", "title": "Dishwasher Care", "model": "KitchenAid dishwasher, stainless steel tub (model to confirm)", "important": "Do not touch the heating element during or right after a cycle. Never use a wire brush or scouring pad on the filters, or abrasive cleaners on the outside. Use vinegar only now and then: it is an acid and can damage the dishwasher.", "stop": "A filter is broken or will not go back in place. Water leaks or pools under the dishwasher. The dishwasher is not draining well. White residue keeps coming back after cleaning. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual W11589935 for this KitchenAid dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Outside and inside", "items": [{"html": "Outside: soft damp cloth and mild detergent only. No abrasive cleaners (stainless doors may have a fingerprint-resistant coating)."}, {"html": "<strong>Once a month</strong>: run a dishwasher cleaner such as affresh\u00ae, following the package directions."}, {"html": "White residue: <strong>place</strong> (do not pour) 2 cups (500 mL) white vinegar in a glass or dishwasher-safe cup on the bottom rack. Run a full cycle with an air-dry or energy-saving dry option and <strong>no detergent</strong>."}]}, {"title": "Clean the filters", "items": [{"html": "How often: every 2 months if you only scrape plates; every 4 months to once a year if you rinse them first. <strong>White residue (hard water): once a month.</strong>"}, {"img": "/img/kitchenaid-dishwasher-care/filter-twist-p5.png", "w": 367, "h": 170, "cap": "Turn the upper filter. From the manufacturer's manual, page 5."}, {"html": "Turn the upper filter <strong>1/4 turn counterclockwise</strong> and lift it out."}, {"img": "/img/kitchenaid-dishwasher-care/filter-separate-p5.png", "w": 368, "h": 265, "cap": "From the manufacturer's manual, page 5."}, {"html": "Gently pull the upper filter assembly apart."}]}, {"title": "Rinse and put back", "items": [{"img": "/img/kitchenaid-dishwasher-care/filter-rinse-p6.png", "w": 371, "h": 279, "cap": "From the manufacturer's manual, page 6."}, {"html": "Rinse the filters under running water until most soil is gone."}, {"img": "/img/kitchenaid-dishwasher-care/filter-rinse-plate-p6.png", "w": 384, "h": 279, "cap": "From the manufacturer's manual, page 6."}, {"html": "Hard soil or white deposits: use a <strong>soft</strong> brush."}, {"img": "/img/kitchenaid-dishwasher-care/filter-video-qr-p6.png", "w": 228, "h": 209, "cap": "Scan for the manufacturer's video on putting the filter back. From the manual, page 6."}, {"html": "Put the filters back fully before the next cycle."}]}, {"title": "Rinse aid, salt, time away", "items": [{"html": "Keep <strong>rinse aid</strong> filled for dry dishes."}, {"img": "/img/kitchenaid-dishwasher-care/salt-reservoir-p5.png", "w": 329, "h": 151, "cap": "Salt reservoir, under the lower rack on the left. From the manufacturer's manual, page 5."}, {"html": "<strong>Low-salt light</strong> (some models): refill with <strong>dishwasher softener salt</strong> only. Remove the lower rack, unscrew the cap, fill to the edge with the funnel, wipe away salt and screw the cap on tightly. Run a cycle right away. Unsure? Contact property management."}, {"html": "Away for a long time, or risk of freezing: tell property management."}]}]}}, {"key": "kitchenaid-dishwasher-troubleshooting", "label": "Troubleshooting", "pdf": "/files/kitchenaid-dishwasher-troubleshooting.pdf", "pages": [{"src": "/pages/kitchenaid-dishwasher-troubleshooting-1.jpg", "w": 1870, "h": 1445}], "kb": 102, "phone": {"kicker": "DISHWASHER GUIDE", "title": "Dishwasher Troubleshooting", "model": "KitchenAid dishwasher, stainless steel tub (model to confirm)", "important": "Water leaking or overfilling (codes F1E1, F1E5, F8E4, F8E5): keep the door closed. Turn off the water to the dishwasher if you know how. If the water cannot be turned off, do NOT turn off the power. Press Cancel once to stop the alarm, then contact property management right away.", "stop": "Water leaks, overflows or pools under the dishwasher. Any code other than H2O, or H2O comes back. It will not drain. A burning smell or smoke. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual W11589935 for this KitchenAid dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Won't start", "items": [{"html": "Close the door tightly until it latches."}, {"html": "Press <strong>Start/Resume</strong>, then close the door <strong>within 4 seconds</strong>. Light flashing: press Start/Resume again and close the door."}, {"html": "Check that a cycle was chosen."}, {"html": "Still nothing: the breaker or water may be off. Contact property management."}]}, {"title": "Long cycles, wet or spotty", "items": [{"html": "<strong>2 to 5 hours is normal.</strong> The first cycle and some options take longer."}, {"html": "Wet dishes: fill the <strong>rinse aid</strong>."}, {"img": "/img/kitchenaid-dishwasher-troubleshooting/filter-twist-p5.png", "w": 367, "h": 170, "cap": "Upper filter. From the manufacturer's manual, page 5."}, {"html": "White spots or residue: hard water. Clean the filters monthly and run a dishwasher cleaner or vinegar rinse (see Appliance Care). Tell property management if it continues."}]}, {"title": "Water or drain codes", "items": [{"html": "<strong>H2O</strong>: no water reaching the dishwasher. Contact property management to check the water supply. When it is fixed, press <strong>Start/Resume</strong>."}, {"html": "<strong>F9E1</strong>: will not drain. Contact property management (the drain hose or disposal connection may need checking)."}, {"html": "<strong>F1E1, F1E5, F8E4, F8E5</strong>: follow the IMPORTANT box above."}]}, {"title": "Other codes and blinking lights", "items": [{"html": "<strong>F1E2, F6E1, F7E2, F7E3, F9E3</strong>: the dishwasher needs service. Contact property management."}, {"html": "No display? The same faults show as blinking lights, for example <strong>8 blinks, pause, 1 blink = H2O</strong>. Count the blinks and tell property management."}, {"html": "Press <strong>Cancel</strong> once to stop an alarm sound."}]}]}}]}];
const UNIT="Bellagio Belleview Residence";
if(UNIT){document.querySelector('header h1').textContent=UNIT+' Appliance Guides';}
const ICONS={
washer:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="2.5" width="16" height="19" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M7 6h3M15.5 6h.5"/></svg>',

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SYN={leak:['leak','water','drip','puddl','flood'],leaking:['leak','water'],drain:['drain','water','pump','standing'],smell:['smell','odor','odour'],odor:['smell','odor','odour'],noise:['noise','noisy','loud','sound','bang','rattl','vibrat'],loud:['noise','loud','sound'],start:['start','power','turn','run'],wet:['wet','damp','drying','rinse'],damp:['wet','damp','drying'],dry:['dry','wet','damp','heat'],hot:['heat','hot','temperatur'],cold:['heat','cold','temperatur'],code:['code','error','display'],error:['code','error','display'],door:['door','lock','latch'],soap:['detergent','suds','soap'],suds:['suds','detergent','foam'],dirty:['clean','dirty','residue','spot'],spots:['spot','residue','film','rinse']};
function stem(w){w=w.toLowerCase();for(const s of ['ing','ed','es','s']){if(w.length>4&&w.endsWith(s))return w.slice(0,-s.length)}return w}
function toks(t){return (t.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>w.length>1&&!STOP.has(w)).map(stem)}

app.addEventListener('submit',async e=>{const f=e.target.closest('form.ask');if(!f)return;e.preventDefault();
  const q=f.querySelector('input').value.trim(),out=f.querySelector('.askout'),slug=f.dataset.appl;if(!q)return;

  }catch(err){}
  try{const kb=await getKB(slug);const hits=search(kb,q);
    out.innerHTML=hits.length?`<p>Here is what the manual and guides say:</p>${hits.map(h=>`<div class="hit">${h.title?`<strong>${esc(h.title)}:</strong> `:''}${hl(h.text,q)}<small>${esc(h.src)}</small></div>`).join('')}${NOTE}`
      :`<p>Nothing in the manual matches that. Try other words, for example "won't drain" or the code on the display.</p>${NOTE}`;
  }catch(err){out.innerHTML='<p>Sorry, search is not available right now.</p>'+NOTE}
});
function tabUrl(a,x){return `#/${a.slug}/${x.key.slice(a.slug.length+1)}`}
function phoneView(g){
  const p=g.phone;
  const steps=p.steps.map((st,i)=>{
    let out='',list=[];
    const flush=()=>{if(list.length){out+='<ul>'+list.map(t=>`<li>${t}</li>`).join('')+'</ul>';list=[]}};
    st.items.forEach(it=>{ if(it.img){flush();out+=`<figure class="fig"><button type="button" data-zoom="${it.img}" aria-label="Enlarge picture"><img src="${it.img}" width="${it.w}" height="${it.h}" loading="lazy" alt="${esc(it.cap)}"></button><figcaption>${esc(it.cap)}</figcaption></figure>`} else list.push(it.html) });
    flush();
    return `<section class="step"><h3><span class="num">${i+1}</span>${esc(st.title)}</h3>${out}</section>`;
  }).join('');
  return `<div class="imp"><b>IMPORTANT</b>${p.important}</div>${steps}
  <div class="gstop"><b>STOP AND CONTACT PROPERTY MANAGEMENT</b>${p.stop}</div>
  <p class="src">${p.footer}</p>`;
}
function guide(a,g){
  document.title=`${g.label} - ${a.title}`;
  const i=a.guides.indexOf(g),prev=a.guides[i-1],nxt=a.guides[i+1];
  const pages=g.pages.map((p,k)=>`<a class="page" href="${p.src}" target="_blank" rel="noopener"><img src="${p.src}" width="${p.w}" height="${p.h}" loading="lazy" alt="${esc(g.label)} guide, page ${k+1} of ${g.pages.length}"></a>`).join('');
  const dl=`<a class="dl" href="${g.pdf}" download="${esc(a.title+' - '+g.label)}.pdf"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Download PDF (${g.kb>1024?(g.kb/1024).toFixed(1)+' MB':g.kb+' KB'})</a>`;
  app.innerHTML=`<a class="back" href="#/">&larr; ${DATA.length>1?'All appliances':'Back'}</a>
  <h2 class="gtitle">${esc(a.title)}${g.phone?' &middot; '+esc(g.label):''}</h2>${a.sub?`<p class="gsub">${esc(a.sub)}</p>`:''}
  <nav class="tabs">${a.guides.map(x=>`<a class="tab" href="${tabUrl(a,x)}"${x===g?' aria-current="page"':''}>${esc(x.label)}</a>`).join('')}</nav>
  ${/-troubleshooting$/.test(g.key)?askBox(a):''}
  ${g.phone?`<p class="swipe">Swipe left or right to switch guides. Tap a picture to enlarge it.</p>${phoneView(g)}
    <div class="next">${prev?`<a href="${tabUrl(a,prev)}">&larr; ${esc(prev.label)}</a>`:''}${nxt?`<a href="${tabUrl(a,nxt)}">${esc(nxt.label)} &rarr;</a>`:''}</div>
    ${dl}<details class="printed"><summary>See the printed version</summary>${pages}</details>`
  :`${dl}<p class="zoom">Tap a page to open it full size and zoom in.</p>${pages}
  <div class="stop"><strong>Still not working, or something looks unsafe?</strong>Stop using the appliance and contact property management.</div>`}`;
  app.dataset.prev=prev?tabUrl(a,prev):'';app.dataset.next=nxt?tabUrl(a,nxt):'';
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-zoom]');if(!b)return;
  const lb=document.createElement('div');lb.className='lb';lb.innerHTML=`<button type="button" aria-label="Close">&times;</button><img src="${b.dataset.zoom}" alt="">`;
  lb.addEventListener('click',ev=>{if(ev.target.tagName!=='IMG')lb.remove()});document.body.appendChild(lb);});
let sx=0,sy=0,st=0;
app.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
app.addEventListener('touchend',e=>{if(!sx||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=0;
  if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dx)<2*Math.abs(dy)||window.visualViewport&&visualViewport.scale>1.05)return;
  const to=dx<0?app.dataset.next:app.dataset.prev;if(to)location.hash=to;},{passive:true});
function route(){
  const m=location.hash.match(/^#\/([^/]+)\/([^/]+)/);
  const a=m&&DATA.find(x=>x.slug===m[1]);
  const g=a&&a.guides.find(x=>x.key===a.slug+'-'+m[2]);
  if(g)guide(a,g);else{home();app.dataset.prev=app.dataset.next='';}
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
</body>
