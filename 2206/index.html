<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellagio Belleview Residence Appliance Guides</title>
<meta name="description" content="How to use, care for and troubleshoot the appliances in your apartment.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2329;--muted:#5d6670;--line:#e2e0db;--accent:#0f5c78;--accent-ink:#fff;--soft:#e8f1f4;--warn:#9a2b1d;--warn-bg:#fdf0ed}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--accent);color:var(--accent-ink);padding:22px 0 20px}
header h1{margin:0;font-size:1.5rem;line-height:1.2}
header p{margin:6px 0 0;opacity:.9;font-size:.95rem}
main{padding:18px 0 40px}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.appl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.appl-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.appl h2{margin:0;font-size:1.15rem;line-height:1.25}
.appl .sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px 6px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);background:#fff;text-decoration:none;font-weight:600;font-size:.92rem;line-height:1.2}
.btn:active{background:var(--soft)}
@media (max-width:420px){.btns{grid-template-columns:1fr}.btn{justify-content:flex-start;padding:10px 14px}}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;text-decoration:none}
.gtitle{margin:4px 0 2px;font-size:1.35rem;line-height:1.25}
.gsub{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.tab{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;min-height:46px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem}
.tab[aria-current=page]{background:var(--accent);border-color:var(--accent);color:#fff}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;margin:0 0 14px}
.page{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
.page img{display:block;width:100%;height:auto}
.zoom{color:var(--muted);font-size:.85rem;margin:-4px 0 12px;text-align:center}
.stop{background:var(--warn-bg);border:1px solid #f0c9c1;color:var(--warn);border-radius:12px;padding:14px 16px;margin:18px 0 0;font-size:.95rem}
.stop strong{display:block;margin-bottom:2px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 6px}
.imp{background:#fff6dd;border:1px solid #f0d58a;border-left:6px solid #d99a00;border-radius:12px;padding:14px 16px;margin:0 0 16px;font-size:1rem}
.imp b{display:block;color:#8a5a00;letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.step h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:1.15rem;line-height:1.25}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1rem}
.step ul{margin:0 0 12px;padding-left:1.2em}
.step li{margin:0 0 8px;font-size:1.05rem;line-height:1.5}
.step li:last-child{margin-bottom:0}
.step ul:last-child,.fig:last-child{margin-bottom:0}
.fig{margin:0 0 12px}
.fig button{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.fig img{display:block;max-width:100%;max-height:300px;margin:0 auto;height:auto}
.fig figcaption{color:var(--muted);font-size:.8rem;margin-top:4px;text-align:center}
.c-red{color:#c0261b}.c-blue{color:#1f5fbf}.c-green{color:#1d7a35}.c-orange{color:#c25e00}
.gstop{background:var(--warn-bg);border:1px solid #f0c9c1;border-left:6px solid var(--warn);border-radius:12px;padding:14px 16px;margin:4px 0 16px;color:#5a1a12;font-size:1rem}
.gstop b{display:block;color:var(--warn);letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.src{color:var(--muted);font-size:.8rem;margin:0 0 16px}
.next{display:flex;justify-content:space-between;gap:8px;margin:0 0 14px}
.next a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;font-weight:600;text-align:center;padding:6px}
details.printed{margin:0 0 14px}
details.printed summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent);cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;overflow:auto;display:flex;align-items:center;justify-content:center;padding:56px 8px 16px}
.lb img{max-width:100%;height:auto;background:#fff;border-radius:6px}
.lb button{position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:1.4rem;line-height:1}
.swipe{color:var(--muted);font-size:.8rem;text-align:center;margin:0 0 10px}
.ask{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:14px;margin:0 0 16px}
.ask label{display:block;font-weight:700;margin:0 0 8px;font-size:1.05rem}
.askrow{display:flex;gap:8px}
.ask input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:1rem}
.ask button{min-height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700}
.askout{margin-top:10px;font-size:1rem}
.askout:empty{display:none}
.ans{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 8px}
.ans p{margin:0 0 8px}.ans p:last-child,.ans ul:last-child{margin-bottom:0}
.ans ul{margin:0 0 8px;padding-left:1.2em}
.hit{border-left:4px solid var(--accent);background:#f8fafb;border-radius:6px;padding:8px 12px;margin:0 0 8px;font-size:.95rem}
.hit small,.srcs{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.hit mark{background:#fff0a8;color:inherit}
.asknote{color:var(--warn);font-size:.9rem;margin:6px 0 0}
footer{color:var(--muted);font-size:.85rem;padding:0 0 30px}
</style>
</head>

<footer class="wrap">Toronto Boutique Apartments</footer>
<script>
const DATA=[{"slug": "lg-washer", "title": "LG washer", "sub": "Front-load, WM5500 / WM6500 series", "icon": "washer", "guides": [{"key": "lg-washer-how-to-use", "label": "How to Use", "pdf": "/files/lg-washer-how-to-use.pdf", "pages": [{"src": "/pages/lg-washer-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 244, "phone": {"kicker": "WASHER GUIDE", "title": "How to Use the Washer", "model": "LG front-load washer WM5500H*A or WM6500H*A (model to confirm)", "important": "Use only <strong>HE (High-Efficiency)</strong> detergent, and less than half the maximum on the bottle for an average load. Pods, gel and tablets go in the drum, never in the drawer. Never mix chlorine bleach with ammonia or vinegar. Do not touch the door during steam cycles: it gets very hot. Keep children and pets out of the drum.", "stop": "Water leaks or pools under the washer. A message comes back after a restart, or the washer will not fill or drain. A burning smell, smoke, or a loud banging or grinding noise. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual MFL71964314 for LG washers WM5500H*A and WM6500H*A. Pictures are taken from that manual.", "steps": [{"title": "Load", "items": [{"html": "Sort by colour, dirt level and fabric. Wash darks apart from lights."}, {"html": "Empty pockets, close zippers and hooks, tie strings. Small items go in a mesh bag."}, {"html": "Load loosely, large items first. Do not press clothes down: the door must close easily."}, {"html": "Do not wash one small item alone. DO NOT OVERLOAD. Overloading will cause leak."}, {"html": "Waterproof items (rain jackets, mattress covers): use the <strong>Bedding</strong> cycle only."}, {"html": "Check that nothing hangs over the rubber door seal."}]}, {"title": "Detergent", "items": [{"img": "/img/lg-washer-how-to-use/dispenser-p21.png", "w": 744, "h": 1008, "cap": "1 Pre-wash (some models), 2 liquid detergent cup, 3 main wash detergent, 4 fabric softener, 5 liquid chlorine bleach. Manual, page 21."}, {"html": "<strong>HE detergent</strong> goes in the main wash compartment (3). Liquid: keep the liquid detergent cup (2) in place. Powder: take the cup out first."}, {"html": "<strong>Pods, gel or tablets</strong>: one only, in the empty drum before the clothes."}, {"html": "<strong>Fabric softener</strong> (4) and <strong>liquid chlorine bleach</strong> (5): never past the MAX line. Never more than 1 cup of bleach."}, {"html": "Close the drawer gently. A little water left in it after the wash is normal."}, {"html": "Do not keep detergent or bleach on top of the washer."}]}, {"title": "Cycle and settings", "items": [{"img": "/img/lg-washer-how-to-use/control-panel-p23.png", "w": 1598, "h": 383, "cap": "1 Power, 2 cycle knob, 3 Back and \u2713 (OK), 4 display, 5 Start/Pause, 6 Temp., Spin, Soil, 7 options. Manual, page 23."}, {"html": "Press <strong>Power</strong> (1). Turn the knob (2) to a cycle and press <strong>\u2713</strong> (3)."}, {"img": "/img/lg-washer-how-to-use/knob-display-p24.png", "w": 598, "h": 661, "cap": "Screen inside the knob: it shows the cycle and settings. Back and \u2713 (OK) buttons below. Manual, page 24."}, {"html": "<strong>Normal</strong>: cotton, jeans, mixed loads. <strong>AI Wash</strong>: adjusts to the load. <strong>Towels</strong>. <strong>Heavy Duty</strong>. <strong>Bedding</strong>: comforters and waterproof items. <strong>Delicates</strong>. <strong>Quick Wash</strong>: small, lightly soiled loads."}, {"html": "<strong><span class=\"c-red\">Not sure?</span> Choose</strong> <span class=\"c-red\"><strong>Normal</strong></span> for everyday laundry."}, {"html": "Change <strong>Temp.</strong>, <strong>Spin</strong> and <strong>Soil</strong> with the buttons (6). Two chimes and no light means that setting is not allowed for this cycle."}, {"img": "/img/lg-washer-how-to-use/settings-lights-p25.png", "w": 473, "h": 306, "cap": "Temp., Spin and Soil levels light up 1 to 5. Manual, page 25."}, {"html": "<strong>Extra Rinse</strong> (1 to 3 rinses), <strong>Delay Start</strong> (1 to 19 hours), <strong>Fresh Care</strong> (tumbles for up to 19 hours if you cannot unload right away)."}]}, {"title": "Start and finish", "items": [{"html": "Press <strong>Start/Pause</strong> (5). The door locks and the drum turns briefly to weigh the load. Start soon after choosing, or the washer turns off."}, {"html": "Seeing very little water is normal for this washer."}, {"html": "<strong>Pause</strong>: press Start/Pause. <strong>Cancel</strong>: press Power; the door unlocks after a short pause."}, {"html": "Buttons beep but nothing happens? <strong>Control Lock</strong> is on. Press <strong>Options</strong>, turn the knob to Control Lock, press <strong>\u2713</strong>, choose Off, press <strong>\u2713</strong>."}, {"html": "At the end a melody plays. Unload straight away and check the door seal for small items."}, {"html": "Leave the door open so the drum dries."}]}]}}, {"key": "lg-washer-care", "label": "Appliance Care", "pdf": "/files/lg-washer-care.pdf", "pages": [{"src": "/pages/lg-washer-care-1.jpg", "w": 1870, "h": 1445}], "kb": 277, "phone": {"kicker": "WASHER GUIDE", "title": "Washer Care", "model": "LG front-load washer WM5500H*A or WM6500H*A (model to confirm)", "important": "Wear rubber gloves and goggles when cleaning with bleach, and always dilute it. Never mix chlorine bleach with ammonia or vinegar. Do not spray water on or into the washer. No steel wool, abrasive cleaners, alcohol or solvents. Opening the drain filter lets water out: only do it with towels and a shallow pan ready.", "stop": "A water hose behind the washer is leaking, kinked or cracked. A bad smell stays after three weekly Tub Clean cycles. The washer shows <strong>Water supply</strong> with the taps open (the water inlet filters behind it may need cleaning). The room could freeze. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual MFL71964314 for LG washers WM5500H*A and WM6500H*A. Pictures are taken from that manual.", "steps": [{"title": "After every load", "items": [{"html": "Take the laundry out as soon as the cycle ends."}, {"html": "Wipe the door, the door glass and the inside of the rubber seal dry."}, {"html": "Leave the door open, overnight if you can, so the drum dries. This prevents smells. Keep children and pets out."}, {"html": "Wipe spills on the outside straight away with a damp cloth."}]}, {"title": "Monthly drum clean", "items": [{"img": "/img/lg-washer-care/control-panel-p23.png", "w": 1598, "h": 383, "cap": "1 Power, 2 cycle knob, 3 Back and \u2713 (OK), 4 display, 5 Start/Pause, 6 Temp., Spin, Soil, 7 options. Manual, page 23."}, {"html": "Empty drum. Add a washer drum cleaner to the main detergent compartment, or liquid chlorine bleach to the bleach compartment (not past MAX). Cleaning tablets go in the drum."}, {"html": "Press <strong>Power</strong>, turn the knob to <strong>Tub Clean</strong>, press <strong>Start/Pause</strong>."}, {"html": "No Tub Clean on the knob? Press <strong>Options</strong>, choose <strong>Cycle List Edit</strong>, turn to Tub Clean and press <strong>\u2713</strong> to add it."}, {"html": "Afterwards leave the door open to dry. If you used a cleaner or descaler, run <strong>Rinse+Spin</strong> (add it the same way) before the next wash."}, {"html": "Smell already there? Run Tub Clean once a week for 3 weeks."}]}, {"title": "Dispenser drawer (once or twice a month)", "items": [{"img": "/img/lg-washer-care/drawer-release-p41.png", "w": 536, "h": 320, "cap": "Press the release button (1) to take the drawer out. Manual, page 41."}, {"html": "Turn off and unplug the washer. Pull the drawer out until it stops."}, {"html": "Press down hard on the release button (1) and pull the drawer all the way out. Take out the inserts."}, {"html": "Clean them with warm water and a soft cloth or brush. No soap. Dry them."}, {"html": "Brush out the drawer opening with a small non-metal brush, then slide the drawer back in."}]}, {"title": "Door seal (monthly)", "items": [{"html": "Wear rubber gloves and goggles. Mix 3/4 cup (177 mL) of liquid chlorine bleach in 1 gallon (3.8 L) of water. Never use bleach undiluted."}, {"html": "Wipe all around the seal with a sponge or soft cloth, then dry it with a towel."}, {"html": "Leave the door open until the seal is completely dry."}, {"html": "Hard water spots on the drum: a soft cloth with stainless steel cleaner. Then run Tub Clean."}]}, {"title": "Drain filter (if it won't drain)", "items": [{"img": "/img/lg-washer-care/drain-cover-p43.png", "w": 619, "h": 328, "cap": "Open the drain filter cover at the bottom front. Manual, page 43."}, {"html": "Turn off and unplug the washer. Put towels and a shallow pan on the floor."}, {"html": "Open the drain filter cover. Unclip the small drain hose, pull out its plug and let the water run into the pan."}, {"img": "/img/lg-washer-care/drain-water-p43.png", "w": 619, "h": 411, "cap": "Drain the water. Manual, page 43."}, {"html": "Twist the filter counterclockwise to take it out. Remove lint, coins and other objects."}, {"img": "/img/lg-washer-care/drain-filter-p43.png", "w": 661, "h": 431, "cap": "Twist to remove the filter. Manual, page 43."}, {"html": "Put the plug back in the hose and clip it. Twist the filter clockwise until tight. Close the cover."}, {"html": "Still won&#x27;t drain, or water keeps coming out: contact property management."}]}]}}, {"key": "lg-washer-troubleshooting", "label": "Troubleshooting", "pdf": "/files/lg-washer-troubleshooting.pdf", "pages": [{"src": "/pages/lg-washer-troubleshooting-1.jpg", "w": 1870, "h": 1445}], "kb": 43, "phone": {"kicker": "WASHER GUIDE", "title": "Washer Troubleshooting", "model": "LG front-load washer WM5500H*A or WM6500H*A (model to confirm)", "important": "Water leaking, or the message <strong>Water too high</strong>: stop using the washer, turn off its water taps if you know where they are, and contact property management right away.", "stop": "Water leaks. <strong>Water too high</strong>, <strong>No water detected</strong>, <strong>Vibration sensor</strong>, <strong>Steam error</strong>, <strong>No temp detected</strong> or <strong>Voltage abnormality</strong>. <strong>Motor error</strong> after waiting 30 minutes. A message comes back after a restart. A burning smell or smoke. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual MFL71964314 for LG washers WM5500H*A and WM6500H*A. Pictures are taken from that manual.", "steps": [{"title": "Won't start", "items": [{"html": "Press <strong>Power</strong>, choose a cycle, close the door fully, then press <strong>Start/Pause</strong>. If you wait too long after choosing, the washer turns off."}, {"html": "Buttons beep but nothing happens? <strong>Control Lock</strong> is on. Press <strong>Options</strong>, turn the knob to Control Lock, press <strong>\u2713</strong>, choose Off, press <strong>\u2713</strong>."}, {"html": "<strong>Door open</strong> or <strong>Door unlocked</strong>: open and close the door. Check nothing is caught in the seal."}, {"html": "Display stays dark: the breaker may be off. A washer left in the cold must warm up first."}, {"html": "<strong>Power failure</strong>: press <strong>Start/Pause</strong> to restart."}]}, {"title": "Messages", "items": [{"html": "<strong>Water supply</strong>: the water taps may not be fully open, or a hose is kinked. Contact property management."}, {"html": "<strong>Unbalance</strong>: load too small or tangled. Pause, spread the clothes out, or add a few similar items."}, {"html": "<strong>Oversudsing</strong>: too much detergent. The washer removes suds for about 2 hours. Use less HE detergent next time."}, {"html": "   try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({appliance:slug,question:q}),signal:ctl.signal});clearTimeout(tm);
    if(r.ok){const j=await r.json();if(j.answer){out.innerHTML=`<div class="ans">${mdish(j.answer)}</div>${j.sources&&j.sources.length?`<span class="srcs">From: ${esc(j.sources.join(', '))}</span>`:''}${NOTE}`;return}}
  }catch(err){}
  try{const kb=await getKB(slug);const hits=search(kb,q);
    out.innerHTML=hits.length?`<p>Here is what the manual and guides say:</p>${hits.map(h=>`<div class="hit">${h.title?`<strong>${esc(h.title)}:</strong> `:''}${hl(h.text,q)}<small>${esc(h.src)}</small></div>`).join('')}${NOTE}`
      :`<p>Nothing in the manual matches that. Try other words, for example "won't drain" or the code on the display.</p>${NOTE}`;
  }catch(err){out.innerHTML='<p>Sorry, search is not available right now.</p>'+NOTE}
});
function tabUrl(a,x){return `#/${a.slug}/${x.key.slice(a.slug.length+1)}`}
function phoneView(g){
  const p=g.phone;
  const steps=p.steps.map((st,i)=>{
    let out='',list=[];
    const flush=()=>{if(list.length){out+='<ul>'+list.map(t=>`<li>${t}</li>`).join('')+'</ul>';list=[]}};
    st.items.forEach(it=>{ if(it.img){flush();out+=`<figure class="fig"><button type="button" data-zoom="${it.img}" aria-label="Enlarge picture"><img src="${it.img}" width="${it.w}" height="${it.h}" loading="lazy" alt="${esc(it.cap)}"></button><figcaption>${esc(it.cap)}</figcaption></figure>`} else list.push(it.html) });
    flush();
    return `<section class="step"><h3><span class="num">${i+1}</span>${esc(st.title)}</h3>${out}</section>`;
  }).join('');
  return `<div class="imp"><b>IMPORTANT</b>${p.important}</div>${steps}
  <div class="gstop"><b>STOP AND CONTACT PROPERTY MANAGEMENT</b>${p.stop}</div>
  <p class="src">${p.footer}</p>`;
}
function guide(a,g){
  document.title=`${g.label} - ${a.title}`;
  const i=a.guides.indexOf(g),prev=a.guides[i-1],nxt=a.guides[i+1];
  const pages=g.pages.map((p,k)=>`<a class="page" href="${p.src}" target="_blank" rel="noopener"><img src="${p.src}" width="${p.w}" height="${p.h}" loading="lazy" alt="${esc(g.label)} guide, page ${k+1} of ${g.pages.length}"></a>`).join('');
  const dl=`<a class="dl" href="${g.pdf}" download="${esc(a.title+' - '+g.label)}.pdf"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Download PDF (${g.kb>1024?(g.kb/1024).toFixed(1)+' MB':g.kb+' KB'})</a>`;
  app.innerHTML=`<a class="back" href="#/">&larr; ${DATA.length>1?'All appliances':'Back'}</a>
  <h2 class="gtitle">${esc(a.title)}${g.phone?' &middot; '+esc(g.label):''}</h2>${a.sub?`<p class="gsub">${esc(a.sub)}</p>`:''}
  <nav class="tabs">${a.guides.map(x=>`<a class="tab" href="${tabUrl(a,x)}"${x===g?' aria-current="page"':''}>${esc(x.label)}</a>`).join('')}</nav>
  ${/-troubleshooting$/.test(g.key)?askBox(a):''}
  ${g.phone?`<p class="swipe">Swipe left or right to switch guides. Tap a picture to enlarge it.</p>${phoneView(g)}
    <div class="next">${prev?`<a href="${tabUrl(a,prev)}">&larr; ${esc(prev.label)}</a>`:''}${nxt?`<a href="${tabUrl(a,nxt)}">${esc(nxt.label)} &rarr;</a>`:''}</div>
    ${dl}<details class="printed"><summary>See the printed version</summary>${pages}</details>`
  :`${dl}<p class="zoom">Tap a page to open it full size and zoom in.</p>${pages}
  <div class="stop"><strong>Still not working, or something looks unsafe?</strong>Stop using the appliance and contact property management.</div>`}`;
  app.dataset.prev=prev?tabUrl(a,prev):'';app.dataset.next=nxt?tabUrl(a,nxt):'';
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-zoom]');if(!b)return;
  const lb=document.createElement('div');lb.className='lb';lb.innerHTML=`<button type="button" aria-label="Close">&times;</button><img src="${b.dataset.zoom}" alt="">`;
  lb.addEventListener('click',ev=>{if(ev.target.tagName!=='IMG')lb.remove()});document.body.appendChild(lb);});
let sx=0,sy=0,st=0;
app.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
app.addEventListener('touchend',e=>{if(!sx||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=0;
  if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dx)<2*Math.abs(dy)||window.visualViewport&&visualViewport.scale>1.05)return;
  const to=dx<0?app.dataset.next:app.dataset.prev;if(to)location.hash=to;},{passive:true});
function route(){
  const m=location.hash.match(/^#\/([^/]+)\/([^/]+)/);
  const a=m&&DATA.find(x=>x.slug===m[1]);
  const g=a&&a.guides.find(x=>x.key===a.slug+'-'+m[2]);
  if(g)guide(a,g);else{home();app.dataset.prev=app.dataset.next='';}
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
</body>
