<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appliance Guides</title>
<meta name="description" content="How to use, care for and troubleshoot the appliances in your apartment.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2329;--muted:#5d6670;--line:#e2e0db;--accent:#0f5c78;--accent-ink:#fff;--soft:#e8f1f4;--warn:#9a2b1d;--warn-bg:#fdf0ed}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--accent);color:var(--accent-ink);padding:22px 0 20px}
header h1{margin:0;font-size:1.5rem;line-height:1.2}
header p{margin:6px 0 0;opacity:.9;font-size:.95rem}
main{padding:18px 0 40px}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.appl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.appl-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.appl h2{margin:0;font-size:1.15rem;line-height:1.25}
.appl .sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px 6px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);background:#fff;text-decoration:none;font-weight:600;font-size:.92rem;line-height:1.2}
.btn:active{background:var(--soft)}
@media (max-width:420px){.btns{grid-template-columns:1fr}.btn{justify-content:flex-start;padding:10px 14px}}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;text-decoration:none}
.gtitle{margin:4px 0 2px;font-size:1.35rem;line-height:1.25}
.gsub{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.tab{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;min-height:46px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem}
.tab[aria-current=page]{background:var(--accent);border-color:var(--accent);color:#fff}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;margin:0 0 14px}
.page{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
.page img{display:block;width:100%;height:auto}
.zoom{color:var(--muted);font-size:.85rem;margin:-4px 0 12px;text-align:center}
.stop{background:var(--warn-bg);border:1px solid #f0c9c1;color:var(--warn);border-radius:12px;padding:14px 16px;margin:18px 0 0;font-size:.95rem}
.stop strong{display:block;margin-bottom:2px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 6px}
.imp{background:#fff6dd;border:1px solid #f0d58a;border-left:6px solid #d99a00;border-radius:12px;padding:14px 16px;margin:0 0 16px;font-size:1rem}
.imp b{display:block;color:#8a5a00;letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.step h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:1.15rem;line-height:1.25}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1rem}
.step ul{margin:0 0 12px;padding-left:1.2em}
.step li{margin:0 0 8px;font-size:1.05rem;line-height:1.5}
.step li:last-child{margin-bottom:0}
.step ul:last-child,.fig:last-child{margin-bottom:0}
.fig{margin:0 0 12px}
.fig button{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.fig img{display:block;max-width:100%;max-height:300px;margin:0 auto;height:auto}
.fig figcaption{color:var(--muted);font-size:.8rem;margin-top:4px;text-align:center}
.c-red{color:#c0261b}.c-blue{color:#1f5fbf}.c-green{color:#1d7a35}.c-orange{color:#c25e00}
.gstop{background:var(--warn-bg);border:1px solid #f0c9c1;border-left:6px solid var(--warn);border-radius:12px;padding:14px 16px;margin:4px 0 16px;color:#5a1a12;font-size:1rem}
.gstop b{display:block;color:var(--warn);letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.src{color:var(--muted);font-size:.8rem;margin:0 0 16px}
.next{display:flex;justify-content:space-between;gap:8px;margin:0 0 14px}
.next a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;font-weight:600;text-align:center;padding:6px}
details.printed{margin:0 0 14px}
details.printed summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent);cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;overflow:auto;display:flex;align-items:center;justify-content:center;padding:56px 8px 16px}
.lb img{max-width:100%;height:auto;background:#fff;border-radius:6px}
.lb button{position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:1.4rem;line-height:1}
.swipe{color:var(--muted);font-size:.8rem;text-align:center;margin:0 0 10px}
.ask{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:14px;margin:0 0 16px}
.ask label{display:block;font-weight:700;margin:0 0 8px;font-size:1.05rem}
.askrow{display:flex;gap:8px}
.ask input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:1rem}
.ask button{min-height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700}
.askout{margin-top:10px;font-size:1rem}
.askout:empty{display:none}
.ans{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 8px}
.ans p{margin:0 0 8px}.ans p:last-child,.ans ul:last-child{margin-bottom:0}
.ans ul{margin:0 0 8px;padding-left:1.2em}
.hit{border-left:4px solid var(--accent);background:#f8fafb;border-radius:6px;padding:8px 12px;margin:0 0 8px;font-size:.95rem}
.hit small,.srcs{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.hit mark{background:#fff0a8;color:inherit}
.asknote{color:var(--warn);font-size:.9rem;margin:6px 0 0}
.langpick{display:inline-flex;align-items:center;gap:8px;margin:14px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);border-radius:22px;padding:0 6px 0 12px;max-width:100%}
.langpick[hidden]{display:none}
.langpick select{min-height:42px;max-width:72vw;border:0;background:transparent;color:#fff;font:inherit;font-size:1rem;font-weight:600;padding:0 6px;cursor:pointer}
.langpick select option,.langpick select optgroup{color:#1d2329;background:#fff}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.busy{color:var(--muted);text-align:center;padding:30px 0}
[dir=rtl] .imp{border-left:1px solid #f0d58a;border-right:6px solid #d99a00}
[dir=rtl] .gstop{border-left:1px solid #f0c9c1;border-right:6px solid var(--warn)}
[dir=rtl] .hit{border-left:0;border-right:4px solid var(--accent)}
[dir=rtl] .step ul,[dir=rtl] .ans ul{padding-left:0;padding-right:1.2em}
[dir=rtl] .lb button{right:auto;left:10px}
.fallback{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:0 0 12px}
footer{color:var(--muted);font-size:.85rem;padding:0 0 30px}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="h1">Appliance Guides</h1><p id="tag">How to use, care for and fix common problems with the appliances in your apartment.</p><label class="langpick" id="langpick" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 2.6 15.2 0 18M12 3c-2.6 2.8-2.6 15.2 0 18"/></svg><span class="vh" id="langlbl">Language</span><select id="langsel"></select></label></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap">Toronto Boutique Apartments</footer>
<script>
const DATA=[];
const UNIT=null;
const LANGS=[];
const VER="9c1f5e6c2c";
const EN={name:'English',title:'Appliance Guides',tag:'How to use, care for and fix common problems with the appliances in your apartment.',
 hint:'Find your appliance below and pick a guide. Not sure which model you have? Check the label inside the door or on the back.',
 none:'Please use the guide link for your unit from property management.',lang:'Language',ask:'Ask about a problem',ph:'e.g. water left at the bottom',askBtn:'Ask',
 looking:'Looking in the manual…',from:'From',found:'Here is what the manual and guides say:',
 nothing:'Nothing in the manual matches that. Try other words, for example "won\'t drain" or the code on the display.',
 unavailable:'Sorry, search is not available right now.',note:'Still not working, or something looks unsafe? Stop using the appliance and contact property management.',
 all:'All appliances',back:'Back',swipe:'Swipe left or right to switch guides. Tap a picture to enlarge it.',dl:'Download PDF',printed:'See the printed version',
 zoom:'Tap a page to open it full size and zoom in.',stopT:'Still not working, or something looks unsafe?',stopB:'Stop using the appliance and contact property management.',
 imp:'IMPORTANT',stopBox:'STOP AND CONTACT PROPERTY MANAGEMENT',fallback:'',enlarge:'Enlarge picture',page:'page',of:'of',guide:'guide',
 auto:'Translated automatically from the English guide. The PDF download is in English.',
 labels:{'how-to-use':'How to Use','care':'Appliance Care','troubleshooting':'Troubleshooting'}};
// Languages offered through automatic translation (only shown when it is switched on)
const AUTO=['am','ti','so','sw','yo','ig','ha','om','he','ja','th','km','lo','my','ne','si','ml','te','kn','mr','ps','prs','ku','az','hy','ka','kk','uz','ky','tg','mn','id','ms','de','nl','ro','hu','cs','sk','sl','sr','hr','bs','sq','bg','mk','lt','lv','et','fi','sv','no','da','is','ht'].filter(c=>!LANGS.some(l=>l.code===c));
const PRE=new Set(LANGS.map(l=>l.code));
let AUTO_OK=false,LANG='en',B=null;
function native(c){try{const n=new Intl.DisplayNames([c],{type:'language'}).of(c);return n&&n!==c?n.charAt(0).toLocaleUpperCase(c)+n.slice(1):c}catch(e){return c}}
function norm(c){if(!c)return '';c=String(c).toLowerCase().replace('_','-');
  if(c.startsWith('zh'))return /(hant|tw|hk|mo)/.test(c)?'zh-hant':'zh-hans';
  if(c==='fil'||c.startsWith('fil-'))return 'tl';if(c==='nb'||c==='nn')return 'no';if(c==='iw')return 'he';
  if(PRE.has(c)||AUTO.includes(c))return c;return c.split('-')[0]}
function pickLang(){const q=norm(new URLSearchParams(location.search).get('lang'));let s='';try{s=norm(localStorage.getItem('lang'))}catch(e){}
  if(q==='en'||PRE.has(q)||AUTO.includes(q))return q;if(s==='en'||PRE.has(s))return s;
  for(const n of (navigator.languages||[navigator.language]).map(norm)){if(n==='en')return 'en';if(PRE.has(n))return n}return 'en'}
const t=()=>B?Object.assign({},EN,B.ui):EN;
const cache={};
async function bundle(code){
  if(code==='en')return null;
  if(cache[code])return cache[code];
  if(PRE.has(code)){const r=await fetch('/i18n/'+code+'.json');if(!r.ok)throw 0;return cache[code]=await r.json()}
  const parts=['ui'].concat(DATA.map(a=>a.slug)),b={code,dir:['he','ps','prs','ar','fa','ur'].includes(code)?'rtl':'ltr',auto:true,ui:{},apps:{}};
  await Promise.all(parts.map(async p=>{const key=`tx:${VER}:${code}:${p}`;let d=null;try{d=JSON.parse(localStorage.getItem(key))}catch(e){}
    if(!d){const r=await fetch(`/api/translate?lang=${encodeURIComponent(code)}&part=${encodeURIComponent(p)}&v=${VER}`);if(!r.ok)throw 0;d=(await r.json()).data;try{localStorage.setItem(key,JSON.stringify(d))}catch(e){}}
    if(p==='ui')b.ui=d;else b.apps[p]=d}));
  return cache[code]=b;
}
async function setLang(l,save){
  const prev=LANG;LANG=l;
  if(l!=='en'&&!cache[l])app.innerHTML=`<p class="busy">${PRE.has(l)?'…':'Translating… / '+esc(native(l))+' …'}</p>`;
  try{B=await bundle(l)}catch(e){B=null;LANG='en';
    if(save!==false)alert('Sorry, '+native(l)+' is not available right now. Showing English.');}
  if(save!==false){try{localStorage.setItem('lang',LANG)}catch(e){}}
  const u=new URL(location.href);if(LANG==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',LANG);history.replaceState(null,'',u);
  chrome();route();
}
function chrome(){const html=B&&B.html||LANG;document.documentElement.lang=html==='zh-hans'?'zh-Hans':html==='zh-hant'?'zh-Hant':html;
  document.documentElement.dir=B&&B.dir==='rtl'?'rtl':'ltr';
  document.getElementById('h1').textContent=(UNIT?UNIT+' ':'')+t().title;document.getElementById('tag').textContent=t().tag;
  const sel=document.getElementById('langsel'),pick=document.getElementById('langpick');
  document.getElementById('langlbl').textContent=t().lang;sel.setAttribute('aria-label',t().lang==='Language'?'Language':t().lang+' / Language');
  if(!LANGS.length&&!AUTO_OK){pick.hidden=true;return}
  const opt=(c,n)=>`<option value="${c}"${c===LANG?' selected':''}>${esc(n)}</option>`;
  let h=opt('en','English')+LANGS.map(l=>opt(l.code,l.name)).join('');
  const auto=AUTO.map(c=>[c,native(c)]).sort((a,b)=>a[1].localeCompare(b[1]));
  if(AUTO_OK)h+=`<optgroup label="More languages (automatic translation)">${auto.map(([c,n])=>opt(c,n)).join('')}</optgroup>`;
  else if(!PRE.has(LANG)&&LANG!=='en')h+=opt(LANG,native(LANG));
  sel.innerHTML=h;pick.hidden=false;}
document.getElementById('langsel').addEventListener('change',e=>setLang(e.target.value));
const AL=a=>(B&&B.apps[a.slug])?{title:B.apps[a.slug].title||a.title,sub:B.apps[a.slug].sub||''}:{title:a.title,sub:a.sub};
const kindOf=(a,g)=>g.key.slice(a.slug.length+1);
function GL(a,g){const k=kindOf(a,g),x=B&&B.apps[a.slug]&&B.apps[a.slug].guides&&B.apps[a.slug].guides[k];
  return x?{label:x.label,pdf:x.pdf||g.pdf,pages:x.pages||[],kb:x.kb||g.kb,phone:x.phone,fb:false,auto:!!B.auto}:{label:LANG==='en'?g.label:t().labels[k],pdf:g.pdf,pages:g.pages,kb:g.kb,phone:g.phone,fb:LANG!=='en',auto:false}}
const ICONS={
washer:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="2.5" width="16" height="19" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M7 6h3M15.5 6h.5"/></svg>',
dryer:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="2.5" width="16" height="19" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M10 11.5c1 .8 1 2.2 0 3M13 11.5c1 .8 1 2.2 0 3M7 6h3"/></svg>',
dishwasher:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M4 7h16M8 4.8h2M12 11v6M9 13v4M15 13v4"/></svg>'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
function home(){
  document.title=(UNIT?UNIT+' ':'')+t().title;
  if(!DATA.length){app.innerHTML=`<p class="hint">${esc(t().none)}</p>`;return;}
  app.innerHTML=`<p class="hint">${esc(t().hint)}</p>`+
  DATA.map(a=>{const L=AL(a);return `<section class="appl"><div class="appl-head"><div class="ico">${ICONS[a.icon]||''}</div><div><h2>${esc(L.title)}</h2>${L.sub?`<p class="sub">${esc(L.sub)}</p>`:''}</div></div>
  <div class="btns">${a.guides.map(g=>`<a class="btn" href="#/${a.slug}/${kindOf(a,g)}">${esc(GL(a,g).label)}</a>`).join('')}</div></section>`}).join('');
}
function askBox(a){return `<form class="ask" data-appl="${a.slug}"><label for="askq">${esc(t().ask)}</label><div class="askrow"><input id="askq" type="search" maxlength="300" placeholder="${esc(t().ph)}" autocomplete="off" required><button type="submit">${esc(t().askBtn)}</button></div><div class="askout" aria-live="polite"></div></form>`}
// ---- search fallback (used when the AI answer is not available)
const KB={};
const STOPW={en:new Set('a an the is it my i me to of and or on in at for with my our its this that there be are was were do does did not no can cant wont dont doesnt isnt what why how when where which who will would should could have has had get got keep keeps after before from just very still any some'.split(' ')),
 tr:new Set('ve veya bir bu şu o da de mi mı mu mü ne için ile çok daha gibi ama ya ben benim bana sen var yok nasıl neden niye ne zaman hangi her şey olarak gibi kadar sonra önce hala hâlâ'.split(' '))};
const SYN={leak:['leak','water','drip','puddl','flood'],leaking:['leak','water'],drain:['drain','water','pump','standing'],smell:['smell','odor','odour'],odor:['smell','odor','odour'],noise:['noise','noisy','loud','sound','bang','rattl','vibrat'],loud:['noise','loud','sound'],start:['start','power','turn','run'],wet:['wet','damp','drying','rinse'],damp:['wet','damp','drying'],dry:['dry','wet','damp','heat'],hot:['heat','hot','temperatur'],cold:['heat','cold','temperatur'],code:['code','error','display'],error:['code','error','display'],door:['door','lock','latch'],soap:['detergent','suds','soap'],suds:['suds','detergent','foam'],dirty:['clean','dirty','residue','spot'],spots:['spot','residue','film','rinse']};
const HAN=/\p{Script=Han}|\p{Script=Hiragana}|\p{Script=Katakana}|\p{Script=Thai}/u;
function stem(w){if(LANG==='en'){for(const s of ['ing','ed','es','s']){if(w.length>4&&w.endsWith(s))return w.slice(0,-s.length)}return w}
  if(HAN.test(w))return w;if(/^ال/.test(w)&&w.length>4)w=w.slice(2);return w.length>5?w.slice(0,5):w}
function words(x){const loc=document.documentElement.lang;let s;try{s=x.toLocaleLowerCase(loc)}catch(e){s=x.toLowerCase()}
  if(typeof Intl!=='undefined'&&Intl.Segmenter){try{return [...new Intl.Segmenter(loc,{granularity:'word'}).segment(s)].filter(p=>p.isWordLike).map(p=>p.segment)}catch(e){}}
  return s.match(/[\p{L}\p{N}\p{M}]+/gu)||[]}
function toks(x){const sw=STOPW[LANG];return words(x).filter(w=>(w.length>1||HAN.test(w))&&!(sw&&sw.has(w))).map(stem)}
function pool(slug,kb){
  if(LANG==='en')return kb.chunks;
  const ap=B&&B.apps[slug];if(!ap)return kb.chunks;const out=[];
  Object.entries(ap.guides||{}).forEach(([k,g])=>{if(g.phone)g.phone.steps.forEach(st=>st.items.forEach(it=>{if(it.html){const d=document.createElement('div');d.innerHTML=it.html;out.push({src:g.label,title:st.title,text:d.textContent,trb:k==='troubleshooting'})}}))});
  return out}
function search(chunks,q){
  const qt=toks(q);let terms=new Map();
  qt.forEach(x=>{terms.set(x,/\d/.test(x)?3:1.5);if(LANG==='en')(SYN[x]||[]).forEach(y=>{if(!terms.has(stem(y)))terms.set(stem(y),.6)})});
  if(!chunks.length||!terms.size)return[];
  const docs=chunks.map(c=>({c,t:toks(c.text+' '+(c.title||''))}));const N=docs.length,avg=docs.reduce((s,d)=>s+d.t.length,0)/N||1;
  const df={};terms.forEach((w,x)=>{df[x]=docs.filter(d=>d.t.some(y=>y.startsWith(x))).length});
  return docs.map(d=>{let sc=0;terms.forEach((w,x)=>{const f=d.t.filter(y=>y.startsWith(x)).length;if(!f)return;const idf=Math.log(1+(N-df[x]+.5)/(df[x]+.5));sc+=w*idf*f*2.2/(f+1.2*(.25+.75*d.t.length/avg))});
    if(d.c.trb||/Troubleshooting guide$/.test(d.c.src))sc*=1.15;return{c:d.c,sc}}).filter(x=>x.sc>0).sort((x,y)=>y.sc-x.sc).slice(0,3).map(x=>x.c);
}
function hl(text,q){let h=esc(text);toks(q).filter(x=>x.length>2&&!HAN.test(x)).forEach(x=>{const c=x.replace(/[^\p{L}\p{N}\p{M}]/gu,'');if(c)h=h.replace(new RegExp('(?<![\\p{L}\\p{M}])('+c+'[\\p{L}\\p{M}]*)','giu'),'<mark>$1</mark>')});return h}
function mdish(x){const lines=esc(x).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split(/\n+/);let o='',inl=false;lines.forEach(l=>{const m=l.match(/^\s*(?:[-•*]|\d+\.)\s+(.*)/);if(m){if(!inl){o+='<ul>';inl=true}o+='<li>'+m[1]+'</li>'}else{if(inl){o+='</ul>';inl=false}if(l.trim())o+='<p>'+l+'</p>'}});if(inl)o+='</ul>';return o}
const NOTE=()=>`<p class="asknote">${esc(t().note)}</p>`;
async function getKB(slug){if(!KB[slug]){const r=await fetch('/kb/'+slug+'.json');KB[slug]=await r.json()}return KB[slug]}
app.addEventListener('submit',async e=>{const f=e.target.closest('form.ask');if(!f)return;e.preventDefault();
  const q=f.querySelector('input').value.trim(),out=f.querySelector('.askout'),slug=f.dataset.appl;if(!q)return;
  out.innerHTML=`<p>${esc(t().looking)}</p>`;
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),30000);
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({appliance:slug,question:q,lang:LANG}),signal:ctl.signal});clearTimeout(tm);
    if(r.ok){const j=await r.json();if(j.answer){out.innerHTML=`<div class="ans">${mdish(j.answer)}</div>${j.sources&&j.sources.length?`<span class="srcs">${esc(t().from)}: ${esc(j.sources.join(', '))}</span>`:''}${NOTE()}`;return}}
  }catch(err){}
  try{const kb=LANG==='en'||!(B&&B.apps[slug])?await getKB(slug):{chunks:[]};const hits=search(pool(slug,kb),q);
    out.innerHTML=hits.length?`<p>${esc(t().found)}</p>${hits.map(h=>`<div class="hit">${h.title?`<strong>${esc(h.title)}:</strong> `:''}${hl(h.text,q)}<small>${esc(h.src)}</small></div>`).join('')}${NOTE()}`
      :`<p>${esc(t().nothing)}</p>${NOTE()}`;
  }catch(err){out.innerHTML=`<p>${esc(t().unavailable)}</p>`+NOTE()}
});
function tabUrl(a,x){return `#/${a.slug}/${kindOf(a,x)}`}
function phoneView(p){
  const steps=p.steps.map((st,i)=>{
    let out='',list=[];
    const flush=()=>{if(list.length){out+='<ul>'+list.map(x=>`<li>${x}</li>`).join('')+'</ul>';list=[]}};
    st.items.forEach(it=>{ if(it.img){flush();out+=`<figure class="fig"><button type="button" data-zoom="${it.img}" aria-label="${esc(t().enlarge)}"><img src="${it.img}" width="${it.w}" height="${it.h}" loading="lazy" alt="${esc(it.cap)}"></button><figcaption>${esc(it.cap)}</figcaption></figure>`} else list.push(it.html) });
    flush();
    return `<section class="step"><h3><span class="num">${i+1}</span>${esc(st.title)}</h3>${out}</section>`;
  }).join('');
  return `<div class="imp"><b>${esc(t().imp)}</b>${p.important}</div>${steps}
  <div class="gstop"><b>${esc(t().stopBox)}</b>${p.stop}</div>
  <p class="src">${p.footer}</p>`;
}
function guide(a,g){
  const L=AL(a),G=GL(a,g);
  document.title=`${G.label} - ${L.title}`;
  const i=a.guides.indexOf(g),prev=a.guides[i-1],nxt=a.guides[i+1];
  const pages=G.pages.map((p,k)=>`<a class="page" href="${p.src}" target="_blank" rel="noopener"><img src="${p.src}" width="${p.w}" height="${p.h}" loading="lazy" alt="${esc(G.label)}, ${esc(t().page)} ${k+1} ${esc(t().of)} ${G.pages.length}"></a>`).join('');
  const dl=`<a class="dl" href="${G.pdf}" download="${esc(L.title+' - '+G.label)}.pdf"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>${esc(t().dl)} (${G.kb>1024?(G.kb/1024).toFixed(1)+' MB':G.kb+' KB'})</a>`;
  const back=document.documentElement.dir==='rtl'?['&rarr;','&larr;']:['&larr;','&rarr;'];
  app.innerHTML=`<a class="back" href="#/">${back[0]} ${esc(DATA.length>1?t().all:t().back)}</a>
  <h2 class="gtitle">${esc(L.title)}${G.phone?' &middot; '+esc(G.label):''}</h2>${L.sub?`<p class="gsub">${esc(L.sub)}</p>`:''}
  <nav class="tabs">${a.guides.map(x=>`<a class="tab" href="${tabUrl(a,x)}"${x===g?' aria-current="page"':''}>${esc(GL(a,x).label)}</a>`).join('')}</nav>
  ${G.fb&&t().fallback?`<p class="fallback">${esc(t().fallback)}</p>`:''}${G.auto?`<p class="fallback">${esc(t().auto)}</p>`:''}
  ${/-troubleshooting$/.test(g.key)?askBox(a):''}
  ${G.phone?`<p class="swipe">${esc(t().swipe)}</p>${phoneView(G.phone)}
    <div class="next">${prev?`<a href="${tabUrl(a,prev)}">${back[0]} ${esc(GL(a,prev).label)}</a>`:''}${nxt?`<a href="${tabUrl(a,nxt)}">${esc(GL(a,nxt).label)} ${back[1]}</a>`:''}</div>
    ${dl}${pages?`<details class="printed"><summary>${esc(t().printed)}</summary>${pages}</details>`:''}`
  :`${dl}<p class="zoom">${esc(t().zoom)}</p>${pages}
  <div class="stop"><strong>${esc(t().stopT)}</strong>${esc(t().stopB)}</div>`}`;
  app.dataset.prev=prev?tabUrl(a,prev):'';app.dataset.next=nxt?tabUrl(a,nxt):'';
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-zoom]');if(!b)return;
  const lb=document.createElement('div');lb.className='lb';lb.innerHTML=`<button type="button" aria-label="Close">&times;</button><img src="${b.dataset.zoom}" alt="">`;
  lb.addEventListener('click',ev=>{if(ev.target.tagName!=='IMG')lb.remove()});document.body.appendChild(lb);});
let sx=0,sy=0,st=0;
app.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
app.addEventListener('touchend',e=>{if(!sx||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=0;
  if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dx)<2*Math.abs(dy)||window.visualViewport&&visualViewport.scale>1.05)return;
  const fwd=document.documentElement.dir==='rtl'?dx>0:dx<0;const to=fwd?app.dataset.next:app.dataset.prev;if(to)location.hash=to;},{passive:true});
function route(){
  const m=location.hash.match(/^#\/([^/]+)\/([^/]+)/);
  const a=m&&DATA.find(x=>x.slug===m[1]);
  const g=a&&a.guides.find(x=>x.key===a.slug+'-'+m[2]);
  if(g)guide(a,g);else{home();app.dataset.prev=app.dataset.next='';}
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
chrome();
const first=pickLang();
if(first==='en')route();else setLang(first,false);
fetch('/api/translate?ping=1').then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ok&&DATA.length){AUTO_OK=true;chrome()}}).catch(()=>{});
</script>
