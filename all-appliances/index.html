991, "h": 1406}, {"src": "/pages/whirlpool-washer-how-to-use-7.jpg", "w": 991, "h": 1406}], "kb": 414, "phone": null, "tr": null}, {"key": "whirlpool-washer-care", "label": "Appliance Care", "pdf": "/files/whirlpool-washer-care.pdf", "pages": [{"src": "/pages/whirlpool-washer-care-1.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-washer-care-2.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-washer-care-3.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-washer-care-4.jpg", "w": 991, "h": 1406}], "kb": 191, "phone": null, "tr": null}, {"key": "whirlpool-washer-troubleshooting", "label": "Troubleshooting", "pdf": "/files/whirlpool-washer-troubleshooting.pdf", "pages": [{"src": "/pages/whirlpool-washer-troubleshooting-1.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-washer-troubleshooting-2.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-washer-troubleshooting-3.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-washer-troubleshooting-4.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-washer-troubleshooting-5.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-washer-troubleshooting-6.jpg", "w": 991, "h": 1406}], "kb": 207, "phone": null, "tr": null}], "tr": null}, {"slug": "whirlpool-dryer", "title": "Whirlpool dryer", "sub": "Other model (manual W10296184B)", "icon": "dryer", "guides": [{"key": "whirlpool-dryer-how-to-use", "label": "How to Use", "pdf": "/files/whirlpool-dryer-how-to-use.pdf", "pages": [{"src": "/pages/whirlpool-dryer-how-to-use-1.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-dryer-how-to-use-2.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-dryer-how-to-use-3.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-dryer-how-to-use-4.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-dryer-how-to-use-5.jpg", "w": 991, "h": 1406}], "kb": 244, "phone": null, "tr": null}, {"key": "whirlpool-dryer-care", "label": "Appliance Care", "pdf": "/files/whirlpool-dryer-care.pdf", "pages": [{"src": "/pages/whirlpool-dryer-care-1.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-dryer-care-2.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-dryer-care-3.jpg", "w": 991, "h": 1406}], "kb": 173, "phone": null, "tr": null}, {"key": "whirlpool-dryer-troubleshooting", "label": "Troubleshooting", "pdf": "/files/whirlpool-dryer-troubleshooting.pdf", "pages": [{"src": "/pages/whirlpool-dryer-troubleshooting-1.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-dryer-troubleshooting-2.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-dryer-troubleshooting-3.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-dryer-troubleshooting-4.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-dryer-troubleshooting-5.jpg", "w": 991, "h": 1406}], "kb": 158, "phone": null, "tr": null}], "tr": null}, {"slug": "lg-washer", "title": "LG washer", "sub": "Front-load, WM5500 / WM6500 series", "icon": "washer", "guides": [{"key": "lg-washer-how-to-use", "label": "How to Use", "pdf": "/files/lg-washer-how-to-use.pdf", "pages": [{"src": "/pages/lg-washer-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 244, "phone": {"kicker": "WASHER GUIDE", "title": "How to Use the Washer", "model": "LG front-load washer WM5500H*A or WM6500H*A (model to confirm)", "important": "Use only <strong>HE (High-Efficiency)</strong> detergent, and less than half the maximum on the bottle for an average load. Pods, gel and tablets go in the drum, never in the drawer. Never mix chlorine bleach with ammonia or vinegar. Do not touch the door during steam cycles: it gets very hot. Keep children and pets out of the drum.", "stop": "Water leaks or pools under the washer. A message comes back after a restart, or the washer will not fill or drain. A burning smell, smoke, or a loud banging or grinding noise. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual MFL71964314 for LG washers WM5500H*A and WM6500H*A. Pictures are taken from that manual.", "steps": [{"title": "Load", "items": [{"html": "Sort by colour, dirt level and fabric. Wash darks apart from lights."}, {"html": "Empty pockets, close zippers and hooks, tie strings. Small items go in a mesh bag."}, {"html": "Load loosely, large items first. Do not press clothes down: the door must close easily."}, {"html": "Do not wash one small item alone. DO NOT OVERLOAD. Overloading will cause leak."}, {"html": "Waterproof items (rain jackets, mattress covers): use the <strong>Bedding</strong> cycle only."}, {"html": "Check that nothing hangs over the rubber door seal."}]}, {"title": "Detergent", "items": [{"img": "/img/lg-washer-how-to-use/dispenser-p21.png", "w": 744, "h": 1008, "cap": "1 Pre-wash (some models), 2 liquid detergent cup, 3 main wash detergent, 4 fabric softener, 5 liquid chlorine bleach. Manual, page 21."}, {"html": "<strong>HE detergent</strong> goes in the main wash compartment (3). Liquid: keep the liquid detergent cup (2) in place. Powder: take the cup out first."}, {"html": "<strong>Pods, gel or tablets</strong>: one only, in the empty drum before the clothes."}, {"html": "<strong>Fabric softener</strong> (4) and <strong>liquid chlorine bleach</strong> (5): never past the MAX line. Never more than 1 cup of bleach."}, {"html": "Close the drawer gently. A little water left in it after the wash is normal."}, {"html": "Do not keep detergent or bleach on top of the washer."}]}, {"title": "Cycle and settings", "items": [{"img": "/img/lg-washer-how-to-use/control-panel-p23.png", "w": 1598, "h": 383, "cap": "1 Power, 2 cycle knob, 3 Back and \u2713 (OK), 4 display, 5 Start/Pause, 6 Temp., Spin, Soil, 7 options. Manual, page 23."}, {"html": "Press <strong>Power</strong> (1). Turn the knob (2) to a cycle and press <strong>\u2713</strong> (3)."}, {"img": "/img/lg-washer-how-to-use/knob-display-p24.png", "w": 598, "h": 661, "cap": "Screen inside the knob: it shows the cycle and settings. Back and \u2713 (OK) buttons below. Manual, page 24."}, {"html": "<strong>Normal</strong>: cotton, jeans, mixed loads. <strong>AI Wash</strong>: adjusts to the load. <strong>Towels</strong>. <strong>Heavy Duty</strong>. <strong>Bedding</strong>: comforters and waterproof items. <strong>Delicates</strong>. <strong>Quick Wash</strong>: small, lightly soiled loads."}, {"html": "<strong><span class=\"c-red\">Not sure?</span> Choose</strong> <span class=\"c-red\"><strong>Normal</strong></span> for everyday laundry."}, {"html": "Change <strong>Temp.</strong>, <strong>Spin</strong> and <strong>Soil</strong> with the buttons (6). Two chimes and no light means that setting is not allowed for this cycle."}, {"img": "/img/lg-washer-how-to-use/settings-lights-p25.png", "w": 473, "h": 306, "cap": "Temp., Spin and Soil levels light up 1 to 5. Manual, page 25."}, {"html": "<strong>Extra Rinse</strong> (1 to 3 rinses), <strong>Delay Start</strong> (1 to 19 hours), <strong>Fresh Care</strong> (tumbles for up to 19 hours if you cannot unload right away)."}]}, {"title": "Start and finish", "items": [{"html": "Press <strong>Start/Pause</strong> (5). The door locks and the drum turns briefly to weigh the load. Start soon after choosing, or the washer turns off."}, {"html": "Seeing very little water is normal for this washer."}, {"html": "<strong>Pause</strong>: press Start/Pause. <strong>Cancel</strong>: press Power; the door unlocks after a short pause."}, {"html": "Buttons beep but nothing happens? <strong>Control Lock</strong> is on. Press <strong>Options</strong>, turn the knob to Control Lock, press <strong>\u2713</strong>, choose Off, press <strong>\u2713</strong>."}, {"html": "At the end a melody plays. Unload straight away and check the door seal for small items."}, {"html": "Leave the door open so the drum dries."}]}]}, "tr": {"label": "Nas\u0131l Kullan\u0131l\u0131r", "pdf": "/files/lg-washer-how-to-use-tr.pdf", "pages": [{"src": "/pages/lg-washer-how-to-use-tr-1.jpg", "w": 1870, "h": 1445}], "kb": 245, "phone": {"kicker": "\u00c7AMA\u015eIR MAK\u0130NES\u0130 KILAVUZU", "title": "\u00c7ama\u015f\u0131r Makinesi Nas\u0131l Kullan\u0131l\u0131r", "model": "LG \u00f6nden y\u00fcklemeli \u00e7ama\u015f\u0131r makinesi WM5500H*A veya WM6500H*A (model teyit edilecek)", "important": "Sadece <strong>HE (Y\u00fcksek Verimli)</strong> deterjan kullan\u0131n; normal bir y\u00fck i\u00e7in \u015fi\u015fedeki en y\u00fcksek miktar\u0131n yar\u0131s\u0131ndan az\u0131n\u0131 koyun. Kaps\u00fcl, jel ve tabletler hazneye de\u011fil, tamburun i\u00e7ine konur. \u00c7ama\u015f\u0131r suyunu asla amonyak veya sirkeyle kar\u0131\u015ft\u0131rmay\u0131n. Buhar programlar\u0131 s\u0131ras\u0131nda kapa\u011fa dokunmay\u0131n: \u00e7ok \u0131s\u0131n\u0131r. \u00c7ocuklar\u0131 ve evcil hayvanlar\u0131 tamburdan uzak tutun.", "stop": "Su s\u0131z\u0131yor veya makinenin alt\u0131nda su birikiyor. Yeniden ba\u015flatt\u0131ktan sonra bir mesaj tekrar \u00e7\u0131k\u0131yor veya makine su alm\u0131yor ya da bo\u015faltm\u0131yor. Yan\u0131k kokusu, duman veya y\u00fcksek sesli vuruntu ya da s\u00fcrt\u00fcnme sesi. Emin de\u011filseniz ya da sorun devam ederse cihaz\u0131 kullanmay\u0131 b\u0131rak\u0131n ve m\u00fclk y\u00f6netimine ba\u015fvurun.", "footer": "LG WM5500H*A ve WM6500H*A \u00e7ama\u015f\u0131r makineleri i\u00e7in \u00fcretici kullan\u0131m k\u0131lavuzu MFL71964314&#x27;e dayan\u0131r. Resimler o k\u0131lavuzdan al\u0131nm\u0131\u015ft\u0131r.", "steps": [{"title": "Yerle\u015ftirme", "items": [{"html": "Renge, kirlilik derecesine ve kuma\u015fa g\u00f6re ay\u0131r\u0131n. Koyular\u0131 a\u00e7\u0131k renklerden ayr\u0131 y\u0131kay\u0131n."}, {"html": "Cepleri bo\u015falt\u0131n, fermuarlar\u0131 ve kancalar\u0131 kapat\u0131n, ipleri ba\u011flay\u0131n. K\u00fc\u00e7\u00fck e\u015fyalar file torbaya."}, {"html": "Gev\u015fek yerle\u015ftirin, \u00f6nce b\u00fcy\u00fck par\u00e7alar. \u00c7ama\u015f\u0131rlar\u0131 bast\u0131rmay\u0131n: kapak kolayca kapanmal\u0131."}, {"html": "Tek bir k\u00fc\u00e7\u00fck par\u00e7ay\u0131 yaln\u0131z y\u0131kamay\u0131n. A\u015eIRI Y\u00dcKLEMEY\u0130N. A\u015f\u0131r\u0131 y\u00fckleme s\u0131z\u0131nt\u0131ya neden olur."}, {"html": "Su ge\u00e7irmez e\u015fyalar (ya\u011fmurluk, yatak koruyucu): sadece <strong>Bedding</strong> program\u0131n\u0131 kullan\u0131n."}, {"html": "Lastik kapak contas\u0131n\u0131n \u00fczerine hi\u00e7bir \u015feyin sarkmad\u0131\u011f\u0131n\u0131 kontrol edin."}]}, {"title": "Deterjan", "items": [{"img": "/img/lg-washer-how-to-use/dispenser-p21.png", "w": 744, "h": 1008, "cap": "1 \u00d6n y\u0131kama (baz\u0131 modellerde), 2 s\u0131v\u0131 deterjan kab\u0131, 3 ana y\u0131kama deterjan\u0131, 4 yumu\u015fat\u0131c\u0131, 5 s\u0131v\u0131 klorlu \u00e7ama\u015f\u0131r suyu. K\u0131lavuz, sayfa 21."}, {"html": "<strong>HE deterjan</strong> ana y\u0131kama b\u00f6lmesine (3) konur. S\u0131v\u0131: s\u0131v\u0131 deterjan kab\u0131n\u0131 (2) yerinde b\u0131rak\u0131n. Toz: \u00f6nce kab\u0131 \u00e7\u0131kar\u0131n."}, {"html": "<strong>Kaps\u00fcl, jel veya tablet</strong>: sadece bir tane, \u00e7ama\u015f\u0131rlardan \u00f6nce bo\u015f tamburun i\u00e7ine."}, {"html": "<strong>Yumu\u015fat\u0131c\u0131</strong> (4) ve <strong>s\u0131v\u0131 klorlu \u00e7ama\u015f\u0131r suyu</strong> (5): asla MAX \u00e7izgisini ge\u00e7meyin. Asla 1 bardaktan fazla \u00e7ama\u015f\u0131r suyu koymay\u0131n."}, {"html": "\u00c7ekmeceyi yava\u015f\u00e7a kapat\u0131n. Y\u0131kamadan sonra i\u00e7inde biraz su kalmas\u0131 normaldir."}, {"html": "Deterjan\u0131 veya \u00e7ama\u015f\u0131r suyunu makinenin \u00fcst\u00fcnde tutmay\u0131n."}]}, {"title": "Program ve ayarlar", "items": [{"img": "/img/lg-washer-how-to-use/control-panel-p23.png", "w": 1598, "h": 383, "cap": "1 Power, 2 program d\u00fc\u011fmesi, 3 Geri ve \u2713 (OK), 4 ekran, 5 Start/Pause, 6 Temp., Spin, Soil, 7 se\u00e7enekler. K\u0131lavuz, sayfa 23."}, {"html": "<strong>Power</strong>&#x27;a (1) bas\u0131n. D\u00fc\u011fmeyi (2) bir programa \u00e7evirin ve <strong>\u2713</strong>&#x27;e (3) bas\u0131n."}, {"img": "/img/lg-washer-how-to-use/knob-display-p24.png", "w": 598, "h": 661, "cap": "D\u00fc\u011fmenin i\u00e7indeki ekran: program\u0131 ve ayarlar\u0131 g\u00f6sterir. Alt\u0131nda Geri ve \u2713 (OK) d\u00fc\u011fmeleri. K\u0131lavuz, sayfa 24."}, {"html": "<strong>Normal</strong>: pamuklu, kot, kar\u0131\u015f\u0131k y\u00fckler. <strong>AI Wash</strong>: y\u00fcke g\u00f6re ayarlan\u0131r. <strong>Towels</strong>: havlular. <strong>Heavy Duty</strong>: a\u011f\u0131r kirli. <strong>Bedding</strong>: yorgan ve su ge\u00e7irmez e\u015fyalar. <strong>Delicates</strong>: hassaslar. <strong>Quick Wash</strong>: az kirli k\u00fc\u00e7\u00fck y\u00fckler."}, {"html": "<strong><span class=\"c-red\">Emin de\u011fil misiniz?</span></strong> G\u00fcnl\u00fck \u00e7ama\u015f\u0131r i\u00e7in <span class=\"c-red\"><strong>Normal</strong></span>&#x27;i se\u00e7in."}, {"html": "<strong>Temp.</strong> (s\u0131cakl\u0131k), <strong>Spin</strong> (s\u0131kma) ve <strong>Soil</strong> (kirlilik) ayarlar\u0131n\u0131 d\u00fc\u011fmelerle (6) de\u011fi\u015ftirin. \u0130ki bip sesi ve \u0131\u015f\u0131k yanmamas\u0131, o ayar\u0131n bu programda kullan\u0131lamad\u0131\u011f\u0131 anlam\u0131na gelir."}, {"img": "/img/lg-washer-how-to-use/settings-lights-p25.png", "w": 473, "h": 306, "cap": "Temp., Spin ve Soil seviyeleri 1'den 5'e kadar yanar. K\u0131lavuz, sayfa 25."}, {"html": "<strong>Extra Rinse</strong> (1 ila 3 ek durulama), <strong>Delay Start</strong> (1 ila 19 saat gecikmeli ba\u015flatma), <strong>Fresh Care</strong> (hemen bo\u015faltamazsan\u0131z 19 saate kadar \u00e7evirir)."}]}, {"title": "Ba\u015flatma ve biti\u015f", "items": [{"html": "<strong>Start/Pause</strong>&#x27;a (5) bas\u0131n. Kapak kilitlenir ve tambur y\u00fck\u00fc tartmak i\u00e7in k\u0131sa bir s\u00fcre d\u00f6ner. Se\u00e7imden sonra hemen ba\u015flat\u0131n, yoksa makine kapan\u0131r."}, {"html": "\u00c7ok az su g\u00f6rmeniz bu makine i\u00e7in normaldir."}, {"html": "<strong>Duraklatma</strong>: Start/Pause&#x27;a bas\u0131n. <strong>\u0130ptal</strong>: Power&#x27;a bas\u0131n; kapak k\u0131sa bir s\u00fcre sonra a\u00e7\u0131l\u0131r."}, {"html": "D\u00fc\u011fmeler bip sesi \u00e7\u0131kar\u0131yor ama hi\u00e7bir \u015fey olmuyor mu? <strong>Control Lock</strong> (tu\u015f kilidi) a\u00e7\u0131k. <strong>Options</strong>&#x27;a bas\u0131n, d\u00fc\u011fmeyi Control Lock&#x27;a \u00e7evirin, <strong>\u2713</strong>&#x27;e bas\u0131n, Off&#x27;u se\u00e7in, <strong>\u2713</strong>&#x27;e bas\u0131n."}, {"html": "Bitince bir melodi \u00e7alar. \u00c7ama\u015f\u0131rlar\u0131 hemen \u00e7\u0131kar\u0131n ve kapak contas\u0131nda k\u00fc\u00e7\u00fck e\u015fya kal\u0131p kalmad\u0131\u011f\u0131n\u0131 kontrol edin."}, {"html": "Tamburun kurumas\u0131 i\u00e7in kapa\u011f\u0131 a\u00e7\u0131k b\u0131rak\u0131n."}]}]}}}, {"key": "lg-washer-care", "label": "Appliance Care", "pdf": "/files/lg-washer-care.pdf", "pages": [{"src": "/pages/lg-washer-care-1.jpg", "w": 1870, "h": 1445}], "kb": 277, "phone": {"kicker": "WASHER GUIDE", "title": "Washer Care", "model": "LG front-load washer WM5500H*A or WM6500H*A (model to confirm)", "important": "Wear rubber gloves and goggles when cleaning with bleach, and always dilute it. Never mix chlorine bleach with ammonia or vinegar. Do not spray water on or into the washer. No steel wool, abrasive cleaners, alcohol or solvents. Opening the drain filter lets water out: only do it with towels and a shallow pan ready.", "stop": "A water hose behind the washer is leaking, kinked or cracked. A bad smell stays after three weekly Tub Clean cycles. The washer shows <strong>Water supply</strong> with the taps open (the water inlet filters behind it may need cleaning). The room could freeze. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual MFL71964314 for LG washers WM5500H*A and WM6500H*A. Pictures are taken from that manual.", "steps": [{"title": "After every load", "items": [{"html": "Take the laundry out as soon as the cycle ends."}, {"html": "Wipe the door, the door glass and the inside of the rubber seal dry."}, {"html": "Leave the door open, overnight if you can, so the drum dries. This prevents smells. Keep children and pets out."}, {"html": "Wipe spills on the outside straight away with a damp cloth."}]}, {"title": "Monthly drum clean", "items": [{"img": "/img/lg-washer-care/control-panel-p23.png", "w": 1598, "h": 383, "cap": "1 Power, 2 cycle knob, 3 Back and \u2713 (OK), 4 display, 5 Start/Pause, 6 Temp., Spin, Soil, 7 options. Manual, page 23."}, {"html": "Empty drum. Add a washer drum cleaner to the main detergent compartment, or liquid chlorine bleach to the bleach compartment (not past MAX). Cleaning tablets go in the drum."}, {"html": "Press <strong>Power</strong>, turn the knob to <strong>Tub Clean</strong>, press <strong>Start/Pause</strong>."}, {"html": "No Tub Clean on the knob? Press <strong>Options</strong>, choose <strong>Cycle List Edit</strong>, turn to Tub Clean and press <strong>\u2713</strong> to add it."}, {"html": "Afterwards leave the door open to dry. If you used a cleaner or descaler, run <strong>Rinse+Spin</strong> (add it the same way) before the next wash."}, {"html": "Smell already there? Run Tub Clean once a week for 3 weeks."}]}, {"title": "Dispenser drawer (once or twice a month)", "items": [{"img": "/img/lg-washer-care/drawer-release-p41.png", "w": 536, "h": 320, "cap": "Press the release button (1) to take the drawer out. Manual, page 41."}, {"html": "Turn off and unplug the washer. Pull the drawer out until it stops."}, {"html": "Press down hard on the release button (1) and pull the drawer all the way out. Take out the inserts."}, {"html": "Clean them with warm water and a soft cloth or brush. No soap. Dry them."}, {"html": "Brush out the drawer opening with a small non-metal brush, then slide the drawer back in."}]}, {"title": "Door seal (monthly)", "items": [{"html": "Wear rubber gloves and goggles. Mix 3/4 cup (177 mL) of liquid chlorine bleach in 1 gallon (3.8 L) of water. Never use bleach undiluted."}, {"html": "Wipe all around the seal with a sponge or soft cloth, then dry it with a towel."}, {"html": "Leave the door open until the seal is completely dry."}, {"html": "Hard water spots on the drum: a soft cloth with stainless steel cleaner. Then run Tub Clean."}]}, {"title": "Drain filter (if it won't drain)", "items": [{"img": "/img/lg-washer-care/drain-cover-p43.png", "w": 619, "h": 328, "cap": "Open the drain filter cover at the bottom front. Manual, page 43."}, {"html": "Turn off and unplug the washer. Put towels and a shallow pan on the floor."}, {"html": "Open the drain filter cover. Unclip the small drain hose, pull out its plug and let the water run into the pan."}, {"img": "/img/lg-washer-care/drain-water-p43.png", "w": 619, "h": 411, "cap": "Drain the water. Manual, page 43."}, {"html": "Twist the filter counterclockwise to take it out. Remove lint, coins and other objects."}, {"img": "/img/lg-washer-care/drain-filter-p43.png", "w": 661, "h": 431, "cap": "Twist to remove the filter. Manual, page 43."}, {"html": "Put the plug back in the hose and clip it. Twist the filter clockwise until tight. Close the cover."}, {"html": "Still won&#x27;t drain, or water keeps coming out: contact property management."}]}]}, "tr": {"label": "Cihaz Bak\u0131m\u0131", "pdf": "/files/lg-washer-care-tr.pdf", "pages": [{"src": "/pages/lg-washer-care-tr-1.jpg", "w": 1870, "h": 1445}], "kb": 280, "phone": {"kicker": "\u00c7AMA\u015eIR MAK\u0130NES\u0130 KILAVUZU", "title": "\u00c7ama\u015f\u0131r Makinesi Bak\u0131m\u0131", "model": "LG \u00f6nden y\u00fcklemeli \u00e7ama\u015f\u0131r makinesi WM5500H*A veya WM6500H*A (model teyit edilecek)", "important": "\u00c7ama\u015f\u0131r suyuyla temizlerken lastik eldiven ve g\u00f6zl\u00fck tak\u0131n ve \u00e7ama\u015f\u0131r suyunu her zaman suland\u0131r\u0131n. \u00c7ama\u015f\u0131r suyunu asla amonyak veya sirkeyle kar\u0131\u015ft\u0131rmay\u0131n. Makinenin \u00fczerine veya i\u00e7ine su p\u00fcsk\u00fcrtmeyin. \u00c7elik y\u00fcn, a\u015f\u0131nd\u0131r\u0131c\u0131 temizleyici, alkol veya solvent kullanmay\u0131n. Pompa filtresini a\u00e7\u0131nca su gelir: sadece havlular ve s\u0131\u011f bir kap haz\u0131rken a\u00e7\u0131n.", "stop": "Makinenin arkas\u0131ndaki bir su hortumu s\u0131zd\u0131r\u0131yor, b\u00fck\u00fclm\u00fc\u015f veya \u00e7atlam\u0131\u015f. \u00dc\u00e7 hafta haftada bir Tub Clean&#x27;den sonra k\u00f6t\u00fc koku devam ediyor. Musluklar a\u00e7\u0131kken makine <strong>Water supply</strong> g\u00f6steriyor (arkadaki su giri\u015f filtrelerinin temizlenmesi gerekebilir). Oda donabilir. Emin de\u011filseniz ya da sorun devam ederse cihaz\u0131 kullanmay\u0131 b\u0131rak\u0131n ve m\u00fclk y\u00f6netimine ba\u015fvurun.", "footer": "LG WM5500H*A ve WM6500H*A \u00e7ama\u015f\u0131r makineleri i\u00e7in \u00fcretici kullan\u0131m k\u0131lavuzu MFL71964314&#x27;e dayan\u0131r. Resimler o k\u0131lavuzdan al\u0131nm\u0131\u015ft\u0131r.", "steps": [{"title": "Her y\u0131kamadan sonra", "items": [{"html": "Program biter bitmez \u00e7ama\u015f\u0131rlar\u0131 \u00e7\u0131kar\u0131n."}, {"html": "Kapa\u011f\u0131, kapak cam\u0131n\u0131 ve lastik contan\u0131n i\u00e7ini kurulay\u0131n."}, {"html": "Tambur kurusun diye kapa\u011f\u0131 a\u00e7\u0131k b\u0131rak\u0131n, m\u00fcmk\u00fcnse gece boyunca. Bu kokuyu \u00f6nler. \u00c7ocuklar\u0131 ve evcil hayvanlar\u0131 uzak tutun."}, {"html": "D\u0131\u015f y\u00fczeydeki d\u00f6k\u00fclenleri hemen nemli bir bezle silin."}]}, {"title": "Ayl\u0131k tambur temizli\u011fi", "items": [{"img": "/img/lg-washer-care/control-panel-p23.png", "w": 1598, "h": 383, "cap": "1 Power, 2 program d\u00fc\u011fmesi, 3 Geri ve \u2713 (OK), 4 ekran, 5 Start/Pause, 6 Temp., Spin, Soil, 7 se\u00e7enekler. K\u0131lavuz, sayfa 23."}, {"html": "Tambur bo\u015f olsun. Ana deterjan b\u00f6lmesine tambur temizleyici veya \u00e7ama\u015f\u0131r suyu b\u00f6lmesine s\u0131v\u0131 klorlu \u00e7ama\u015f\u0131r suyu koyun (MAX&#x27;\u0131 ge\u00e7meyin). Temizleme tabletleri tamburun i\u00e7ine konur."}, {"html": "<strong>Power</strong>&#x27;a bas\u0131n, d\u00fc\u011fmeyi <strong>Tub Clean</strong>&#x27;e \u00e7evirin, <strong>Start/Pause</strong>&#x27;a bas\u0131n."}, {"html": "D\u00fc\u011fmede Tub Clean yok mu? <strong>Options</strong>&#x27;a bas\u0131n, <strong>Cycle List Edit</strong>&#x27;i se\u00e7in, Tub Clean&#x27;e \u00e7evirin ve eklemek i\u00e7in <strong>\u2713</strong>&#x27;e bas\u0131n."}, {"html": "Sonra kurusun diye kapa\u011f\u0131 a\u00e7\u0131k b\u0131rak\u0131n. Temizleyici veya kire\u00e7 \u00e7\u00f6z\u00fcc\u00fc kulland\u0131ysan\u0131z bir sonraki y\u0131kamadan \u00f6nce <strong>Rinse+Spin</strong> \u00e7al\u0131\u015ft\u0131r\u0131n (ayn\u0131 \u015fekilde ekleyin)."}, {"html": "Koku zaten var m\u0131? Tub Clean&#x27;i 3 hafta boyunca haftada bir \u00e7al\u0131\u015ft\u0131r\u0131n."}]}, {"title": "Deterjan \u00e7ekmecesi (ayda bir veya iki kez)", "items": [{"img": "/img/lg-washer-care/drawer-release-p41.png", "w": 536, "h": 320, "cap": "\u00c7ekmeceyi \u00e7\u0131karmak i\u00e7in \u00e7\u0131karma d\u00fc\u011fmesine (1) bas\u0131n. K\u0131lavuz, sayfa 41."}, {"html": "Makineyi kapat\u0131n ve fi\u015fini \u00e7ekin. \u00c7ekmeceyi durana kadar \u00e7ekin."}, {"html": "\u00c7\u0131karma d\u00fc\u011fmesine (1) sert\u00e7e bast\u0131r\u0131n ve \u00e7ekmeceyi tamamen \u00e7ekip \u00e7\u0131kar\u0131n. \u0130\u00e7 par\u00e7alar\u0131 \u00e7\u0131kar\u0131n."}, {"html": "Il\u0131k su ve yumu\u015fak bir bez veya f\u0131r\u00e7ayla temizleyin. Sabun kullanmay\u0131n. Kurulay\u0131n."}, {"html": "\u00c7ekmece yuvas\u0131n\u0131 k\u00fc\u00e7\u00fck, metal olmayan bir f\u0131r\u00e7ayla temizleyin, sonra \u00e7ekmeceyi geri itin."}]}, {"title": "Kapak contas\u0131 (ayl\u0131k)", "items": [{"html": "Lastik eldiven ve g\u00f6zl\u00fck tak\u0131n. 3/4 bardak (177 mL) s\u0131v\u0131 klorlu \u00e7ama\u015f\u0131r suyunu 1 galon (3,8 L) suyla kar\u0131\u015ft\u0131r\u0131n. \u00c7ama\u015f\u0131r suyunu asla suland\u0131rmadan kullanmay\u0131n."}, {"html": "Contan\u0131n her yerini s\u00fcnger veya yumu\u015fak bezle silin, sonra havluyla kurulay\u0131n."}, {"html": "Conta tamamen kuruyana kadar kapa\u011f\u0131 a\u00e7\u0131k b\u0131rak\u0131n."}, {"html": "Tamburda kire\u00e7 lekeleri: paslanmaz \u00e7elik temizleyicili yumu\u015fak bir bez. Sonra Tub Clean \u00e7al\u0131\u015ft\u0131r\u0131n."}]}, {"title": "Pompa filtresi (su bo\u015faltm\u0131yorsa)", "items": [{"img": "/img/lg-washer-care/drain-cover-p43.png", "w": 619, "h": 328, "cap": "Alt \u00f6ndeki pompa filtresi kapa\u011f\u0131n\u0131 a\u00e7\u0131n. K\u0131lavuz, sayfa 43."}, {"html": "Makineyi kapat\u0131n ve fi\u015fini \u00e7ekin. Yere havlular ve s\u0131\u011f bir kap koyun."}, {"html": "Pompa filtresi kapa\u011f\u0131n\u0131 a\u00e7\u0131n. K\u00fc\u00e7\u00fck bo\u015faltma hortumunu klipsinden \u00e7\u0131kar\u0131n, t\u0131pas\u0131n\u0131 \u00e7ekin ve suyun kaba akmas\u0131n\u0131 bekleyin."}, {"img": "/img/lg-washer-care/drain-water-p43.png", "w": 619, "h": 411, "cap": "Suyu bo\u015falt\u0131n. K\u0131lavuz, sayfa 43."}, {"html": "Filtreyi saat y\u00f6n\u00fcn\u00fcn tersine \u00e7evirerek \u00e7\u0131kar\u0131n. T\u00fcy, bozuk para ve di\u011fer cisimleri temizleyin."}, {"img": "/img/lg-washer-care/drain-filter-p43.png", "w": 661, "h": 431, "cap": "Filtreyi \u00e7evirerek \u00e7\u0131kar\u0131n. K\u0131lavuz, sayfa 43."}, {"html": "T\u0131pay\u0131 hortuma geri tak\u0131n ve klipsleyin. Filtreyi saat y\u00f6n\u00fcnde s\u0131k\u0131ca \u00e7evirin. Kapa\u011f\u0131 kapat\u0131n."}, {"html": "H\u00e2l\u00e2 bo\u015faltm\u0131yor veya su gelmeye devam ediyor: m\u00fclk y\u00f6netimine ba\u015fvurun."}]}]}}}, {"key": "lg-washer-troubleshooting", "label": "Troubleshooting", "pdf": "/files/lg-washer-troubleshooting.pdf", "pages": [{"src": "/pages/lg-washer-troubleshooting-1.jpg", "w": 1870, "h": 1445}], "kb": 43, "phone": {"kicker": "WASHER GUIDE", "title": "Washer Troubleshooting", "model": "LG front-load washer WM5500H*A or WM6500H*A (model to confirm)", "important": "Water leaking, or the message <strong>Water too high</strong>: stop using the washer, turn off its water taps if you know where they are, and contact property management right away.", "stop": "Water leaks. <strong>Water too high</strong>, <strong>No water detected</strong>, <strong>Vibration sensor</strong>, <strong>Steam error</strong>, <strong>No temp detected</strong> or <strong>Voltage abnormality</strong>. <strong>Motor error</strong> after waiting 30 minutes. A message comes back after a restart. A burning smell or smoke. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual MFL71964314 for LG washers WM5500H*A and WM6500H*A. Pictures are taken from that manual.", "steps": [{"title": "Won't start", "items": [{"html": "Press <strong>Power</strong>, choose a cycle, close the door fully, then press <strong>Start/Pause</strong>. If you wait too long after choosing, the washer turns off."}, {"html": "Buttons beep but nothing happens? <strong>Control Lock</strong> is on. Press <strong>Options</strong>, turn the knob to Control Lock, press <strong>\u2713</strong>, choose Off, press <strong>\u2713</strong>."}, {"html": "<strong>Door open</strong> or <strong>Door unlocked</strong>: open and close the door. Check nothing is caught in the seal."}, {"html": "Display stays dark: the breaker may be off. A washer left in the cold must warm up first."}, {"html": "<strong>Power failure</strong>: press <strong>Start/Pause</strong> to restart."}]}, {"title": "Messages", "items": [{"html": "<strong>Water supply</strong>: the water taps may not be fully open, or a hose is kinked. Contact property management."}, {"html": "<strong>Unbalance</strong>: load too small or tangled. Pause, spread the clothes out, or add a few similar items."}, {"html": "<strong>Oversudsing</strong>: too much detergent. The washer removes suds for about 2 hours. Use less HE detergent next time."}, {"html": "<strong>Motor error</strong>: wait 30 minutes and restart."}, {"html": "<strong>Drainage</strong>: clean the drain filter (see Appliance Care), or contact property management."}, {"html": "<strong>Freeze error</strong>: contact property management."}]}, {"title": "Noises, smells, time", "items": [{"html": "Clicking, hissing, humming, sloshing: normal."}, {"html": "Rattling: coins or keys. Check the drum and the drain filter (see Appliance Care)."}, {"html": "Thumping or shaking: pause and spread the load out."}, {"html": "Stops for a few minutes, then restarts: motor protection, normal. Time left is only an estimate."}, {"html": "Musty smell: run <strong>Tub Clean</strong>, clean the door seal and drain filter, leave the door open, use less HE detergent."}, {"html": "Detergent left in the drawer: close it fully before starting, and do not overfill."}]}]}, "tr": {"label": "Sorun Giderme", "pdf": "/files/lg-washer-troubleshooting-tr.pdf", "pages": [{"src": "/pages/lg-washer-troubleshooting-tr-1.jpg", "w": 1870, "h": 1445}], "kb": 45, "phone": {"kicker": "\u00c7AMA\u015eIR MAK\u0130NES\u0130 KILAVUZU", "title": "\u00c7ama\u015f\u0131r Makinesi Sorun Giderme", "model": "LG \u00f6nden y\u00fcklemeli \u00e7ama\u015f\u0131r makinesi WM5500H*A veya WM6500H*A (model teyit edilecek)", "important": "Su s\u0131z\u0131yor veya <strong>Water too high</strong> mesaj\u0131: makineyi kullanmay\u0131 b\u0131rak\u0131n, yerini biliyorsan\u0131z su musluklar\u0131n\u0131 kapat\u0131n ve hemen m\u00fclk y\u00f6netimine ba\u015fvurun.", "stop": "Su s\u0131z\u0131yor. <strong>Water too high</strong>, <strong>No water detected</strong>, <strong>Vibration sensor</strong>, <strong>Steam error</strong>, <strong>No temp detected</strong> veya <strong>Voltage abnormality</strong>. 30 dakika bekledikten sonra <strong>Motor error</strong>. Yeniden ba\u015flatt\u0131ktan sonra bir mesaj tekrar \u00e7\u0131k\u0131yor. Yan\u0131k kokusu veya duman. Emin de\u011filseniz ya da sorun devam ederse cihaz\u0131 kullanmay\u0131 b\u0131rak\u0131n ve m\u00fclk y\u00f6netimine ba\u015fvurun.", "footer": "LG WM5500H*A ve WM6500H*A \u00e7ama\u015f\u0131r makineleri i\u00e7in \u00fcretici kullan\u0131m k\u0131lavuzu MFL71964314&#x27;e dayan\u0131r. Resimler o k\u0131lavuzdan al\u0131nm\u0131\u015ft\u0131r.", "steps": [{"title": "\u00c7al\u0131\u015fm\u0131yor", "items": [{"html": "<strong>Power</strong>&#x27;a bas\u0131n, bir program se\u00e7in, kapa\u011f\u0131 tamamen kapat\u0131n, sonra <strong>Start/Pause</strong>&#x27;a bas\u0131n. Se\u00e7tikten sonra \u00e7ok beklerseniz makine kapan\u0131r."}, {"html": "D\u00fc\u011fmeler bip sesi \u00e7\u0131kar\u0131yor ama hi\u00e7bir \u015fey olmuyor mu? <strong>Control Lock</strong> (tu\u015f kilidi) a\u00e7\u0131k. <strong>Options</strong>&#x27;a bas\u0131n, d\u00fc\u011fmeyi Control Lock&#x27;a \u00e7evirin, <strong>\u2713</strong>&#x27;e bas\u0131n, Off&#x27;u se\u00e7in, <strong>\u2713</strong>&#x27;e bas\u0131n."}, {"html": "<strong>Door open</strong> veya <strong>Door unlocked</strong>: kapa\u011f\u0131 a\u00e7\u0131p kapat\u0131n. Contaya bir \u015fey s\u0131k\u0131\u015fmad\u0131\u011f\u0131n\u0131 kontrol edin."}, {"html": "Ekran kapal\u0131 kal\u0131yor: sigorta kapal\u0131 olabilir. So\u011fukta kalm\u0131\u015f bir makinenin \u00f6nce \u0131s\u0131nmas\u0131 gerekir."}, {"html": "<strong>Power failure</strong> (elektrik kesintisi): yeniden ba\u015flatmak i\u00e7in <strong>Start/Pause</strong>&#x27;a bas\u0131n."}]}, {"title": "Ekrandaki mesajlar", "items": [{"html": "<strong>Water supply</strong>: su musluklar\u0131 tam a\u00e7\u0131k olmayabilir veya bir hortum b\u00fck\u00fclm\u00fc\u015f olabilir. M\u00fclk y\u00f6netimine ba\u015fvurun."}, {"html": "<strong>Unbalance</strong> (dengesiz y\u00fck): y\u00fck \u00e7ok k\u00fc\u00e7\u00fck veya dola\u015fm\u0131\u015f. Duraklat\u0131n, \u00e7ama\u015f\u0131rlar\u0131 yay\u0131n veya birka\u00e7 benzer par\u00e7a ekleyin."}, {"html": "<strong>Oversudsing</strong> (fazla k\u00f6p\u00fck): \u00e7ok fazla deterjan. Makine yakla\u015f\u0131k 2 saat k\u00f6p\u00fc\u011f\u00fc giderir. Bir dahaki sefere daha az HE deterjan kullan\u0131n."}, {"html": "<strong>Motor error</strong>: 30 dakika bekleyin ve yeniden ba\u015flat\u0131n."}, {"html": "<strong>Drainage</strong> (bo\u015faltma): pompa filtresini temizleyin (Cihaz Bak\u0131m\u0131&#x27;na bak\u0131n) veya m\u00fclk y\u00f6netimine ba\u015fvurun."}, {"html": "<strong>Freeze error</strong> (donma): m\u00fclk y\u00f6netimine ba\u015fvurun."}]}, {"title": "Sesler, kokular, s\u00fcre", "items": [{"html": "T\u0131klama, t\u0131slama, u\u011fultu, \u00e7alkalanma sesleri: normal."}, {"html": "Tak\u0131rt\u0131: bozuk para veya anahtar. Tamburu ve pompa filtresini kontrol edin (Cihaz Bak\u0131m\u0131&#x27;na bak\u0131n)."}, {"html": "Vuruntu veya sallanma: duraklat\u0131n ve y\u00fck\u00fc yay\u0131n."}, {"html": "Birka\u00e7 dakika durup yeniden ba\u015fl\u0131yor: motor korumas\u0131, normal. Kalan s\u00fcre sadece tahminidir."}, {"html": "K\u00fcf kokusu: <strong>Tub Clean</strong> \u00e7al\u0131\u015ft\u0131r\u0131n, kapak contas\u0131n\u0131 ve pompa filtresini temizleyin, kapa\u011f\u0131 a\u00e7\u0131k b\u0131rak\u0131n, daha az HE deterjan kullan\u0131n."}, {"html": "\u00c7ekmecede deterjan kal\u0131yor: ba\u015flatmadan \u00f6nce tamamen kapat\u0131n ve fazla doldurmay\u0131n."}]}]}}}], "tr": {"title": "LG \u00e7ama\u015f\u0131r makinesi", "sub": "\u00d6nden y\u00fcklemeli, WM5500 / WM6500 serisi"}}, {"slug": "lg-dryer", "title": "LG dryer", "sub": "DLEX550 / 650 / 670 series", "icon": "dryer", "guides": [{"key": "lg-dryer-how-to-use", "label": "How to Use", "pdf": "/files/lg-dryer-how-to-use.pdf", "pages": [{"src": "/pages/lg-dryer-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 198, "phone": {"kicker": "DRYER GUIDE", "title": "How to Use the Dryer", "model": "LG dryer, DL*X550, DL*X650 or DL*X670 series (model to confirm)", "important": "Clean the lint filter before every load, and never run the dryer without it. Never dry anything with gasoline, cleaning solvents or cooking oil on it, or anything with foam rubber, rubber or plastic. Do not touch the door or reach in during steam cycles. Keep children and pets out of the drum.", "stop": "A burning smell or smoke (a light smell on the very first use is normal). The <strong>Duct blockage</strong> message, or clothes take much longer than usual to dry. The dryer does not heat. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual MFL71996102 for LG dryers DL*X550, DL*X650 and DL*X670. Pictures are taken from that manual.", "steps": [{"title": "Clean the filter, then load", "items": [{"img": "/img/lg-dryer-how-to-use/lint-filter-p49.png", "w": 744, "h": 501, "cap": "Lint filter (1): pull it straight up. Manual, page 49."}, {"html": "Pull the lint filter (1) straight up, roll the lint off with your fingers, and push it back until it clicks."}, {"html": "Load loosely: clothes grow as they dry. Push everything fully inside, away from the door seal."}, {"html": "Tie strings and belts. Items with zippers or hooks go in a mesh bag."}, {"html": "Dry heavy items apart from light ones, and follow the care labels."}, {"html": "Never dry bath mats, rubber, plastic or fibreglass items."}]}, {"title": "Choose a cycle", "items": [{"img": "/img/lg-dryer-how-to-use/control-panel-p33.png", "w": 1598, "h": 411, "cap": "1 Power, 2 cycle knob, 3 Back and \u2713 (OK), 4 display, 5 Start/Pause, 6 Temp., Dry Level, Dry Time, 7 options. Manual, page 33."}, {"html": "Press <strong>Power</strong> (1). Turn the knob (2) to a cycle."}, {"html": "<strong>Normal</strong>: cotton, jeans, mixed loads. <strong>AI Dry</strong>: adjusts to the load. <strong>Bedding</strong>: comforters, pillows. <strong>Delicates</strong>: blouses, lingerie."}, {"html": "<strong><span class=\"c-red\">Not sure?</span> Choose</strong> <span class=\"c-red\"><strong>Normal</strong></span> for everyday laundry."}, {"html": "Change <strong>Temp.</strong>, <strong>Dry Level</strong> and <strong>Dry Time</strong> with the buttons (6)."}, {"html": "<strong>Energy Saver</strong> is on by default in Normal: the cycle starts with no heat, which is normal. <strong>Wrinkle Care</strong> tumbles the clothes for up to 3 hours after the cycle."}]}, {"title": "Start and finish", "items": [{"html": "Press <strong>Start/Pause</strong> (5). Start soon after choosing, or the dryer turns off and the settings are lost."}, {"html": "To pause, open the door or press <strong>Start/Pause</strong>."}, {"html": "Buttons beep but nothing happens? <strong>Control Lock</strong> is on. Press <strong>Options</strong>, turn the knob to Control Lock, press <strong>\u2713</strong>, choose Off, press <strong>\u2713</strong>."}, {"html": "A chime sounds at the end. Unload straight away to avoid wrinkles. With Wrinkle Care on, the dryer turns by itself every few minutes: normal. Turn the dryer off before unloading."}]}, {"title": "Tips for good drying", "items": [{"html": "Very small load: add a few items so the dryer can sense when it is dry."}, {"html": "One bulky comforter: pause once or twice and unroll it so the middle dries."}, {"html": "Wool: follow the label. If still damp, do not repeat the cycle: lay it flat to finish."}, {"html": "<strong>Steam</strong> options: not for wool, silk or delicate fabrics. Water drips and a drum that stops during steam are normal."}]}]}, "tr": {"label": "Nas\u0131l Kullan\u0131l\u0131r", "pdf": "/files/lg-dryer-how-to-use-tr.pdf", "pages": [{"src": "/pages/lg-dryer-how-to-use-tr-1.jpg", "w": 1870, "h": 1445}], "kb": 200, "phone": {"kicker": "KURUTMA MAK\u0130NES\u0130 KILAVUZU", "title": "Kurutma Makinesi Nas\u0131l Kullan\u0131l\u0131r", "model": "LG kurutma makinesi, DL*X550, DL*X650 veya DL*X670 serisi (model teyit edilecek)", "important": "Her y\u00fckten \u00f6nce t\u00fcy filtresini temizleyin ve makineyi asla filtresiz \u00e7al\u0131\u015ft\u0131rmay\u0131n. \u00dczerinde benzin, temizlik solventi veya yemek ya\u011f\u0131 olan hi\u00e7bir \u015feyi, ya da s\u00fcnger kau\u00e7uk, kau\u00e7uk veya plastik i\u00e7eren hi\u00e7bir \u015feyi kurutmay\u0131n. Buhar programlar\u0131 s\u0131ras\u0131nda kapa\u011fa dokunmay\u0131n ve i\u00e7ine uzanmay\u0131n. \u00c7ocuklar\u0131 ve evcil hayvanlar\u0131 tamburdan uzak tutun.", "stop": "Yan\u0131k kokusu veya duman (ilk kullan\u0131mda hafif bir koku normaldir). <strong>Duct blockage</strong> mesaj\u0131 veya \u00e7ama\u015f\u0131rlar\u0131n her zamankinden \u00e7ok daha uzun s\u00fcrede kurumas\u0131. Makine \u0131s\u0131tm\u0131yor. Emin de\u011filseniz ya da sorun devam ederse cihaz\u0131 kullanmay\u0131 b\u0131rak\u0131n ve m\u00fclk y\u00f6netimine ba\u015fvurun.", "footer": "LG DL*X550, DL*X650 ve DL*X670 kurutma makineleri i\u00e7in \u00fcretici kullan\u0131m k\u0131lavuzu MFL71996102&#x27;ye dayan\u0131r. Resimler o k\u0131lavuzdan al\u0131nm\u0131\u015ft\u0131r.", "steps": [{"title": "Filtreyi temizleyin, sonra y\u00fckleyin", "items": [{"img": "/img/lg-dryer-how-to-use/lint-filter-p49.png", "w": 744, "h": 501, "cap": "T\u00fcy filtresi (1): d\u00fcmd\u00fcz yukar\u0131 \u00e7ekin. K\u0131lavuz, sayfa 49."}, {"html": "T\u00fcy filtresini (1) d\u00fcmd\u00fcz yukar\u0131 \u00e7ekin, t\u00fcyleri parmaklar\u0131n\u0131zla yuvarlayarak al\u0131n ve t\u0131k sesi gelene kadar geri itin."}, {"html": "Gev\u015fek y\u00fckleyin: \u00e7ama\u015f\u0131rlar kuruduk\u00e7a kabar\u0131r. Her \u015feyi tamamen i\u00e7eri, kapak contas\u0131ndan uza\u011fa itin."}, {"html": "\u0130pleri ve kemerleri ba\u011flay\u0131n. Fermuarl\u0131 veya kancal\u0131 e\u015fyalar file torbaya."}, {"html": "A\u011f\u0131r par\u00e7alar\u0131 hafiflerden ayr\u0131 kurutun ve bak\u0131m etiketlerine uyun."}, {"html": "Banyo paspas\u0131, kau\u00e7uk, plastik veya cam elyaf\u0131 e\u015fyalar\u0131 asla kurutmay\u0131n."}]}, {"title": "Program se\u00e7in", "items": [{"img": "/img/lg-dryer-how-to-use/control-panel-p33.png", "w": 1598, "h": 411, "cap": "1 Power, 2 program d\u00fc\u011fmesi, 3 Geri ve \u2713 (OK), 4 ekran, 5 Start/Pause, 6 Temp., Dry Level, Dry Time, 7 se\u00e7enekler. K\u0131lavuz, sayfa 33."}, {"html": "<strong>Power</strong>&#x27;a (1) bas\u0131n. D\u00fc\u011fmeyi (2) bir programa \u00e7evirin."}, {"html": "<strong>Normal</strong>: pamuklu, kot, kar\u0131\u015f\u0131k y\u00fckler. <strong>AI Dry</strong>: y\u00fcke g\u00f6re ayarlan\u0131r. <strong>Bedding</strong>: yorgan, yast\u0131k. <strong>Delicates</strong>: bluz, i\u00e7 \u00e7ama\u015f\u0131r\u0131."}, {"html": "<strong><span class=\"c-red\">Emin de\u011fil misiniz?</span></strong> G\u00fcnl\u00fck \u00e7ama\u015f\u0131r i\u00e7in <span class=\"c-red\"><strong>Normal</strong></span>&#x27;i se\u00e7in."}, {"html": "<strong>Temp.</strong> (s\u0131cakl\u0131k), <strong>Dry Level</strong> (kuruluk) ve <strong>Dry Time</strong> (s\u00fcre) ayarlar\u0131n\u0131 d\u00fc\u011fmelerle (6) de\u011fi\u015ftirin."}, {"html": "<strong>Energy Saver</strong> Normal programda varsay\u0131lan olarak a\u00e7\u0131kt\u0131r: program \u0131s\u0131s\u0131z ba\u015flar, bu normaldir. <strong>Wrinkle Care</strong> programdan sonra 3 saate kadar \u00e7ama\u015f\u0131rlar\u0131 \u00e7evirir."}]}, {"title": "Ba\u015flatma ve biti\u015f", "items": [{"html": "<strong>Start/Pause</strong>&#x27;a (5) bas\u0131n. Se\u00e7tikten sonra hemen ba\u015flat\u0131n, yoksa makine kapan\u0131r ve ayarlar silinir."}, {"html": "Duraklatmak i\u00e7in kapa\u011f\u0131 a\u00e7\u0131n veya <strong>Start/Pause</strong>&#x27;a bas\u0131n."}, {"html": "D\u00fc\u011fmeler bip sesi \u00e7\u0131kar\u0131yor ama hi\u00e7bir \u015fey olmuyor mu? <strong>Control Lock</strong> (tu\u015f kilidi) a\u00e7\u0131k. <strong>Options</strong>&#x27;a bas\u0131n, d\u00fc\u011fmeyi Control Lock&#x27;a \u00e7evirin, <strong>\u2713</strong>&#x27;e bas\u0131n, Off&#x27;u se\u00e7in, <strong>\u2713</strong>&#x27;e bas\u0131n."}, {"html": "Bitince bir sinyal sesi gelir. K\u0131r\u0131\u015fmas\u0131n diye hemen bo\u015falt\u0131n. Wrinkle Care a\u00e7\u0131ksa makine birka\u00e7 dakikada bir kendi kendine d\u00f6ner: normal. Bo\u015faltmadan \u00f6nce makineyi kapat\u0131n."}]}, {"title": "\u0130yi kurutma i\u00e7in ipu\u00e7lar\u0131", "items": [{"html": "\u00c7ok k\u00fc\u00e7\u00fck y\u00fck: makinenin kurulu\u011fu alg\u0131layabilmesi i\u00e7in birka\u00e7 par\u00e7a ekleyin."}, {"html": "Tek bir kal\u0131n yorgan: bir veya iki kez duraklat\u0131n ve ortas\u0131 kurusun diye a\u00e7\u0131n."}, {"html": "Y\u00fcn: etikete uyun. H\u00e2l\u00e2 nemliyse program\u0131 tekrarlamay\u0131n: kurumas\u0131 i\u00e7in d\u00fcz bir yere serin."}, {"html": "<strong>Steam</strong> (buhar) se\u00e7enekleri: y\u00fcn, ipek veya hassas kuma\u015flar i\u00e7in de\u011fil. Buhar s\u0131ras\u0131nda su damlamas\u0131 ve tamburun durmas\u0131 normaldir."}]}]}}}, {"key": "lg-dryer-care", "label": "Appliance Care", "pdf": "/files/lg-dryer-care.pdf", "pages": [{"src": "/pages/lg-dryer-care-1.jpg", "w": 1870, "h": 1445}], "kb": 246, "phone": {"kicker": "DRYER GUIDE", "title": "Dryer Care", "model": "LG dryer, DL*X550, DL*X650 or DL*X670 series (model to confirm)", "important": "Turn off and unplug the dryer before cleaning it. Never use harsh chemicals, solvents, steel wool or abrasive cleaners. Never run the dryer without the lint filter in place.", "stop": "Lint builds up behind the dryer or around the outside vent, the <strong>Duct blockage</strong> message shows, or the Flow Sense indicator shows 4 bars: the vent duct needs cleaning (the manual says check it monthly and clean it at least once a year). A burning smell. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual MFL71996102 for LG dryers DL*X550, DL*X650 and DL*X670. Pictures are taken from that manual.", "steps": [{"title": "Lint filter, every load", "items": [{"img": "/img/lg-dryer-care/lint-filter-p49.png", "w": 744, "h": 501, "cap": "Lint filter (1). Manual, page 49."}, {"html": "Before every load, open the door and pull the filter straight up."}, {"img": "/img/lg-dryer-care/lint-roll-p49.png", "w": 723, "h": 279, "cap": "Roll the lint off with your fingers. Manual, page 49."}, {"html": "Roll the lint off with your fingers, or vacuum it."}, {"html": "Push it back in firmly until it clicks."}]}, {"title": "Wash the filter when needed", "items": [{"img": "/img/lg-dryer-care/lint-wash-p50.png", "w": 682, "h": 411, "cap": "Wash a clogged filter in warm, soapy water. Manual, page 50."}, {"html": "Hold the clean filter up to a light. If it looks dirty or clogged with fabric softener, wash it in warm, soapy water."}, {"html": "Let it dry completely before putting it back."}, {"html": "Very linty loads, like new towels: pause the cycle and clean the filter halfway."}]}, {"title": "Inside and outside", "items": [{"html": "Outside: warm water with a mild, non-abrasive detergent. Wipe spills straight away."}, {"html": "Door opening and seal: wipe with a soft damp cloth to remove lint and dust."}, {"html": "Door window: a soft cloth with warm soapy water, then wipe dry."}, {"html": "Drum: a stainless steel cleaner, following its label."}]}, {"title": "Around the dryer", "items": [{"html": "Vacuum lint and dust from around and under the dryer regularly."}, {"html": "If drying gets slower or air seems weak, tell property management: the vent duct may be blocked."}, {"html": "Do not keep anything flammable on or near the dryer."}]}]}, "tr": {"label": "Cihaz Bak\u0131m\u0131", "pdf": "/files/lg-dryer-care-tr.pdf", "pages": [{"src": "/pages/lg-dryer-care-tr-1.jpg", "w": 1870, "h": 1445}], "kb": 247, "phone": {"kicker": "KURUTMA MAK\u0130NES\u0130 KILAVUZU", "title": "Kurutma Makinesi Bak\u0131m\u0131", "model": "LG kurutma makinesi, DL*X550, DL*X650 veya DL*X670 serisi (model teyit edilecek)", "important": "Temizlemeden \u00f6nce makineyi kapat\u0131n ve fi\u015fini \u00e7ekin. Asla sert kimyasal, solvent, \u00e7elik y\u00fcn veya a\u015f\u0131nd\u0131r\u0131c\u0131 temizleyici kullanmay\u0131n. Makineyi asla t\u00fcy filtresi tak\u0131l\u0131 de\u011filken \u00e7al\u0131\u015ft\u0131rmay\u0131n.", "stop": "Makinenin arkas\u0131nda veya d\u0131\u015f havaland\u0131rma a\u011fz\u0131nda t\u00fcy birikiyor, <strong>Duct blockage</strong> mesaj\u0131 \u00e7\u0131k\u0131yor veya Flow Sense g\u00f6stergesi 4 \u00e7ubuk g\u00f6steriyor: havaland\u0131rma kanal\u0131n\u0131n temizlenmesi gerekir (k\u0131lavuza g\u00f6re ayda bir kontrol edilmeli ve en az y\u0131lda bir temizlenmeli). Yan\u0131k kokusu. Emin de\u011filseniz ya da sorun devam ederse cihaz\u0131 kullanmay\u0131 b\u0131rak\u0131n ve m\u00fclk y\u00f6netimine ba\u015fvurun.", "footer": "LG DL*X550, DL*X650 ve DL*X670 kurutma makineleri i\u00e7in \u00fcretici kullan\u0131m k\u0131lavuzu MFL71996102&#x27;ye dayan\u0131r. Resimler o k\u0131lavuzdan al\u0131nm\u0131\u015ft\u0131r.", "steps": [{"title": "T\u00fcy filtresi, her y\u00fckte", "items": [{"img": "/img/lg-dryer-care/lint-filter-p49.png", "w": 744, "h": 501, "cap": "T\u00fcy filtresi (1). K\u0131lavuz, sayfa 49."}, {"html": "Her y\u00fckten \u00f6nce kapa\u011f\u0131 a\u00e7\u0131n ve filtreyi d\u00fcmd\u00fcz yukar\u0131 \u00e7ekin."}, {"img": "/img/lg-dryer-care/lint-roll-p49.png", "w": 723, "h": 279, "cap": "T\u00fcyleri parmaklar\u0131n\u0131zla yuvarlayarak al\u0131n. K\u0131lavuz, sayfa 49."}, {"html": "T\u00fcyleri parmaklar\u0131n\u0131zla yuvarlayarak al\u0131n veya elektrik s\u00fcp\u00fcrgesiyle \u00e7ekin."}, {"html": "T\u0131k sesi gelene kadar s\u0131k\u0131ca geri itin."}]}, {"title": "Gerekti\u011finde filtreyi y\u0131kay\u0131n", "items": [{"img": "/img/lg-dryer-care/lint-wash-p50.png", "w": 682, "h": 411, "cap": "T\u0131kanm\u0131\u015f filtreyi \u0131l\u0131k sabunlu suda y\u0131kay\u0131n. K\u0131lavuz, sayfa 50."}, {"html": "Temiz filtreyi \u0131\u015f\u0131\u011fa tutun. Kirli g\u00f6r\u00fcn\u00fcyorsa veya yumu\u015fat\u0131c\u0131yla t\u0131kanm\u0131\u015fsa \u0131l\u0131k sabunlu suda y\u0131kay\u0131n."}, {"html": "Geri takmadan \u00f6nce tamamen kurumas\u0131n\u0131 bekleyin."}, {"html": "\u00c7ok t\u00fcy b\u0131rakan y\u00fckler (yeni havlular gibi): program\u0131 yar\u0131da duraklat\u0131n ve filtreyi temizleyin."}]}, {"title": "\u0130\u00e7 ve d\u0131\u015f temizlik", "items": [{"html": "D\u0131\u015f y\u00fczey: \u0131l\u0131k su ve hafif, a\u015f\u0131nd\u0131r\u0131c\u0131 olmayan deterjan. D\u00f6k\u00fclenleri hemen silin."}, {"html": "Kapak a\u011fz\u0131 ve conta: t\u00fcy ve tozu almak i\u00e7in yumu\u015fak nemli bir bezle silin."}, {"html": "Kapak cam\u0131: \u0131l\u0131k sabunlu suyla yumu\u015fak bir bez, sonra kurulay\u0131n."}, {"html": "Tambur: etiketine uyarak paslanmaz \u00e7elik temizleyici."}]}, {"title": "Makinenin \u00e7evresi", "items": [{"html": "Makinenin \u00e7evresindeki ve alt\u0131ndaki t\u00fcy ve tozu d\u00fczenli olarak s\u00fcp\u00fcr\u00fcn."}, {"html": "Kurutma yava\u015flarsa veya hava zay\u0131f g\u00f6r\u00fcn\u00fcrse m\u00fclk y\u00f6netimine haber verin: havaland\u0131rma kanal\u0131 t\u0131kanm\u0131\u015f olabilir."}, {"html": "Makinenin \u00fczerinde veya yak\u0131n\u0131nda yan\u0131c\u0131 bir \u015fey bulundurmay\u0131n."}]}]}}}, {"key": "lg-dryer-troubleshooting", "label": "Troubleshooting", "pdf": "/files/lg-dryer-troubleshooting.pdf", "pages": [{"src": "/pages/lg-dryer-troubleshooting-1.jpg",  Sense</strong> shows 4 bars: the vent is partly blocked. Contact property management."}]}, {"title": "Messages", "items": [{"html": "<strong>Duct blockage</strong>: see the IMPORTANT box."}, {"html": "<strong>Temp sensor error</strong>: turn the dryer off and contact property management."}, {"html": "<strong>Power supply</strong>, <strong>Power issue</strong>, <strong>High voltage</strong> or <strong>Low voltage</strong>: contact property management."}]}, {"title": "Clothes and normal things", "items": [{"html": "Wrinkles: unload right away, use a shorter time or lower Dry Level, or use <strong>Wrinkle Care</strong>."}, {"html": "Static: shorter drying, fabric softener, or <strong>Low Static</strong>."}, {"html": "Lint on clothes: clean the filter, dry towels apart from dark clothes. Check pockets for tissues."}, {"html": "Shrinking: follow care labels, use a low heat setting."}, {"html": "Steam: water drips, no visible steam, or a drum that stops: normal."}, {"html": "New dryer smell: normal, goes away after a few cycles."}]}]}, "tr": {"label": "Sorun Giderme", "pdf": "/files/lg-dryer-troubleshooting-tr.pdf", "pages": [{"src": "/pages/lg-dryer-troubleshooting-tr-1.jpg", "w": 1870, "h": 1445}], "kb": 47, "phone": {"kicker": "KURUTMA MAK\u0130NES\u0130 KILAVUZU", "title": "Kurutma Makinesi Sorun Giderme", "model": "LG kurutma makinesi, DL*X550, DL*X650 veya DL*X670 serisi (model teyit edilecek)", "important": "<strong>Duct blockage (80%, 90% veya 95%)</strong>: makineyi kullanmay\u0131 b\u0131rak\u0131n. K\u0131lavuz, t\u0131kal\u0131 havaland\u0131rmayla \u00e7al\u0131\u015ft\u0131rman\u0131n tehlikeli oldu\u011funu ve yang\u0131na yol a\u00e7abilece\u011fini belirtir. M\u00fclk y\u00f6netimine ba\u015fvurun.", "stop": "<strong>Duct blockage</strong>, <strong>Temp sensor error</strong> veya <strong>Power supply</strong>, <strong>Power issue</strong> ya da <strong>voltage</strong> mesaj\u0131. Yan\u0131k kokusu veya duman. A\u015fa\u011f\u0131dakileri kontrol ettikt     if(r.ok){const j=await r.json();if(j.answer){out.innerHTML=`<div class="ans">${mdish(j.answer)}</div>${j.sources&&j.sources.length?`<span class="srcs">${t().from}: ${esc(j.sources.join(', '))}</span>`:''}${NOTE()}`;return}}
  }catch(err){}
  try{const kb=await getKB(slug);const hits=search(kb,q);
    out.innerHTML=hits.length?`<p>${t().found}</p>${hits.map(h=>`<div class="hit">${h.title?`<strong>${esc(h.title)}:</strong> `:''}${hl(h.text,q)}<small>${esc(h.src)}</small></div>`).join('')}${NOTE()}`
      :`<p>${esc(t().nothing)}</p>${NOTE()}`;
  }catch(err){out.innerHTML=`<p>${t().unavailable}</p>`+NOTE()}
});
function tabUrl(a,x){return `#/${a.slug}/${kindOf(a,x)}`}
function phoneView(p){
  const steps=p.steps.map((st,i)=>{
    let out='',list=[];
    const flush=()=>{if(list.length){out+='<ul>'+list.map(x=>`<li>${x}</li>`).join('')+'</ul>';list=[]}};
    st.items.forEach(it=>{ if(it.img){flush();out+=`<figure class="fig"><button type="button" data-zoom="${it.img}" aria-label="${t().enlarge}"><img src="${it.img}" width="${it.w}" height="${it.h}" loading="lazy" alt="${esc(it.cap)}"></button><figcaption>${esc(it.cap)}</figcaption></figure>`} else list.push(it.html) });
    flush();
    return `<section class="step"><h3><span class="num">${i+1}</span>${esc(st.title)}</h3>${out}</section>`;
  }).join('');
  return `<div class="imp"><b>${t().imp}</b>${p.important}</div>${steps}
  <div class="gstop"><b>${t().stopBox}</b>${p.stop}</div>
  <p class="src">${p.footer}</p>`;
}
function guide(a,g){
  const L=AL(a),G=GL(a,g);
  document.title=`${G.label} - ${L.title}`;
  const i=a.guides.indexOf(g),prev=a.guides[i-1],nxt=a.guides[i+1];
  const pages=G.pages.map((p,k)=>`<a class="page" href="${p.src}" target="_blank" rel="noopener"><img src="${p.src}" width="${p.w}" height="${p.h}" loading="lazy" alt="${esc(G.label)}, ${t().page} ${k+1} ${t().of} ${G.pages.length}"></a>`).join('');
  const dl=`<a class="dl" href="${G.pdf}" download="${esc(L.title+' - '+G.label)}.pdf"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>${t().dl} (${G.kb>1024?(G.kb/1024).toFixed(1)+' MB':G.kb+' KB'})</a>`;
  app.innerHTML=`<a class="back" href="#/">&larr; ${DATA.length>1?t().all:t().back}</a>
  <h2 class="gtitle">${esc(L.title)}${G.phone?' &middot; '+esc(G.label):''}</h2>${L.sub?`<p class="gsub">${esc(L.sub)}</p>`:''}
  <nav class="tabs">${a.guides.map(x=>`<a class="tab" href="${tabUrl(a,x)}"${x===g?' aria-current="page"':''}>${esc(GL(a,x).label)}</a>`).join('')}</nav>
  ${G.fb?`<p class="fallback">${t().fallback}</p>`:''}
  ${/-troubleshooting$/.test(g.key)?askBox(a):''}
  ${G.phone?`<p class="swipe">${t().swipe}</p>${phoneView(G.phone)}
    <div class="next">${prev?`<a href="${tabUrl(a,prev)}">&larr; ${esc(GL(a,prev).label)}</a>`:''}${nxt?`<a href="${tabUrl(a,nxt)}">${esc(GL(a,nxt).label)} &rarr;</a>`:''}</div>
    ${dl}<details class="printed"><summary>${t().printed}</summary>${pages}</details>`
  :`${dl}<p class="zoom">${t().zoom}</p>${pages}
  <div class="stop"><strong>${t().stopT}</strong>${t().stopB}</div>`}`;
  app.dataset.prev=prev?tabUrl(a,prev):'';app.dataset.next=nxt?tabUrl(a,nxt):'';
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-zoom]');if(!b)return;
  const lb=document.createElement('div');lb.className='lb';lb.innerHTML=`<button type="button" aria-label="Close">&times;</button><img src="${b.dataset.zoom}" alt="">`;
  lb.addEventListener('click',ev=>{if(ev.target.tagName!=='IMG')lb.remove()});document.body.appendChild(lb);});
let sx=0,sy=0,st=0;
app.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
app.addEventListener('touchend',e=>{if(!sx||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=0;
  if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dx)<2*Math.abs(dy)||window.visualViewport&&visualViewport.scale>1.05)return;
  const to=dx<0?app.dataset.next:app.dataset.prev;if(to)location.hash=to;},{passive:true});
function route(){
  const m=location.hash.match(/^#\/([^/]+)\/([^/]+)/);
  const a=m&&DATA.find(x=>x.slug===m[1]);
  const g=a&&a.guides.find(x=>x.key===a.slug+'-'+m[2]);
  if(g)guide(a,g);else{home();app.dataset.prev=app.dataset.next='';}
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);chrome();route();
</script>
</body>
