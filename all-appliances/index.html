<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Appliance Guides</title>
<meta name="description" content="How to use, care for and troubleshoot the appliances in your apartment.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2329;--muted:#5d6670;--line:#e2e0db;--accent:#0f5c78;--accent-ink:#fff;--soft:#e8f1f4;--warn:#9a2b1d;--warn-bg:#fdf0ed}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--accent);color:var(--accent-ink);padding:22px 0 20px}
header h1{margin:0;font-size:1.5rem;line-height:1.2}
header p{margin:6px 0 0;opacity:.9;font-size:.95rem}
main{padding:18px 0 40px}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.appl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.appl-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.appl h2{margin:0;font-size:1.15rem;line-height:1.25}
.appl .sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px 6px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);background:#fff;text-decoration:none;font-weight:600;font-size:.92rem;line-height:1.2}
.btn:active{background:var(--soft)}
@media (max-width:420px){.btns{grid-template-columns:1fr}.btn{justify-content:flex-start;padding:10px 14px}}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;text-decoration:none}
.gtitle{margin:4px 0 2px;font-size:1.35rem;line-height:1.25}
.gsub{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.tab{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;min-height:46px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem}
.tab[aria-current=page]{background:var(--accent);border-color:var(--accent);color:#fff}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;margin:0 0 14px}
.page{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
.page img{display:block;width:100%;height:auto}
.zoom{color:var(--muted);font-size:.85rem;margin:-4px 0 12px;text-align:center}
.stop{background:var(--warn-bg);border:1px solid #f0c9c1;color:var(--warn);border-radius:12px;padding:14px 16px;margin:18px 0 0;font-size:.95rem}
.stop strong{display:block;margin-bottom:2px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 6px}
.imp{background:#fff6dd;border:1px solid #f0d58a;border-left:6px solid #d99a00;border-radius:12px;padding:14px 16px;margin:0 0 16px;font-size:1rem}
.imp b{display:block;color:#8a5a00;letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.step h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:1.15rem;line-height:1.25}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1rem}
.step ul{margin:0 0 12px;padding-left:1.2em}
.step li{margin:0 0 8px;font-size:1.05rem;line-height:1.5}
.step li:last-child{margin-bottom:0}
.step ul:last-child,.fig:last-child{margin-bottom:0}
.fig{margin:0 0 12px}
.fig button{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.fig img{display:block;max-width:100%;max-height:300px;margin:0 auto;height:auto}
.fig figcaption{color:var(--muted);font-size:.8rem;margin-top:4px;text-align:center}
.c-red{color:#c0261b}.c-blue{color:#1f5fbf}.c-green{color:#1d7a35}.c-orange{color:#c25e00}
.gstop{background:var(--warn-bg);border:1px solid #f0c9c1;border-left:6px solid var(--warn);border-radius:12px;padding:14px 16px;margin:4px 0 16px;color:#5a1a12;font-size:1rem}
.gstop b{display:block;color:var(--warn);letter-spacing:.03em;font-size:.85rem;margin-bottom:4px}
.src{color:var(--muted);font-size:.8rem;margin:0 0 16px}
.next{display:flex;justify-content:space-between;gap:8px;margin:0 0 14px}
.next a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;font-weight:600;text-align:center;padding:6px}
details.printed{margin:0 0 14px}
details.printed summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent);cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;overflow:auto;display:flex;align-items:center;justify-content:center;padding:56px 8px 16px}
.lb img{max-width:100%;height:auto;background:#fff;border-radius:6px}
.lb button{position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:1.4rem;line-height:1}
.swipe{color:var(--muted);font-size:.8rem;text-align:center;margin:0 0 10px}
.ask{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:14px;margin:0 0 16px}
.ask label{display:block;font-weight:700;margin:0 0 8px;font-size:1.05rem}
.askrow{display:flex;gap:8px}
.ask input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:1rem}
.ask button{min-height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700}
.askout{margin-top:10px;font-size:1rem}
.askout:empty{display:none}
.ans{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 8px}
.ans p{margin:0 0 8px}.ans p:last-child,.ans ul:last-child{margin-bottom:0}
.ans ul{margin:0 0 8px;padding-left:1.2em}
.hit{border-left:4px solid var(--accent);background:#f8fafb;border-radius:6px;padding:8px 12px;margin:0 0 8px;font-size:.95rem}
.hit small,.srcs{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.hit mark{background:#fff0a8;color:inherit}
.asknote{color:var(--warn);font-size:.9rem;margin:6px 0 0}
.langs{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap}
.langs button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;font:inherit;font-size:.95rem;font-weight:600}
.langs button[aria-pressed=true]{background:#fff;color:var(--accent);border-color:#fff}
.langs:empty{display:none}
.fallback{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:0 0 12px}
footer{color:var(--muted);font-size:.85rem;padding:0 0 30px}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="h1">All Appliance Guides</h1><p id="tag">How to use, care for and fix common problems with the appliances in your apartment.</p><div class="langs" id="langs" role="group" aria-label="Language"></div></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap">Toronto Boutique Apartments</footer>
<script>
const DATA=[{"slug": "whirlpool-front-load-washer", "title": "Whirlpool washer", "sub": "Front-load, models WFW9351 / WFW9151", "icon": "washer", "guides": [{"key": "whirlpool-front-load-washer-how-to-use", "label": "How to Use", "pdf": "/files/whirlpool-front-load-washer-how-to-use.pdf", "pages": [{"src": "/pages/whirlpool-front-load-washer-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 738, "phone": {"kicker": "WASHER GUIDE", "title": "How to Use the Washer", "model": "Whirlpool Model WFW9351 or WFW9151 (to confirm)", "important": "Never wash anything with gasoline or other flammable fluids on it: fire risk. Use only HE (High Efficiency) detergent. Do not overload. Do not reach in while the drum moves, and do not let children play on or in the washer. Run the washer only when you are home, and never on an extension cord.", "stop": "Water leaks. An error code comes back after a restart, or the washer will not fill or drain. A burning smell, smoke, or grinding or banging noise. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s manual W10432633A for Whirlpool front-loading washer models WFW9351 and WFW9151. Pictures are taken from that manual.", "steps": [{"title": "Load", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/load-drum-p9.png", "w": 768, "h": 488, "cap": "From the manufacturer's manual, page 9."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/load-sizes-p8.png", "w": 1142, "h": 315, "cap": "From the manufacturer's manual, page 8."}, {"html": "Sort by colour and fabric. Keep very dirty items and delicates apart."}, {"html": "Empty pockets, close zippers and hooks, tie strings. Coins can block the pump."}, {"html": "Load loosely, mixing large and small items. Do not wash a single item alone. Small items go in mesh bags."}, {"html": "Small load: 3 to 5 items (1/4 full). Medium: 1/2. Large: 3/4. Clothes must tumble freely."}, {"html": "Push the door until the latch clicks."}]}, {"title": "Detergent", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/detergent-drawer-p10.png", "w": 767, "h": 441, "cap": "From the manufacturer's manual, page 10."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/bleach-compartment-p10.png", "w": 768, "h": 453, "cap": "From the manufacturer's manual, page 10."}, {"html": "<strong>HE detergent</strong>, liquid or powder, in its compartment. Colour-safe bleach can go with it. Do not mix powder and liquid."}, {"html": "<strong>Fabric softener</strong> (liquid only): max 1/4 cup (60 mL), not past MAX. No softener balls."}, {"html": "<strong>Chlorine bleach</strong>: max 2/3 cup (165 mL), not past MAX. Never colour-safe bleach here."}, {"html": "Never pour products straight onto clothes."}, {"html": "Close the drawer slowly and fully. A little water left in it is normal."}]}, {"title": "Cycle and options", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/cycle-knob-p11.png", "w": 767, "h": 577, "cap": "From the manufacturer's manual, page 11."}, {"html": "Press and hold <strong>POWER</strong>, then turn the knob."}, {"html": "<strong>Normal</strong>: everyday loads. <strong>Heavy Duty</strong>: towels, jeans. <strong>Whitest Whites</strong>. <strong>Cold Wash</strong>: colours. <strong>Delicate</strong>: lingerie, sweaters. <strong>Bulky Items</strong>: comforters. <strong>Small Load</strong>: 3 to 5 items. <strong>Rinse/Drain &amp; Spin</strong>: spin out a wet <strong>load</strong>."}, {"html": "<strong><span class=\"c-red\">Not sure?</span> Choose</strong> <span class=\"c-red\"><strong>Normal</strong></span> for everyday laundry."}, {"html": "Buttons under the display change Temperature, Spin and Soil Level. Faster spin means drier clothes but more wrinkles."}, {"html": "<strong>Extra Rinse</strong>, <strong>Delay Start</strong> (up to 10 h, use powder detergent)."}, {"html": "<strong>TumbleFresh</strong>: keeps clean clothes from sitting still and getting musty when you can&#x27;t empty the washer right away. After the wash ends, the drum turns the clothes over every now and then, for up to 6 hours. Turn it on before starting the wash: press TumbleFresh until its light comes on. While it runs, the Done light stays on, the TumbleFresh light flashes and the door stays locked. Press <strong>POWER</strong> any time to stop it and unlock the door; otherwise it stops by itself after 6 hours. It doesn&#x27;t work when spin speed is set to No Spin."}]}, {"title": "Start and finish", "items": [{"img": "/img/whirlpool-front-load-washer-how-to-use/start-pause-p11.png", "w": 786, "h": 316, "cap": "From the manufacturer's manual, page 11."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/door-p12.png", "w": 823, "h": 468, "cap": "From the manufacturer's manual, page 12."}, {"html": "Press and hold <strong>START/PAUSE</strong>. The door locks, unlocks and locks again: normal. Start within 5 minutes or it turns off."}, {"html": "<strong>Add 1 or 2 items</strong> while Add a Garment is lit: press START/PAUSE once, wait for the door to unlock."}, {"html": "<strong>Pause</strong>: press START/PAUSE once; hold it to continue. <strong>Cancel</strong>: press POWER. <strong>Lock buttons</strong>: hold Control Lock 3 s."}, {"html": "At the end, the <strong>Done</strong> light comes on in the display (picture below). Unload straight away and check the door seal for small items. If <strong>TumbleFresh</strong> is on, Done stays lit and the door stays locked: press <strong>POWER</strong> to unlock."}, {"img": "/img/whirlpool-front-load-washer-how-to-use/status-lights-p6.png", "w": 655, "h": 276, "cap": "Display on model WFW9151 (WFW9351 has the same Done light). Manual, page 6."}, {"html": "Leave the door open so the drum dries. Open and close it before the next wash."}]}]}, "tr": null}, {"key": "whirlpool-front-load-washer-care", "label": "Appliance Care", "pdf": "/files/whirlpool-front-load-washer-care.pdf", "pages": [{"src": "/pages/whirlpool-front-load-washer-care-1.jpg", "w": 1870, "h": 1445}], "kb": 601, "phone": {"kicker": "WASHER GUIDE", "title": "Washer Care", "model": "Whirlpool Model WFW9351 or WFW9151 (to confirm)", "important": "Wear rubber gloves when cleaning with bleach and follow the bleach label. Do not use abrasive cleaners, and do not take any part of the washer apart. Use only HE detergent and measure it: too much leaves residue and causes smells.", "stop": "A water hose behind the washer is bulging, cracked, kinked or leaking (the manual says hoses should be replaced every 5 years). A bad smell stays after the monthly clean. The washer needs to be moved, or the room could freeze. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s manual W10432633A for Whirlpool front-loading washer models WFW9351 and WFW9151. Pictures are taken from that manual.", "steps": [{"title": "After every load", "items": [{"img": "/img/whirlpool-front-load-washer-care/door-p12.png", "w": 823, "h": 468, "cap": "From the manufacturer's manual, page 12."}, {"html": "Take the laundry out as soon as the cycle ends."}, {"html": "Leave the door open so the washer can dry. This prevents smells."}, {"html": "Wipe spills on the outside with a soft damp cloth, with mild soap if needed."}, {"html": "Now and then, wipe the inside of the door glass. Residue there can cause drips."}]}, {"title": "Monthly clean (or every 30 washes)", "items": [{"img": "/img/whirlpool-front-load-washer-care/cycle-knob-p11.png", "w": 767, "h": 577, "cap": "From the manufacturer's manual, page 11."}, {"html": "Empty drum. Put one <strong>AFFRESH</strong> tablet in the drum, or 2/3 cup (160 mL) of liquid chlorine bleach in the bleach compartment. No detergent."}, {"html": "Close the door and drawer. Press <strong>POWER</strong>, turn the knob to <strong>CLEAN WASHER with affresh</strong>, press and hold <strong>START/PAUSE</strong>."}, {"html": "For about 3 minutes the drum turns and the door locks and unlocks: normal. If the Wash light flashes, take out what is in the drum and start again."}, {"html": "Let it finish. If stopped, &quot;Int&quot; shows and the door can take up to 10 minutes to unlock. Then leave the door slightly open."}]}, {"title": "Dispenser drawer", "items": [{"img": "/img/whirlpool-front-load-washer-care/drawer-release-p13.png", "w": 767, "h": 528, "cap": "From the manufacturer's manual, page 13."}, {"html": "Pull the drawer out until it stops. Press down on the release lever and pull it straight out."}, {"img": "/img/whirlpool-front-load-washer-care/drawer-insert-p13.png", "w": 767, "h": 502, "cap": "From the manufacturer's manual, page 13."}, {"html": "Lift out the insert. Wash both in warm soapy water, rinse, and dry. Not dishwasher safe."}, {"img": "/img/whirlpool-front-load-washer-care/drawer-refit-p13.png", "w": 767, "h": 408, "cap": "From the manufacturer's manual, page 13."}, {"html": "Put the insert back, line the drawer up with the guides and slide it in."}]}, {"title": "Door seal and time away", "items": [{"img": "/img/whirlpool-front-load-washer-care/door-seal-p13.png", "w": 768, "h": 372, "cap": "From the manufacturer's manual, page 13."}, {"html": "Pull back the seal and check for stains and small objects."}, {"html": "Wipe stains with a damp cloth and 3/4 cup (177 mL) of liquid chlorine bleach in 1 gallon (3.8 L) of warm water. Leave 5 minutes, wipe dry, leave the door open."}, {"html": "Run the washer only when you are home. Before a long trip, ask property management whether the water taps behind the washer should be turned off."}, {"html": "After a long time unused, run a Normal cycle with half the usual HE detergent and no clothes."}]}]}, "tr": null}, {"key": "whirlpool-front-load-washer-troubleshooting", "label": "Troubleshooting", "pdf": "/files/whirlpool-front-load-washer-troubleshooting.pdf", "pages": [{"src": "/pages/whirlpool-front-load-washer-troubleshooting-1.jpg", "w": 1870, "h": 1445}], "kb": 454, "phone": {"kicker": "WASHER GUIDE", "title": "Washer Troubleshooting", "model": "Whirlpool Model WFW9351 or WFW9151 (to confirm)", "important": "Do not open the washer cabinet or try to repair it. If water is leaking near an electrical outlet, do not touch the washer or the plug.", "stop": "Water leaks from the washer, the hoses or the door. An error code comes back after you restart, or the washer will not fill or drain. A burning smell, smoke, or a loud grinding or banging noise. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s manual W10432633A for Whirlpool front-loading washer models WFW9351 and WFW9151. Pictures are taken from that manual.", "steps": [{"title": "A code shows", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/display-knob-p11.png", "w": 767, "h": 442, "cap": "From the manufacturer's manual, page 11."}, {"html": "<strong>Sd</strong>: too many suds. Let it carry on. If the knob lights flash, choose the cycle again with a cold temperature and press START/PAUSE. Next time use less HE detergent."}, {"html": "<strong>F8 E1</strong>: no water. Check both taps behind the washer are on and the hoses are not kinked. Press START/PAUSE once to clear, then again to restart."}, {"html": "<strong>F9 E1</strong>: cannot drain. Check the drain hose is not kinked or blocked, then clear and restart."}, {"html": "<strong>Other F/E code</strong>: press POWER. If water is left, run RINSE/DRAIN &amp; SPIN. If it comes back, contact property management."}]}, {"title": "Won't start or door won't open", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/start-pause-p11.png", "w": 786, "h": 316, "cap": "From the manufacturer's manual, page 11."}, {"html": "Close the door until it latches, then press and hold START/PAUSE. After a cycle, open and close the door first."}, {"html": "Control Lock light on: hold Control Lock (Cycle Signal on some models) for 3 seconds. Check the plug and breaker."}, {"img": "/img/whirlpool-front-load-washer-troubleshooting/status-lights-both-p6.png", "w": 1525, "h": 303, "cap": "From the manufacturer's manual, page 6. Both models are shown."}, {"html": "Door locked: press START/PAUSE once and wait for the drum to stop. If water is left, run RINSE/DRAIN &amp; SPIN. If TumbleFresh is on, press POWER."}]}, {"title": "Wet clothes, noise or suds", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/load-sizes-p8.png", "w": 1142, "h": 315, "cap": "From the manufacturer's manual, page 8."}, {"html": "Still wet: run RINSE/DRAIN &amp; SPIN with no detergent. Spread out a tight or one-item load, or take half out and spin again. Delicate cycles leave clothes wetter."}, {"html": "Clicks at the start (door lock), humming while draining, and zips touching the drum are normal."}, {"html": "Shaking: don&#x27;t wash a single item or pack the drum. Use Bulky Items for comforters. If it still moves, contact property management."}, {"img": "/img/whirlpool-front-load-washer-troubleshooting/detergent-drawer-p10.png", "w": 767, "h": 441, "cap": "From the manufacturer's manual, page 10."}, {"html": "Suds or drips at the door: use only measured HE detergent and wipe the door glass."}]}, {"title": "Smell, poor results, timing", "items": [{"img": "/img/whirlpool-front-load-washer-troubleshooting/door-seal-p13.png", "w": 768, "h": 372, "cap": "From the manufacturer's manual, page 13."}, {"html": "Bad smell: run the monthly clean (see Appliance Care) and leave the door open between washes."}, {"html": "Not clean: don&#x27;t pack the drum, use the dispenser, no softener balls. Grey whites: wash apart from darks, warmer water if the label allows."}, {"html": "Wrinkles: load loosely, slower spin, unload straight away."}, {"html": "Low-looking water, a changing time left, or an option that won&#x27;t light up for that cycle: all normal."}]}]}, "tr": null}], "tr": null}, {"slug": "frigidaire-dishwasher", "title": "Frigidaire dishwasher", "sub": "", "icon": "dishwasher", "guides": [{"key": "frigidaire-dishwasher-how-to-use", "label": "How to Use", "pdf": "/files/frigidaire-dishwasher-how-to-use.pdf", "pages": [{"src": "/pages/frigidaire-dishwasher-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 431, "phone": {"kicker": "DISHWASHER GUIDE", "title": "How to Use the Dishwasher", "model": "Frigidaire dishwasher (model to confirm)", "important": "Use only automatic dishwasher detergent, never hand dish soap. Load knives and sharp items pointing down. Do not let children play in or on the dishwasher or sit or stand on the open door. Open the door slowly during a cycle: hot water can splash out. Do not touch the heating element at the bottom during or right after a cycle.", "stop": "Water leaks or pools under the dishwasher. Error code i1 or i4 shows, or it will not fill or drain. A burning smell, smoke, or a grinding noise that keeps going. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Use &amp; Care manual A15931101 for this Frigidaire dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Load", "items": [{"img": "/img/frigidaire-dishwasher-how-to-use/upper-basket-p7.png", "w": 453, "h": 450, "cap": "Upper basket. From the manufacturer's manual, page 7."}, {"img": "/img/frigidaire-dishwasher-how-to-use/lower-basket-p7.png", "w": 453, "h": 453, "cap": "Lower basket. From the manufacturer's manual, page 7."}, {"html": "Scrape off large food, bones and toothpicks. Empty glasses and cups. Rinse only if the dishes will wait before washing."}, {"html": "<strong>Upper basket</strong>: glasses, cups, small plates and plastics marked dishwasher safe. Open side down, tilted slightly."}, {"html": "<strong>Lower basket</strong>: plates, bowls, pots and pans facing down. Items up to 11 inches tall. Fold the tines down for big pots."}, {"img": "/img/frigidaire-dishwasher-how-to-use/cutlery-basket-p8.png", "w": 468, "h": 236, "cap": "Cutlery basket. From the manufacturer's manual, page 8."}, {"html": "<strong>Cutlery basket</strong>: knives and sharp items pointing down."}, {"html": "Turn the spray arm under the upper basket by hand: nothing should stop it or block the detergent cup."}, {"html": "If the dishwasher drains into the sink&#x27;s garbage disposal, run the disposal first so it is empty."}]}, {"title": "Detergent and rinse aid", "items": [{"img": "/img/frigidaire-dishwasher-how-to-use/detergent-open-p9.png", "w": 551, "h": 365, "cap": "From the manufacturer's manual, page 9."}, {"html": "Push the release catch to open the detergent cup."}, {"img": "/img/frigidaire-dishwasher-how-to-use/detergent-add-p9.png", "w": 453, "h": 419, "cap": "From the manufacturer's manual, page 9."}, {"html": "Add <strong>automatic dishwasher detergent</strong>, then press the cover down until it closes. The cover is always open again at the end of a cycle: normal."}, {"img": "/img/frigidaire-dishwasher-how-to-use/rinse-aid-fill-p10.png", "w": 524, "h": 575, "cap": "From the manufacturer's manual, page 10."}, {"html": "<strong>Rinse aid</strong> (liquid only) helps dishes dry. Check the window next to the cup. To fill, lift the tab, fill up to the full mark (not past it), press the cover down. It lasts about a month."}, {"html": "Never put detergent in the rinse aid side, and never use powder or solid rinse aid."}]}, {"title": "Cycle and options", "items": [{"img": "/img/frigidaire-dishwasher-how-to-use/control-panel-p5.png", "w": 1065, "h": 212, "cap": "Control panel. From the manufacturer's manual, page 5."}, {"html": "<strong>Normal Wash</strong>: everyday loads. <strong>Heavy Wash</strong>: pots, pans, casseroles. <strong>1 Hour Wash</strong>: lightly soiled, no drying. <strong>China Crystal</strong>: delicate china and glass. <strong>Energy Saver</strong>: lightly soiled, pre-rinsed dishes."}, {"html": "<strong>Rinse Only</strong>: rinses now so food doesn&#x27;t dry on until you run a full load. No detergent."}, {"html": "Press <strong>Options</strong> to choose <strong>Sanitize</strong> (Heavy and Normal only), <strong>High Temp</strong> or <strong>Heat Dry</strong>. A light shows what is on."}, {"html": "<strong>Delay</strong>: press Delay until the hours (1h to 24h) show, then press START/Cancel."}, {"html": "<strong>Control Lock</strong>: hold Options and Delay together for 3 seconds. Do the same to unlock."}]}, {"title": "Start and finish", "items": [{"img": "/img/frigidaire-dishwasher-how-to-use/cycle-lights-p6.png", "w": 231, "h": 252, "cap": "Cycle lights. From the manufacturer's manual, page 6."}, {"html": "Close the door until it latches and press <strong>START/Cancel</strong>. The display shows the minutes left. The time can jump up or down: normal."}, {"html": "<strong>Cancel</strong>: hold START/Cancel for 3 seconds."}, {"html": "<strong>Add a dish</strong>: open the door a little and wait for the spraying to stop. Add the dish, close the door firmly and press START/Cancel."}, {"html": "At the end it beeps and the <strong>Clean</strong> light stays on until you open the door (<strong>Sanitized</strong> if you chose Sanitize). Dishes can be hot."}]}]}, "tr": null}, {"key": "frigidaire-dishwasher-care", "label": "Appliance Care", "pdf": "/files/frigidaire-dishwasher-care.pdf", "pages": [{"src": "/pages/frigidaire-dishwasher-care-1.jpg", "w": 1870, "h": 1445}], "kb": 655, "phone": {"kicker": "DISHWASHER GUIDE", "title": "Dishwasher Care", "model": "Frigidaire dishwasher (model to confirm)", "important": "Let the heating element at the bottom cool before cleaning inside: burn risk. Do not use benzene, wax, thinner, chlorine bleach or alcohol. Do not spray water over the dishwasher or let water reach electrical parts. Do not remove the long rubber seal around the tub opening.", "stop": "A filter or the spray arm is broken or will not lock back. The door seal is torn, or the door still does not close properly. Water leaks or pools under the dishwasher. A bad smell stays after the vinegar cycle. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Use &amp; Care manual A15931101 for this Frigidaire dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Outside and inside", "items": [{"img": "/img/frigidaire-dishwasher-care/interior-p4.png", "w": 1070, "h": 765, "cap": "Inside the dishwasher. From the manufacturer's manual, page 4."}, {"html": "Wipe spills as they happen. Soft damp cloth on the control panel. Stainless door: stainless steel cleaner and a soft cloth."}, {"html": "Wipe the inside and the inner door with a wet dishcloth."}, {"html": "Now and then, fill the detergent cup and run it empty on <strong>Normal Wash</strong> with <strong>Sanitize</strong>."}, {"html": "White spots or smell: run Normal Wash empty with no detergent. Once water has run through, open the door, put an 8 oz cup of white vinegar upright in the lower basket, close and let it finish."}]}, {"title": "Clean the filters", "items": [{"html": "Turn the dishwasher off and let the heating element cool."}, {"img": "/img/frigidaire-dishwasher-care/filter-twist-p11.png", "w": 453, "h": 343, "cap": "From the manufacturer's manual, page 11."}, {"html": "Turn the filter insert counterclockwise and lift it out."}, {"img": "/img/frigidaire-dishwasher-care/filter-separate-p11.png", "w": 453, "h": 426, "cap": "From the manufacturer's manual, page 11."}, {"html": "Pull out the flat, rectangular fine filter."}, {"img": "/img/frigidaire-dishwasher-care/filter-rinse-p12.png", "w": 453, "h": 432, "cap": "From the manufacturer's manual, page 12."}, {"html": "Remove food and rinse the filters under running water."}]}, {"title": "Put filters back, spray arm", "items": [{"img": "/img/frigidaire-dishwasher-care/filter-refit-p12.png", "w": 453, "h": 343, "cap": "From the manufacturer's manual, page 12."}, {"html": "Put the filters back in reverse order. Turn the insert clockwise to the close arrow. If it is not closed properly, it cleans less well."}, {"img": "/img/frigidaire-dishwasher-care/spray-arm-p12.png", "w": 453, "h": 337, "cap": "From the manufacturer's manual, page 12."}, {"html": "Dishes not clean or holes blocked: pull the lower spray arm straight up, gently."}, {"html": "Clear the holes, push it back and spin it by hand to check it turns."}]}, {"title": "Door seal and rinse aid", "items": [{"img": "/img/frigidaire-dishwasher-care/door-gasket-p12.png", "w": 450, "h": 380, "cap": "From the manufacturer's manual, page 12."}, {"html": "Door not closing well or leaking: wipe the door seal with a damp cloth to remove food."}, {"img": "/img/frigidaire-dishwasher-care/rinse-aid-fill-p10.png", "w": 524, "h": 575, "cap": "From the manufacturer's manual, page 10."}, {"html": "Check the rinse aid window about once a month. Lift the tab, fill with liquid rinse aid up to the full mark (not past it), press the cover down firmly."}]}]}, "tr": null}, {"key": "frigidaire-dishwasher-troubleshooting", "label": "Troubleshooting", "pdf": "/files/frigidaire-dishwasher-troubleshooting.pdf", "pages": [{"src": "/pages/frigidaire-dishwasher-troubleshooting-1.jpg", "w": 1870, "h": 1445}], "kb": 264, "phone": {"kicker": "DISHWASHER GUIDE", "title": "Dishwasher Troubleshooting", "model": "Frigidaire dishwasher (model to confirm)", "important": "Do not open the dishwasher panels or try to repair it. If water overflows, turn off the water to the dishwasher if you know where the valve is (often under the kitchen sink; property management can confirm) and do not restart it until the water is cleaned up.", "stop": "Water leaks, overflows or pools under the dishwasher. Code i1 or i4 comes back, or it will not fill or drain. A burning smell, smoke, or a grinding noise that keeps going after a full cycle. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Use &amp; Care manual A15931101 for this Frigidaire dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Code or won't start", "items": [{"img": "/img/frigidaire-dishwasher-troubleshooting/control-panel-p5.png", "w": 1065, "h": 212, "cap": "Control panel with display. From the manufacturer's manual, page 5."}, {"html": "<strong>i1</strong>: water takes too long to come in (supply off or low pressure). Contact property management if it happens again."}, {"html": "<strong>i4</strong>: leaking. Turn it off and contact property management."}, {"img": "/img/frigidaire-dishwasher-troubleshooting/cycle-lights-p6.png", "w": 231, "h": 252, "cap": "From the manufacturer's manual, page 6."}, {"html": "Won&#x27;t start: close the door until it latches. <strong>Delay</strong> light on: hold START/Cancel 3 seconds to cancel. Controls do nothing: hold Options and Delay 3 seconds (Control Lock). Check the plug and breaker."}]}, {"title": "Long cycles, dirty dishes", "items": [{"html": "Heavy soil and Sanitize make cycles longer. Not-hot incoming water does too: avoid running it during showers. A beep at the end is normal."}, {"img": "/img/frigidaire-dishwasher-troubleshooting/spray-arm-p12.png", "w": 453, "h": 337, "cap": "From the manufacturer's manual, page 12."}, {"html": "Not clean: don&#x27;t load too close together; make sure the spray arms turn freely; use fresh detergent; choose Heavy Wash for very dirty loads."}, {"img": "/img/frigidaire-dishwasher-troubleshooting/filter-rinse-p12.png", "w": 453, "h": 432, "cap": "From the manufacturer's manual, page 12."}, {"html": "Clean the filters (see Appliance Care). Detergent left in the cup: old detergent, or a dish blocked the spray arm."}]}, {"title": "Wet, spotty or marked", "items": [{"img": "/img/frigidaire-dishwasher-troubleshooting/rinse-aid-fill-p10.png", "w": 524, "h": 575, "cap": "From the manufacturer's manual, page 10."}, {"html": "Wet dishes, spots or film: fill with fresh rinse aid and choose a cycle with drying or Heat Dry."}, {"html": "Black or grey marks: aluminium pans rubbed against dishes. Load them apart."}, {"html": "Reddish tomato stains: run Rinse Only right after loading. Coffee or tea stains: use a dishwasher spot cleaner."}]}, {"title": "Water, suds or noise", "items": [{"html": "Water left at the bottom: the cycle was stopped. Run a cycle to the end."}, {"html": "Won&#x27;t drain: run the sink&#x27;s garbage disposal so it is empty. Still not draining: contact property management."}, {"html": "Suds or leaks: use only automatic dishwasher detergent, never hand dish soap."}, {"html": "Detergent cup and drain pump noises are normal. Grinding means a hard object got in: if it keeps going after a full cycle, contact property management."}, {"html": "Won&#x27;t fill: close the door fully. If it still won&#x27;t fill, contact property management."}]}]}, "tr": null}], "tr": null}, {"slug": "kitchenaid-dishwasher", "title": "KitchenAid dishwasher", "sub": "Stainless steel tub (manual W11589935)", "icon": "dishwasher", "guides": [{"key": "kitchenaid-dishwasher-how-to-use", "label": "How to Use", "pdf": "/files/kitchenaid-dishwasher-how-to-use.pdf", "pages": [{"src": "/pages/kitchenaid-dishwasher-how-to-use-1.jpg", "w": 1870, "h": 1445}], "kb": 43, "phone": {"kicker": "DISHWASHER GUIDE", "title": "How to Use the Dishwasher", "model": "KitchenAid dishwasher, stainless steel tub (model to confirm)", "important": "Use only dishwasher detergent and keep it away from children. Load sharp knives with the handles up. Do not sit or stand on the door or racks, do not push down on the open door, and do not let children play in or on the dishwasher. Do not touch the heating element during or right after a cycle.", "stop": "Water leaks or pools under the dishwasher. An error code shows or the lights blink in a pattern (see Troubleshooting). A burning smell or smoke. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual W11589935 for this KitchenAid dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Load", "items": [{"html": "Load <strong>sharp knives with the handles up</strong>."}, {"html": "Place sharp items so they cannot touch or damage the door seal."}, {"html": "Plastic: only items marked <strong>dishwasher safe</strong>."}, {"html": "Do not sit, stand or lean on the open door or the racks."}]}, {"title": "Detergent and rinse aid", "items": [{"html": "Use only dishwasher detergent. <strong>Premeasured tablets or packs</strong> are recommended."}, {"html": "<strong>Rinse aid is needed</strong> for dry dishes and to limit hard-water spots. Keep it filled."}, {"html": "The detergent cup and rinse aid cap are on the inside of the door (<span class=\"c-orange\">location to confirm with property management</span>)."}]}, {"title": "Start", "items": [{"html": "Choose a cycle on the control panel, for example <strong>Normal</strong>. Not sure which one? Ask property management."}, {"html": "Press <strong>Start/Resume</strong>, then <strong>close the door within 4 seconds</strong>."}, {"html": "<strong>Start/Resume light flashing</strong>: the door was not closed in time. Press Start/Resume again and close the door."}, {"html": "Adding a dish during a cycle: add it, press Start/Resume and close the door within 4 seconds."}]}, {"title": "What to expect", "items": [{"html": "A load usually takes <strong>2 to 5 hours</strong>. This is normal: it saves energy."}, {"html": "The first cycle may run longer. Some options can make a cycle longer than 3.5 hours."}, {"html": "Hot water not used for <strong>2 weeks or more</strong>? Before using the dishwasher, run every hot tap for a few minutes. No smoking or open flame while you do this (hydrogen gas risk)."}]}]}, "tr": {"label": "Nas\u0131l Kullan\u0131l\u0131r", "pdf": "/files/kitchenaid-dishwasher-how-to-use-tr.pdf", "pages": [{"src": "/pages/kitchenaid-dishwasher-how-to-use-tr-1.jpg", "w": 1870, "h": 1445}], "kb": 44, "phone": {"kicker": "BULA\u015eIK MAK\u0130NES\u0130 KILAVUZU", "title": "Bula\u015f\u0131k Makinesi Nas\u0131l Kullan\u0131l\u0131r", "model": "KitchenAid bula\u015f\u0131k makinesi, paslanmaz \u00e7elik i\u00e7 hazne (model teyit edilecek)", "important": "Sadece bula\u015f\u0131k makinesi deterjan\u0131 kullan\u0131n ve deterjan\u0131 \u00e7ocuklardan uzak tutun. Keskin b\u0131\u00e7aklar\u0131 saplar\u0131 yukar\u0131 gelecek \u015fekilde yerle\u015ftirin. Kapa\u011f\u0131n veya raflar\u0131n \u00fczerine oturmay\u0131n ya da basmay\u0131n, a\u00e7\u0131k kapa\u011fa bast\u0131rmay\u0131n ve \u00e7ocuklar\u0131n makinenin i\u00e7inde veya \u00fcst\u00fcnde oynamas\u0131na izin vermeyin. Program s\u0131ras\u0131nda veya hemen sonras\u0131nda \u0131s\u0131t\u0131c\u0131ya dokunmay\u0131n.", "stop": "Su s\u0131z\u0131yor veya makinenin alt\u0131nda su birikiyor. Bir hata kodu g\u00f6r\u00fcn\u00fcyor veya \u0131\u015f\u0131klar belirli bir d\u00fczende yan\u0131p s\u00f6n\u00fcyor (Sorun Giderme&#x27;ye bak\u0131n). Yan\u0131k kokusu veya duman. Emin de\u011filseniz ya da sorun devam ederse cihaz\u0131 kullanmay\u0131 b\u0131rak\u0131n ve m\u00fclk y\u00f6netimine ba\u015fvurun.", "footer": "Bu KitchenAid bula\u015f\u0131k makinesinin \u00fcretici kullan\u0131m k\u0131lavuzu W11589935&#x27;e dayan\u0131r. Resimler o k\u0131lavuzdan al\u0131nm\u0131\u015ft\u0131r.", "steps": [{"title": "Yerle\u015ftirme", "items": [{"html": "<strong>Keskin b\u0131\u00e7aklar\u0131 saplar\u0131 yukar\u0131</strong> gelecek \u015fekilde yerle\u015ftirin."}, {"html": "Keskin e\u015fyalar\u0131 kapak contas\u0131na de\u011fmeyecek ve ona zarar vermeyecek \u015fekilde koyun."}, {"html": "Plastik: sadece <strong>bula\u015f\u0131k makinesinde y\u0131kanabilir</strong> i\u015fareti olanlar."}, {"html": "A\u00e7\u0131k kapa\u011fa veya raflara oturmay\u0131n, basmay\u0131n, yaslanmay\u0131n."}]}, {"title": "Deterjan ve parlat\u0131c\u0131", "items": [{"html": "Sadece bula\u015f\u0131k makinesi deterjan\u0131 kullan\u0131n. <strong>Haz\u0131r \u00f6l\u00e7\u00fcl\u00fc tabletler veya kaps\u00fcller</strong> \u00f6nerilir."}, {"html": "Bula\u015f\u0131klar\u0131n kurumas\u0131 ve kire\u00e7 lekelerinin azalmas\u0131 i\u00e7in <strong>parlat\u0131c\u0131 gereklidir</strong>. Haznesini dolu tutun."}, {"html": "Deterjan kab\u0131 ve parlat\u0131c\u0131 kapa\u011f\u0131 kapa\u011f\u0131n i\u00e7 taraf\u0131ndad\u0131r (<span class=\"c-orange\">yeri m\u00fclk y\u00f6netimi ile teyit edilecek</span>)."}]}, {"title": "Ba\u015flatma", "items": [{"html": "Kontrol panelinden bir program se\u00e7in, \u00f6rne\u011fin <strong>Normal</strong>. Hangisi oldu\u011fundan emin de\u011fil misiniz? M\u00fclk y\u00f6netimine sorun."}, {"html": "<strong>Start/Resume</strong> d\u00fc\u011fmesine bas\u0131n, ard\u0131ndan <strong>kapa\u011f\u0131 4 saniye i\u00e7inde kapat\u0131n</strong>."}, {"html": "<strong>Start/Resume \u0131\u015f\u0131\u011f\u0131 yan\u0131p s\u00f6n\u00fcyor</strong>: kapak zaman\u0131nda kapat\u0131lmad\u0131. Start/Resume&#x27;a tekrar bas\u0131n ve kapa\u011f\u0131 kapat\u0131n."}, {"html": "Program s\u0131ras\u0131nda bula\u015f\u0131k eklemek: ekleyin, Start/Resume&#x27;a bas\u0131n ve kapa\u011f\u0131 4 saniye i\u00e7inde kapat\u0131n."}]}, {"title": "Ne beklemeli", "items": [{"html": "Bir y\u0131kama genellikle <strong>2 ila 5 saat</strong> s\u00fcrer. Bu normaldir: enerji tasarrufu sa\u011flar."}, {"html": "\u0130lk program daha uzun s\u00fcrebilir. Baz\u0131 se\u00e7enekler program\u0131 3,5 saatten uzun yapabilir."}, {"html": "S\u0131cak su <strong>2 hafta veya daha uzun</strong> s\u00fcre kullan\u0131lmad\u0131 m\u0131? Bula\u015f\u0131k makinesini kullanmadan \u00f6nce t\u00fcm s\u0131cak su musluklar\u0131n\u0131 birka\u00e7 dakika a\u00e7\u0131k b\u0131rak\u0131n. Bunu yaparken sigara i\u00e7meyin ve a\u00e7\u0131k ate\u015f kullanmay\u0131n (hidrojen gaz\u0131 tehlikesi)."}]}]}}}, {"key": "kitchenaid-dishwasher-care", "label": "Appliance Care", "pdf": "/files/kitchenaid-dishwasher-care.pdf", "pages": [{"src": "/pages/kitchenaid-dishwasher-care-1.jpg", "w": 1870, "h": 1445}], "kb": 291, "phone": {"kicker": "DISHWASHER GUIDE", "title": "Dishwasher Care", "model": "KitchenAid dishwasher, stainless steel tub (model to confirm)", "important": "Do not touch the heating element during or right after a cycle. Never use a wire brush or scouring pad on the filters, or abrasive cleaners on the outside. Use vinegar only now and then: it is an acid and can damage the dishwasher.", "stop": "A filter is broken or will not go back in place. Water leaks or pools under the dishwasher. The dishwasher is not draining well. White residue keeps coming back after cleaning. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual W11589935 for this KitchenAid dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Outside and inside", "items": [{"html": "Outside: soft damp cloth and mild detergent only. No abrasive cleaners (stainless doors may have a fingerprint-resistant coating)."}, {"html": "<strong>Once a month</strong>: run a dishwasher cleaner such as affresh\u00ae, following the package directions."}, {"html": "White residue: <strong>place</strong> (do not pour) 2 cups (500 mL) white vinegar in a glass or dishwasher-safe cup on the bottom rack. Run a full cycle with an air-dry or energy-saving dry option and <strong>no detergent</strong>."}]}, {"title": "Clean the filters", "items": [{"html": "How often: every 2 months if you only scrape plates; every 4 months to once a year if you rinse them first. <strong>White residue (hard water): once a month.</strong>"}, {"img": "/img/kitchenaid-dishwasher-care/filter-twist-p5.png", "w": 367, "h": 170, "cap": "Turn the upper filter. From the manufacturer's manual, page 5."}, {"html": "Turn the upper filter <strong>1/4 turn counterclockwise</strong> and lift it out."}, {"img": "/img/kitchenaid-dishwasher-care/filter-separate-p5.png", "w": 368, "h": 265, "cap": "From the manufacturer's manual, page 5."}, {"html": "Gently pull the upper filter assembly apart."}]}, {"title": "Rinse and put back", "items": [{"img": "/img/kitchenaid-dishwasher-care/filter-rinse-p6.png", "w": 371, "h": 279, "cap": "From the manufacturer's manual, page 6."}, {"html": "Rinse the filters under running water until most soil is gone."}, {"img": "/img/kitchenaid-dishwasher-care/filter-rinse-plate-p6.png", "w": 384, "h": 279, "cap": "From the manufacturer's manual, page 6."}, {"html": "Hard soil or white deposits: use a <strong>soft</strong> brush."}, {"img": "/img/kitchenaid-dishwasher-care/filter-video-qr-p6.png", "w": 228, "h": 209, "cap": "Scan for the manufacturer's video on putting the filter back. From the manual, page 6."}, {"html": "Put the filters back fully before the next cycle."}]}, {"title": "Rinse aid, salt, time away", "items": [{"html": "Keep <strong>rinse aid</strong> filled for dry dishes."}, {"img": "/img/kitchenaid-dishwasher-care/salt-reservoir-p5.png", "w": 329, "h": 151, "cap": "Salt reservoir, under the lower rack on the left. From the manufacturer's manual, page 5."}, {"html": "<strong>Low-salt light</strong> (some models): refill with <strong>dishwasher softener salt</strong> only. Remove the lower rack, unscrew the cap, fill to the edge with the funnel, wipe away salt and screw the cap on tightly. Run a cycle right away. Unsure? Contact property management."}, {"html": "Away for a long time, or risk of freezing: tell property management."}]}]}, "tr": {"label": "Cihaz Bak\u0131m\u0131", "pdf": "/files/kitchenaid-dishwasher-care-tr.pdf", "pages": [{"src": "/pages/kitchenaid-dishwasher-care-tr-1.jpg", "w": 1870, "h": 1445}], "kb": 292, "phone": {"kicker": "BULA\u015eIK MAK\u0130NES\u0130 KILAVUZU", "title": "Bula\u015f\u0131k Makinesi Bak\u0131m\u0131", "model": "KitchenAid bula\u015f\u0131k makinesi, paslanmaz \u00e7elik i\u00e7 hazne (model teyit edilecek)", "important": "Program s\u0131ras\u0131nda veya hemen sonras\u0131nda \u0131s\u0131t\u0131c\u0131ya dokunmay\u0131n. Filtrelerde asla tel f\u0131r\u00e7a veya ovma s\u00fcngeri, d\u0131\u015f y\u00fczeyde a\u015f\u0131nd\u0131r\u0131c\u0131 temizleyici kullanmay\u0131n. Sirkeyi sadece ara s\u0131ra kullan\u0131n: asittir ve makineye zarar verebilir.", "stop": "Bir filtre k\u0131r\u0131k veya yerine oturmuyor. Su s\u0131z\u0131yor veya makinenin alt\u0131nda su birikiyor. Makine iyi bo\u015faltm\u0131yor. Temizlikten sonra beyaz kal\u0131nt\u0131 tekrar olu\u015fuyor. Emin de\u011filseniz ya da sorun devam ederse cihaz\u0131 kullanmay\u0131 b\u0131rak\u0131n ve m\u00fclk y\u00f6netimine ba\u015fvurun.", "footer": "Bu KitchenAid bula\u015f\u0131k makinesinin \u00fcretici kullan\u0131m k\u0131lavuzu W11589935&#x27;e dayan\u0131r. Resimler o k\u0131lavuzdan al\u0131nm\u0131\u015ft\u0131r.", "steps": [{"title": "D\u0131\u015f ve i\u00e7 temizlik", "items": [{"html": "D\u0131\u015f y\u00fczey: sadece yumu\u015fak nemli bez ve hafif deterjan. A\u015f\u0131nd\u0131r\u0131c\u0131 temizleyici kullanmay\u0131n (paslanmaz kapaklarda parmak izine dayan\u0131kl\u0131 kaplama olabilir)."}, {"html": "<strong>Ayda bir</strong>: paket talimat\u0131na g\u00f6re affresh\u00ae gibi bir bula\u015f\u0131k makinesi temizleyicisiyle program \u00e7al\u0131\u015ft\u0131r\u0131n."}, {"html": "Beyaz kal\u0131nt\u0131: alt rafa cam veya makinede y\u0131kanabilir bir bardak i\u00e7inde 2 bardak (500 mL) beyaz sirke <strong>koyun</strong> (d\u00f6kmeyin). Havayla kurutma veya enerji tasarruflu kurutma se\u00e7ene\u011fiyle ve <strong>deterjans\u0131z</strong> tam bir program \u00e7al\u0131\u015ft\u0131r\u0131n."}]}, {"title": "Filtreleri temizleyin", "items": [{"html": "Ne s\u0131kl\u0131kla: tabaklar\u0131 sadece s\u0131y\u0131r\u0131yorsan\u0131z 2 ayda bir; \u00f6nce durularsan\u0131z 4 ayda bir ile y\u0131lda bir aras\u0131. <strong>Beyaz kal\u0131nt\u0131 (sert su): ayda bir.</strong>"}, {"img": "/img/kitchenaid-dishwasher-care/filter-twist-p5.png", "w": 367, "h": 170, "cap": "\u00dcst filtreyi \u00e7evirin. \u00dcretici k\u0131lavuzu, sayfa 5."}, {"html": "\u00dcst filtreyi <strong>saat y\u00f6n\u00fcn\u00fcn tersine 1/4 tur</strong> \u00e7evirin ve \u00e7\u0131kar\u0131n."}, {"img": "/img/kitchenaid-dishwasher-care/filter-separate-p5.png", "w": 368, "h": 265, "cap": "\u00dcretici k\u0131lavuzu, sayfa 5."}, {"html": "\u00dcst filtre par\u00e7alar\u0131n\u0131 nazik\u00e7e birbirinden ay\u0131r\u0131n."}]}, {"title": "Durulay\u0131n ve tak\u0131n", "items": [{"img": "/img/kitchenaid-dishwasher-care/filter-rinse-p6.png", "w": 371, "h": 279, "cap": "\u00dcretici k\u0131lavuzu, sayfa 6."}, {"html": "Filtreleri kirin \u00e7o\u011fu gidene kadar akan suyun alt\u0131nda durulay\u0131n."}, {"img": "/img/kitchenaid-dishwasher-care/filter-rinse-plate-p6.png", "w": 384, "h": 279, "cap": "\u00dcretici k\u0131lavuzu, sayfa 6."}, {"html": "Sert kir veya beyaz birikinti: <strong>yumu\u015fak</strong> bir f\u0131r\u00e7a kullan\u0131n."}, {"img": "/img/kitchenaid-dishwasher-care/filter-video-qr-p6.png", "w": 228, "h": 209, "cap": "Filtrenin tak\u0131lmas\u0131yla ilgili \u00fcretici videosu i\u00e7in taray\u0131n. K\u0131lavuz, sayfa 6."}, {"html": "Bir sonraki programdan \u00f6nce filtreleri tamamen yerine tak\u0131n."}]}, {"title": "Parlat\u0131c\u0131, tuz, uzun s\u00fcre yokluk", "items": [{"html": "Kuru bula\u015f\u0131k i\u00e7in <strong>parlat\u0131c\u0131</strong> haznesini dolu tutun."}, {"img": "/img/kitchenaid-dishwasher-care/salt-reservoir-p5.png", "w": 329, "h": 151, "cap": "Tuz haznesi, alt raf\u0131n alt\u0131nda solda. \u00dcretici k\u0131lavuzu, sayfa 5."}, {"html": "<strong>Tuz \u0131\u015f\u0131\u011f\u0131</strong> (baz\u0131 modellerde): sadece <strong>bula\u015f\u0131k makinesi tuzu</strong> ile doldurun. Alt raf\u0131 \u00e7\u0131kar\u0131n, kapa\u011f\u0131 a\u00e7\u0131n, huniyle a\u011fz\u0131na kadar doldurun, d\u00f6k\u00fclen tuzu silin ve kapa\u011f\u0131 s\u0131k\u0131ca kapat\u0131n. Hemen bir program \u00e7al\u0131\u015ft\u0131r\u0131n. Emin de\u011filseniz m\u00fclk y\u00f6netimine ba\u015fvurun."}, {"html": "Uzun s\u00fcre evde olmayacaksan\u0131z veya donma riski varsa: m\u00fclk y\u00f6netimine haber verin."}]}]}}}, {"key": "kitchenaid-dishwasher-troubleshooting", "label": "Troubleshooting", "pdf": "/files/kitchenaid-dishwasher-troubleshooting.pdf", "pages": [{"src": "/pages/kitchenaid-dishwasher-troubleshooting-1.jpg", "w": 1870, "h": 1445}], "kb": 102, "phone": {"kicker": "DISHWASHER GUIDE", "title": "Dishwasher Troubleshooting", "model": "KitchenAid dishwasher, stainless steel tub (model to confirm)", "important": "Water leaking or overfilling (codes F1E1, F1E5, F8E4, F8E5): keep the door closed. Turn off the water to the dishwasher if you know how. If the water cannot be turned off, do NOT turn off the power. Press Cancel once to stop the alarm, then contact property management right away.", "stop": "Water leaks, overflows or pools under the dishwasher. Any code other than H2O, or H2O comes back. It will not drain. A burning smell or smoke. If you are unsure, or if the problem continues, stop using the appliance and contact property management.", "footer": "Based on the manufacturer&#x27;s Owner&#x27;s Manual W11589935 for this KitchenAid dishwasher. Pictures are taken from that manual.", "steps": [{"title": "Won't start", "items": [{"html": "Close the door tightly until it latches."}, {"html": "Press <strong>Start/Resume</strong>, then close the door <strong>within 4 seconds</strong>. Light flashing: press Start/Resume again and close the door."}, {"html": "Check that a cycle was chosen."}, {"html": "Still nothing: the breaker or water may be off. Contact property management."}]}, {"title": "Long cycles, wet or spotty", "items": [{"html": "<strong>2 to 5 hours is normal.</strong> The first cycle and some options take longer."}, {"html": "Wet dishes: fill the <strong>rinse aid</strong>."}, {"img": "/img/kitchenaid-dishwasher-troubleshooting/filter-twist-p5.png", "w": 367, "h": 170, "cap": "Upper filter. From the manufacturer's manual, page 5."}, {"html": "White spots or residue: hard water. Clean the filters monthly and run a dishwasher cleaner or vinegar rinse (see Appliance Care). Tell property management if it continues."}]}, {"title": "Water or drain codes", "items": [{"html": "<strong>H2O</strong>: no water reaching the dishwasher. Contact property management to check the water supply. When it is fixed, press <strong>Start/Resume</strong>."}, {"html": "<strong>F9E1</strong>: will not drain. Contact property management (the drain hose or disposal connection may need checking)."}, {"html": "<strong>F1E1, F1E5, F8E4, F8E5</strong>: follow the IMPORTANT box above."}]}, {"title": "Other codes and blinking lights", "items": [{"html": "<strong>F1E2, F6E1, F7E2, F7E3, F9E3</strong>: the dishwasher needs service. Contact property management."}, {"html": "No display? The same faults show as blinking lights, for example <strong>8 blinks, pause, 1 blink = H2O</strong>. Count the blinks and tell property management."}, {"html": "Press <strong>Cancel</strong> once to stop an alarm sound."}]}]}, "tr": {"label": "Sorun Giderme", "pdf": "/files/kitchenaid-dishwasher-troubleshooting-tr.pdf", "pages": [{"src": "/pages/kitchenaid-dishwasher-troubleshooting-tr-1.jpg", "w": 1870, "h": 1445}], "kb": 104, "phone": {"kicker": "BULA\u015eIK MAK\u0130NES\u0130 KILAVUZU", "title": "Bula\u015f\u0131k Makinesi Sorun Giderme", "model": "KitchenAid bula\u015f\u0131k makinesi, paslanmaz \u00e7elik i\u00e7 hazne (model teyit edilecek)", "important": "Su s\u0131z\u0131nt\u0131s\u0131 veya ta\u015fma (kodlar F1E1, F1E5, F8E4, F8E5): kapa\u011f\u0131 kapal\u0131 tutun. Biliyorsan\u0131z makinenin suyunu kapat\u0131n. Su kapat\u0131lam\u0131yorsa elektri\u011fi KAPATMAYIN. Alarm\u0131 durdurmak i\u00e7in Cancel&#x27;a bir kez bas\u0131n, sonra hemen m\u00fclk y\u00f6netimine ba\u015fvurun.", "stop": "Su s\u0131z\u0131yor, ta\u015f\u0131yor veya makinenin alt\u0131nda birikiyor. H2O d\u0131\u015f\u0131nda herhangi bir kod, ya da H2O tekrar \u00e7\u0131k\u0131yor. Su bo\u015faltm\u0131yor. Yan\u0131k kokusu veya duman. Emin de\u011filseniz ya da sorun devam ederse cihaz\u0131 kullanmay\u0131 b\u0131rak\u0131n ve m\u00fclk y\u00f6netimine ba\u015fvurun.", "footer": "Bu KitchenAid bula\u015f\u0131k makinesinin \u00fcretici kullan\u0131m k\u0131lavuzu W11589935&#x27;e dayan\u0131r. Resimler o k\u0131lavuzdan al\u0131nm\u0131\u015ft\u0131r.", "steps": [{"title": "\u00c7al\u0131\u015fm\u0131yor", "items": [{"html": "Kapa\u011f\u0131 kilitlenene kadar s\u0131k\u0131ca kapat\u0131n."}, {"html": "<strong>Start/Resume</strong>&#x27;a bas\u0131n, sonra kapa\u011f\u0131 <strong>4 saniye i\u00e7inde</strong> kapat\u0131n. I\u015f\u0131k yan\u0131p s\u00f6n\u00fcyorsa: Start/Resume&#x27;a tekrar bas\u0131n ve kapa\u011f\u0131 kapat\u0131n."}, {"html": "Bir program se\u00e7ildi\u011fini kontrol edin."}, {"html": "H\u00e2l\u00e2 \u00e7al\u0131\u015fm\u0131yor: sigorta veya su kapal\u0131 olabilir. M\u00fclk y\u00f6netimine ba\u015fvurun."}]}, {"title": "Uzun program, \u0131slak veya lekeli bula\u015f\u0131k", "items": [{"html": "<strong>2 ila 5 saat normaldir.</strong> \u0130lk program ve baz\u0131 se\u00e7enekler daha uzun s\u00fcrer."}, {"html": "Islak bula\u015f\u0131k: <strong>parlat\u0131c\u0131</strong> haznesini doldurun."}, {"img": "/img/kitchenaid-dishwasher-troubleshooting/filter-twist-p5.png", "w": 367, "h": 170, "cap": "\u00dcst filtre. \u00dcretici k\u0131lavuzu, sayfa 5."}, {"html": "Beyaz lekeler veya kal\u0131nt\u0131: sert su. Filtreleri ayda bir temizleyin ve bula\u015f\u0131k makinesi temizleyicisi veya sirke ile program \u00e7al\u0131\u015ft\u0131r\u0131n (Cihaz Bak\u0131m\u0131&#x27;na bak\u0131n). Devam ederse m\u00fclk y\u00f6netimine haber verin."}]}, {"title": "Su veya bo\u015faltma kodlar\u0131", "items": [{"html": "<strong>H2O</strong>: makineye su gelmiyor. Su beslemesini kontrol etmesi i\u00e7in m\u00fclk y\u00f6netimine ba\u015fvurun. D\u00fczeltildi\u011finde <strong>Start/Resume</strong>&#x27;a bas\u0131n."}, {"html": "<strong>F9E1</strong>: su bo\u015faltm\u0131yor. M\u00fclk y\u00f6netimine ba\u015fvurun (bo\u015faltma hortumu veya \u00e7\u00f6p \u00f6\u011f\u00fct\u00fcc\u00fc ba\u011flant\u0131s\u0131n\u0131n kontrol edilmesi gerekebilir)."}, {"html": "<strong>F1E1, F1E5, F8E4, F8E5</strong>: yukar\u0131daki \u00d6NEML\u0130 kutusundaki ad\u0131mlar\u0131 izleyin."}]}, {"title": "Di\u011fer kodlar ve yan\u0131p s\u00f6nen \u0131\u015f\u0131klar", "items": [{"html": "<strong>F1E2, F6E1, F7E2, F7E3, F9E3</strong>: makinenin servise ihtiyac\u0131 var. M\u00fclk y\u00f6netimine ba\u015fvurun."}, {"html": "Ekran yok mu? Ayn\u0131 ar\u0131zalar yan\u0131p s\u00f6nen \u0131\u015f\u0131klarla g\u00f6sterilir, \u00f6rne\u011fin <strong>8 yan\u0131p s\u00f6nme, duraklama, 1 yan\u0131p s\u00f6nme = H2O</strong>. Yan\u0131p s\u00f6nmeleri say\u0131n ve m\u00fclk y\u00f6netimine bildirin."}, {"html": "Alarm sesini durdurmak i\u00e7in <strong>Cancel</strong>&#x27;a bir kez bas\u0131n."}]}]}}}], "tr": {"title": "KitchenAid bula\u015f\u0131k makinesi", "sub": "Paslanmaz \u00e7elik i\u00e7 hazne (k\u0131lavuz W11589935)"}}, {"slug": "whirlpool-dryer-electronic", "title": "Whirlpool dryer", "sub": "Electronic controls (manual W10385092A)", "icon": "dryer", "guides": [{"key": "whirlpool-dryer-electronic-how-to-use", "label": "How to Use", "pdf": "/files/whirlpool-dryer-electronic-how-to-use.pdf", "pages": [{"src": "/pages/whirlpool-dryer-electronic-how-to-use-1.jpg", "w": 991, "h": 1406}, {"src": "/pages/whirlpool-d
